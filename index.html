    el.addEventListener('click', async e => {
      const th = e.target.closest('th[data-sort]');
      if (th) { const k = th.dataset.sort; this.orden = { k, d: this.orden.k === k ? -this.orden.d : (k === 'nombre' ? 1 : -1) }; Prefs.set('ordProv', this.orden); this.pintar(el); return; }
      const ed = e.target.closest('[data-pv-ed]');
      if (ed) { e.stopPropagation(); if (await ProveedorForm.abrir(Datos.prov(ed.dataset.pvEd))) this.pintar(el); return; }
      const pg = e.target.closest('[data-pg]');
      if (pg && !pg.disabled) { this.pag = +pg.dataset.pg; this.pintar(el); }
    });
    el.addEventListener('change', e => { if (e.target.matches('[data-pp]')) { Prefs.set('filas', +e.target.value); this.pag = 1; this.pintar(el); } });
    this.pintar(el);
    if (q.nuevo && Permiso.puede('editar')) setTimeout(async () => { const np = await ProveedorForm.abrir(); if (np) Router.ir('/proveedor/' + np.id); else Router.ir('/proveedores'); }, 50);
  },
  stats() {
    const m = new Map();
    Datos.ordenes.forEach(o => {
      let x = m.get(o.proveedorId);
      if (!x) { x = { n: 0, total: 0, ultima: '' }; m.set(o.proveedorId, x); }
      if (Modelo.cuenta(o)) { x.n++; x.total += Modelo.valor(o); }
      if (o.fecha > x.ultima) x.ultima = o.fecha;
    });
    return m;
  },
  lista() {
    const f = this.filtros();
    const st = this.stats();
    let l = Datos.proveedores.filter(p => (f.estado === 'activos' ? p.activo : f.estado === 'inactivos' ? !p.activo : true) &&
      (!f.datos || (f.datos === 'completos') === ProveedorService.completo(p)) &&
      (!f.mov || (f.mov === 'aqui' ? st.has(p.id) : f.mov === 'reciente' ? (p.historico && p.historico.hasta >= '2025-01') : (!st.has(p.id) && (!p.historico || p.historico.hasta < '2025-01')))) &&
      ProveedorService.coincide(p, f.q));
    const { k, d } = this.orden || { k: 'uso', d: -1 };
    const val = {
      nombre: p => p.nombre,
      uso: p => ((st.get(p.id) || {}).n || 0) * 1e6 + (p.historico ? p.historico.ordenes : 0) + (p.historico && p.historico.hasta >= '2025-01' ? 5e5 : 0),
      total: p => (st.get(p.id) || {}).total || 0,
      ultima: p => (st.get(p.id) || {}).ultima || (p.historico ? p.historico.hasta : '') || ''
    }[k] || (p => p.nombre);
    l.sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y, 'es') : x - y) * d || a.nombre.localeCompare(b.nombre, 'es'); });
    return l;
  },
  pintar(el) {
    const l = this.lista();
    const st = this.stats();
    const porPag = Prefs.get('filas', 25);
    const paginas = Math.max(1, Math.ceil(l.length / porPag));
    if (this.pag > paginas) this.pag = paginas;
    const vis = l.slice((this.pag - 1) * porPag, this.pag * porPag);
    const th = (key, t, cls) => '<th class="sortable' + (cls ? ' ' + cls : '') + (this.orden.k === key ? ' sorted' : '') + '" data-sort="' + key + '">' + t +
      '<span class="sarrow">' + (this.orden.k === key ? (this.orden.d > 0 ? '▲' : '▼') : '▾') + '</span></th>';
    if (!l.length) {
      $('#pvTabla', el).innerHTML = Comp.vacio('building', 'Ningún proveedor coincide', 'Pruebe con otra búsqueda o cree uno nuevo.');
      $('#pvPager', el).innerHTML = '';
      return;
    }
    $('#pvTabla', el).innerHTML = '<table class="tbl compacta"><thead><tr>' + th('nombre', 'Proveedor') + '<th>NIT</th><th>Teléfono</th><th>Condiciones</th>' +
      th('uso', 'Órdenes', 'num') + th('total', 'Comprado', 'num') + th('ultima', 'Última') + '<th>En el Excel</th><th></th></tr></thead><tbody>' +
      vis.map(p => {
        const s = st.get(p.id) || { n: 0, total: 0, ultima: '' };
        const falt = ProveedorService.faltantes(p);
        return '<tr class="row-click" data-ir="/proveedor/' + attr(p.id) + '"' + (p.activo ? '' : ' style="opacity:.6"') + '><td style="max-width:320px">' + Comp.provCelda(p) + '</td>' +
          '<td class="mono nowrap">' + (p.nit ? esc(p.nit) : '<span class="pill p-amber np" data-tip="Le falta: ' + attr(falt.join(', ')) + '">Por completar</span>') + '</td>' +
          '<td class="nowrap">' + esc(p.telefono || p.celular || '') + '</td>' +
          '<td class="nowrap txt-2">' + (p.formaPago ? esc(FORMAS_PAGO[p.formaPago]) + (p.plazoDias ? ' · ' + p.plazoDias + ' d' : '') : '<span class="txt-3">—</span>') + '</td>' +
          '<td class="num">' + (s.n || '<span class="txt-3">0</span>') + '</td><td class="num">' + (s.total ? Money.redondo(s.total) : '<span class="txt-3">—</span>') + '</td>' +
          '<td class="nowrap">' + (s.ultima ? Fecha.corta(s.ultima) : '<span class="txt-3">—</span>') + '</td>' +
          '<td class="nowrap">' + (p.historico ? '<span class="pill p-gray np" data-tip="' + attr(p.historico.ordenes + ' órdenes en el Excel, de ' + p.historico.desde + ' a ' + p.historico.hasta) + '">Excel · ' +
            p.historico.ordenes + ' · ' + esc(p.historico.desde.slice(0, 4)) + (p.historico.hasta.slice(0, 4) !== p.historico.desde.slice(0, 4) ? '–' + esc(p.historico.hasta.slice(2, 4)) : '') + '</span>' : '<span class="txt-3 fs11">Nuevo</span>') +
            (p.fusionadoCon ? ' <span class="pill p-gray np" data-tip="Sus órdenes pasaron a otra ficha">Fusionado</span>' : p.activo ? '' : ' <span class="pill p-red np">Inactivo</span>') + '</td>' +
          '<td class="nowrap tr">' + si('editar', '<a class="btn btn-ghost btn-icon btn-sm" href="#/orden-nueva?proveedor=' + attr(p.id) + '" data-tip="Nueva orden para este proveedor" aria-label="Nueva orden">' + Icon('filePlus', '', 13) + '</a>' +
          '<button class="btn btn-ghost btn-icon btn-sm" data-pv-ed="' + attr(p.id) + '" data-tip="Editar sus datos" aria-label="Editar">' + Icon('edit', '', 13) + '</button>') + '</td></tr>';
      }).join('') + '</tbody></table>';
    $('#pvPager', el).innerHTML = Comp.pager(l.length, this.pag, porPag, 'proveedores');
  }
};

const VistaEquipos = {
  titulo() { return ['Equipos y destinos', 'A dónde va cada compra: vehículos, maquinaria, canoas y sedes']; },
  render(el, p, q) {
    const f = Object.assign({ q: '', tipo: '' }, Prefs.get('filEq', {}));

      ' · cada orden puede ir a uno, y así se sabe cuánto se gasta en cada equipo</div></div>' +
      '<div class="ph-actions">' + si('editar', '<button class="btn btn-primary" id="eqNuevo">' + Icon('plus', '', 14) + 'Nuevo</button>') + '</div></div>' +
      '<div class="card mb12"><div class="card-b" style="padding:12px 14px"><div class="filters">' +
        '<div class="field grow"><label>Búsqueda</label><input class="inp" id="efQ" placeholder="Nombre, placa, alias…" value="' + attr(f.q) + '"></div>' +
        '<div class="field"><label>Tipo</label><select class="inp" id="efTipo"><option value="">Todos</option>' +
          Object.keys(TIPOS_EQUIPO).map(k => '<option value="' + k + '"' + (f.tipo === k ? ' selected' : '') + '>' + TIPOS_EQUIPO[k] + '</option>').join('') + '</select></div></div></div></div>' +
      '<div class="card"><div class="tbl-wrap" id="eqTabla"></div></div>';
    const cambiar = () => { Prefs.set('filEq', { q: $('#efQ', el).value.trim(), tipo: $('#efTipo', el).value }); this.pintar(el); };
    $('#efQ', el).addEventListener('input', U.debounce(cambiar, 150));
    $('#efTipo', el).addEventListener('change', cambiar);
    if ($('#eqNuevo', el)) $('#eqNuevo', el).onclick = async () => { if (await EquipoForm.abrir()) this.pintar(el); };
    el.addEventListener('click', async e => {
      const ed = e.target.closest('[data-eq-ed]');
      if (ed) { e.stopPropagation(); if (await EquipoForm.abrir(Datos.equipo(ed.dataset.eqEd))) this.pintar(el); }
    });
    this.pintar(el);
    if (q.ver && Datos.equipo(q.ver) && Permiso.puede('editar')) setTimeout(async () => { if (await EquipoForm.abrir(Datos.equipo(q.ver))) this.pintar(el); }, 50);
  },
  pintar(el) {
    const f = Object.assign({ q: '', tipo: '' }, Prefs.get('filEq', {}));
    const st = new Map();
    Datos.ordenes.filter(Modelo.cuenta).forEach(o => {
      if (!o.equipoId) return;
      let x = st.get(o.equipoId); if (!x) { x = { n: 0, total: 0, ultima: '' }; st.set(o.equipoId, x); }
      x.n++; x.total += Modelo.valor(o); if (o.fecha > x.ultima) x.ultima = o.fecha;
    });
    const orden = Object.keys(TIPOS_EQUIPO);
    const l = Datos.equipos.filter(x => (!f.tipo || x.tipo === f.tipo) && EquipoService.coincide(x, f.q))
      .sort((a, b) => (b.activo - a.activo) || orden.indexOf(a.tipo) - orden.indexOf(b.tipo) || ((st.get(b.id) || {}).total || 0) - ((st.get(a.id) || {}).total || 0) || a.nombre.localeCompare(b.nombre, 'es'));
    if (!l.length) { $('#eqTabla', el).innerHTML = Comp.vacio('truck', 'Nada coincide', 'Pruebe con otra búsqueda o cree uno nuevo.'); return; }
    const pillTipo = { carga: 'p-blue', maquinaria: 'p-sun', remolque: 'p-violet', canoa: 'p-green', liviano: 'p-brand', motor: 'p-amber', sede: 'p-gray', otro: 'p-gray' };
    $('#eqTabla', el).innerHTML = '<table class="tbl compacta"><thead><tr><th>Nombre</th><th>Tipo</th><th>Placa o código</th><th class="num">Órdenes</th><th class="num">Comprado</th><th>Última</th><th></th></tr></thead><tbody>' +
      l.map(x => {
        const s = st.get(x.id) || { n: 0, total: 0, ultima: '' };
        const sub = [x.clase, x.detalle].filter(Boolean).join(' · ');
        return '<tr class="row-click" data-ir="/ordenes?equipo=' + attr(x.id) + '"' + (x.activo ? '' : ' style="opacity:.6"') + '><td><div class="fw6">' + esc(x.nombre) + (x.activo ? '' : ' <span class="pill p-red np">Inactivo</span>') + '</div>' +
          (sub ? '<div class="fs12 txt-2">' + esc(sub) + '</div>' : '') +
          (x.alias && x.alias.length ? '<div class="fs11 txt-3 trunc" style="max-width:340px">También: ' + esc(x.alias.join(' · ')) + '</div>' : '') + '</td>' +
          '<td><span class="pill np ' + (pillTipo[x.tipo] || 'p-gray') + '">' + esc(TIPOS_EQUIPO[x.tipo]) + '</span></td><td class="mono">' + esc(x.placa || '') + '</td>' +
          '<td class="num">' + (s.n || '<span class="txt-3">0</span>') + '</td><td class="num">' + (s.total ? Money.redondo(s.total) : '<span class="txt-3">—</span>') + '</td>' +
          '<td class="nowrap">' + (s.ultima ? Fecha.corta(s.ultima) : '<span class="txt-3">—</span>') + '</td>' +
          '<td class="tr">' + si('editar', '<button class="btn btn-ghost btn-icon btn-sm" data-eq-ed="' + attr(x.id) + '" data-tip="Editar" aria-label="Editar">' + Icon('edit', '', 13) + '</button>') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
};

    }
    if (tab === 'articulo') {
      const l = Analitica.ranking(lista, 'articulo').sort((a, b) => b.valor - a.valor || b.n - a.n);

            '<td class="num">' + (c && c.valor ? Money.fmt(c.valor) : '<span class="txt-3">—</span>') + '</td><td class="num">' + x.proveedores.size + '</td></tr>'; }).join('') +
        '</tbody></table></div></div>';

            '<td class="num ' + (dif > 0 ? 'txt-dang' : dif < 0 ? 'txt-ok' : 'txt-3') + '">' + (dif == null ? '—' : (dif > 0 ? '+' : '') + dif + ' %') + '</td><td>' + barra(x.valor) + '</td></tr>'; }).join('') +
        '</tbody></table></div></div>';
    }
    if (tab === 'estado') {
      const todos = lista.filter(o => o.tipo !== 'COTIZACION');

        '</tbody></table></div></div></div>';
    }
    return '';
  }
};

const Respaldo = {
  FORMATO: 'sinugravas-facturacion',
  /** Lo recuerda a quien administra: con uno que lo haga basta, porque la nube es una sola */
  vencido() {
    if (!Datos.cfg || !Datos.ordenes.length || !Permiso.puede('configurar')) return false;
    const r = Datos.cfg.ultimoRespaldo;
    return !r || Date.now() - new Date(r) > 7 * 864e5;
  },
  /** El respaldo con lo que hay en un almacén (la nube, o la base vieja de este navegador) */
  empacar(datos) {
    const cfg = (datos.configuracion || []).find(c => c.id === 'general');
    return { formato: this.FORMATO, modulo: 'facturacion', versionFormato: 1, version: APP.version, esquema: APP.esquema, creado: Fecha.ahora(),
      empresa: (cfg && cfg.empresa && cfg.empresa.nombre) || APP.empresa, conteos: Object.fromEntries(COLECCIONES.map(c => [c, (datos[c] || []).length])), datos };
  },
  /* opts.archivos: con los archivos adjuntos (en la nube hay que bajarlos uno
     por uno; opts.avance(n, total) los va contando) */
  async armar(opts) {
    opts = opts || {};
    const datos = {};
    for (const c of COLECCIONES) datos[c] = await db.getAll(c);
    if (db.nube && opts.archivos !== false) {
      for (let i = 0; i < datos.adjuntos.length; i++) {
        const a = datos.adjuntos[i];
        if (opts.avance) opts.avance(i + 1, datos.adjuntos.length);
        const b = await Nube.bajar(a.ruta);
        if (b) a.datos = await U.leerArchivo(b);
      }
    }
    return this.empacar(datos);
  },
  async crear(opts) {
    const obj = await this.armar(opts);
    U.descargar(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }), Exportar.nombre('respaldo-facturacion-sinugravas', 'json'));
    /* Queda anotado para todos cuándo fue el último (lo anota quien administra) */
    if (Permiso.puede('configurar')) {
      try {
        await Datos.lote([{ col: 'configuracion', tipo: 'put', doc: Object.assign(U.clonar(Datos.cfg), { ultimoRespaldo: Fecha.ahora() }) },
          Datos.evento('respaldo', 'sistema', '', Txt.plural(obj.conteos.ordenes, 'orden', 'órdenes') + ', ' + obj.conteos.proveedores + ' proveedores')]);
      } catch (e) { console.warn('El respaldo se descargó, pero no se anotó:', e); }
    }
    return obj;
  },
  async leer(file) {
    const txt = await U.leerArchivo(file, 'texto');
    let obj;
    try { obj = JSON.parse(txt); } catch (e) { throw new ErrorDominio('El archivo no es un respaldo válido: no se pudo leer.'); }
    if (!obj || obj.formato !== this.FORMATO || !obj.datos) throw new ErrorDominio('Ese archivo no es un respaldo de Facturación SINUGRAVAS.');
    for (const c of COLECCIONES) {
      const l = obj.datos[c] || [];
      if (!Array.isArray(l) || l.some(d => !d || typeof d.id !== 'string')) throw new ErrorDominio('El respaldo está dañado en «' + c + '».');
    }
    return obj;
  },
  /** Reemplaza todo por lo del respaldo, en una sola operación. En la nube,
      antes se suben los archivos adjuntos que trae (avance(n, total)) */
  async restaurar(obj, avance) {
    Permiso.exigir('configurar');
    const ops = [];
    for (const c of COLECCIONES) {
      (await db.getAll(c)).forEach(d => ops.push({ col: c, tipo: 'del', id: d.id }));
      (obj.datos[c] || []).forEach(d => ops.push({ col: c, tipo: 'put', doc: d }));
    }
    ops.push(Datos.evento('restaurar', 'sistema', '', 'Respaldo del ' + Fecha.stamp(obj.creado)));
    Cargando.on();
    /* Cada orden sigue siendo de quien la hizo */
    try { await db.lote(ops, { avance, conAutor: true }); } finally { Cargando.off(); }
    await Datos.cargar();
    /* Un respaldo de una versión anterior se pone al día al restaurarlo */
    if ((Datos.cfg.semillas || 0) >= 1) await Semillas.aplicar();
    Bus.emit('datos:cambio'); Canal.avisar();
  },
  async borrarOrdenes() {
    Permiso.exigir('configurar');
    const ops = Datos.ordenes.map(o => ({ col: 'ordenes', tipo: 'del', id: o.id }));
    (await db.getAll('adjuntos')).forEach(a => ops.push({ col: 'adjuntos', tipo: 'del', id: a.id }));
    /* Sin órdenes, la próxima toma el número fijado en Configuración */
    ops.push(Datos.evento('borrar', 'sistema', '', 'Se borraron ' + Txt.plural(Datos.ordenes.length, 'orden', 'órdenes')));
    await Datos.lote(ops);
  }
};

      } catch (e) { Modal.cerrar(m); Modal.alerta('No se pudo restaurar', esc(e.message) + '<br>No se cambió nada.', 'err'); }
    });
    Migracion.unir(el);
    $('#rsVerif', el).onclick = () => this.verificar(el);
    if ($('#rsBorrarOrd', el)) $('#rsBorrarOrd', el).onclick = async () => {
      if (!await Modal.confirmar({ titulo: 'Borrar todas las órdenes', peligro: true, ok: 'Borrar', escribir: 'BORRAR',

    $('#rsInt', el).innerHTML = res.map(x => '<div class="flex g8 mb8" style="align-items:flex-start"><span class="' + ic[x.nivel][1] + '" style="' + (x.nivel === 'warn' ? 'color:var(--warn-500)' : '') + '">' +

      '<div class="fs11 txt-3">Revisado el ' + esc(Fecha.stamp(Fecha.ahora())) + '.</div>';

      this.verificar(el);
    });

};

      const q = ev.target.closest('[data-quitar-sol]');

  leerSol() {
    const c = this.c;

      s.nombre = Txt.mayus($('[data-f="nombre"]', tr).value.trim());

      s.telefono = $('[data-f="telefono"]', tr).value.trim();

    ce.consecutivo = { siguiente: parseInt(v('cfSig'), 10) };

    ce.documento = Object.assign({}, ce.documento, { saludoCompra: v('cfSalC'), saludoServicio: v('cfSalS'), saludoCotizacion: v('cfSalQ'), intro: v('cfIntro'),
      citar: v('cfCitar'), cierre: v('cfCierre'), lugarEntrega: v('cfLugar'), telefono: v('cfTelDoc'), filasMinimas: parseInt(v('cfFilas'), 10) });
    ce.autoriza = { nombre: Txt.mayus(v('cfAutN')), cargo: Txt.mayus(v('cfAutC')), firma: (ce.autoriza && ce.autoriza.firma) || '' };
    return c;
  },
  validar(c) {
    const e = [], ce = this.ce;
    if (!ce.empresa.nombre) e.push('Escriba la razón social de la empresa.');
    if (!(ce.consecutivo.siguiente >= 1)) e.push('El siguiente número debe ser un entero mayor que cero.');
    if (!(ce.documento.filasMinimas >= 0 && ce.documento.filasMinimas <= 30)) e.push('Los renglones mínimos deben estar entre 0 y 30.');
    const act = c.solicitantes.filter(s => s.activo);
    if (c.solicitantes.some(s => !s.nombre)) e.push('Todos los firmantes necesitan nombre.');
    if (!act.length) e.push('Deje al menos un firmante activo.');
    if (ce.empresa.correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ce.empresa.correo)) e.push('Revise el correo de la empresa.');
    return e;
  },
  async guardar() {
    const c = this.leer();
    const errores = this.validar(c);
    const box = $('#cfErr', this.el);
    if (errores.length) { box.innerHTML = '<div class="alert a-err mb12">' + Icon('warn') + '<div><ul style="margin:0;padding-left:18px">' + errores.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div></div>'; window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    box.innerHTML = '';
    const act = c.solicitantes.filter(s => s.activo);
    c.solicitantes.forEach(s => { if (!s.activo) s.predeterminado = false; });
    if (!act.some(s => s.predeterminado)) act[0].predeterminado = true;
    try {
      /* Lo común en su fila; lo de otra empresa, en la suya */
      const ops = [{ col: 'configuracion', tipo: 'put', doc: c }];
      if (this.ce !== c) ops.push({ col: 'configuracion', tipo: 'put', doc: Object.assign(this.ce, { id: this.emp }) });
      await Datos.lote(ops.concat([Datos.evento('editar', 'configuración', this.ce === c ? 'general' : this.emp, Empresa.nombre(this.emp) + ' · consecutivo ' + this.ce.consecutivo.siguiente)]));
      Router.sucio = false;
      Toast.ok('Configuración de <b>' + esc(Empresa.nombre(this.emp)) + '</b> guardada.');
      Shell.pintarEmpresa();
      Shell.refrescar();
      Router.resolver(true);
    } catch (e) { Toast.err(esc(e.message)); }
  },
  vistaPrevia() {
    const guardada = Datos.cfg, otra = Datos.cfgs[this.emp];
    Datos.cfg = Config.completar(U.clonar(this.leer()));
    if (this.emp !== 'SINUGRAVAS') Datos.cfgs[this.emp] = U.clonar(this.ce);
    try {
      const prov = ProveedorService.ordenados(true)[0];
      const eq = EquipoService.ordenados(true)[0];
      const pl = Datos.plantillas[0];
      const o = OrdenService.nueva({ proveedorId: prov && prov.id, plantillaId: pl && pl.id });
      if (!o.equipoId && eq) o.equipoId = eq.id;
      o.numero = Consecutivo.vistaPrevia(o.fecha);
      o.proveedor = Modelo.fotoProveedor(Datos.prov(o.proveedorId));
      OrdenService.normalizar(o);
      const m = Modal.abrir({ titulo: 'Así sale una orden', subtitulo: 'Con la configuración que está en pantalla (aún sin guardar) y datos de ejemplo', ancho: 'xwide',
        cuerpo: '<div class="preview-shell doc-marco" id="cfDoc"><div class="doc-escala">' + Documento.html(o, { provisional: true }) + '</div></div>',
        pie: '<button class="btn btn-primary" data-cerrar>Cerrar</button>' });
      Documento.escalar($('#cfDoc', m));
    } finally { Datos.cfg = guardada; if (this.emp !== 'SINUGRAVAS') { if (otra) Datos.cfgs[this.emp] = otra; else delete Datos.cfgs[this.emp]; } }
  }
};

  /** Ajusta la hoja al ancho de su caja, sin desplazamiento lateral */
  escalar(marco) {

    if (!caja || !pag) return;

    pag.style.transformOrigin = 'top left';
    const ajustar = () => {
      const disp = marco.clientWidth - 36;
      if (disp <= 0) return;
      const w = pag.offsetWidth, h = pag.offsetHeight;
      const s = Math.min(1, disp / w);
      pag.style.transform = s < 1 ? 'scale(' + s + ')' : '';
      caja.style.width = Math.floor(w * s) + 'px';
      caja.style.height = Math.ceil(h * s) + 'px';

    if (window.ResizeObserver) new ResizeObserver(ajustar).observe(marco);
  },
  /** Las reglas del formato, para dibujar la hoja fuera de la página */
  css() {

      let lista;
      try { lista = hoja.cssRules; } catch (e) { continue; }
      for (const r of lista) if (r.selectorText && /(^|[\s,>+~(])\.(doc-page|dp-)/.test(r.selectorText)) reglas.push(r.cssText);

  /* La hoja como imagen PNG, al doble de resolución para que se lea bien en el
     celular. Se dibuja con el mismo formato de la impresión, sin librerías:
     la hoja va dentro de un SVG y el SVG se pinta en un lienzo. */
  async imagen(o) {
    const caja = document.createElement('div');
    caja.innerHTML = '<style>' + this.css() + '</style>' + this.html(o);
    caja.style.cssText = 'position:fixed;left:-20000px;top:0';
    document.body.appendChild(caja);
    const pag = $('.doc-page', caja);
    const w = Math.ceil(pag.offsetWidth), h = Math.ceil(pag.offsetHeight);
    caja.removeAttribute('style');
    const xhtml = new XMLSerializer().serializeToString(caja);
    caja.remove();
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '"><foreignObject width="100%" height="100%">' + xhtml + '</foreignObject></svg>';
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('no se pudo dibujar la orden')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });

    g.drawImage(img, 0, 0, c.width, c.height);

  },
  /** Un clic y queda copiada: se pega con Ctrl + V en WhatsApp o en el correo.
      Si el navegador no deja copiar, se descarga la imagen. */
  async copiarImagen(o) {
    const imagen = this.imagen(o);
    const escribir = valor => navigator.clipboard.write([new ClipboardItem({ 'image/png': valor })]);
    try {
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('sin portapapeles');
      try { await escribir(imagen); } catch (e) { await escribir(await imagen); }
      Toast.ok('Orden <b class="mono">' + esc(Modelo.codigo(o)) + '</b> copiada como imagen. Péguela con <b>Ctrl + V</b> en WhatsApp o en el correo.');
    } catch (e) {
      try {
        U.descargar(await imagen, ('Orden ' + Modelo.codigo(o) + ' ' + Modelo.nombreProveedor(o)).replace(/[\\/:*?"<>|]/g, '').trim() + '.png');
        Toast.info('El navegador no dejó copiarla: se descargó la imagen de la orden ' + esc(Modelo.codigo(o)) + '.');
      } catch (x) { Toast.err('No se pudo hacer la imagen: ' + esc(x.message)); }
    }
  },
  /** Imprime (o guarda en PDF desde el diálogo del navegador) */
  imprimir(o) {
    const raiz = $('#printRoot');
    raiz.innerHTML = this.html(o);
    const titulo = document.title;
    /* El nombre que el navegador propone para el PDF */
    document.title = Modelo.codigo(o) + ' - ' + Modelo.nombreProveedor(o).replace(/[\\/:*?"<>|]/g, '');
    const fin = () => { document.title = titulo; raiz.innerHTML = ''; removeEventListener('afterprint', fin); };
    addEventListener('afterprint', fin);
    const imgs = $$('img', raiz).filter(i => !i.complete);
    Promise.all(imgs.map(i => new Promise(r => { i.onload = i.onerror = r; }))).then(() => setTimeout(() => window.print(), 60));
  }
};

/* ==========================================================================
   §13  EXPORTAR: CSV, EXCEL (.xlsx) Y NOMBRES DE ARCHIVO
   El .xlsx se arma aquí mismo (un ZIP sin compresión con sus XML), para no
   depender de librerías externas.
   ========================================================================== */
const Zip = (() => {
  let tabla = null;
  function crc32(bytes) {
    if (!tabla) {
      tabla = new Uint32Array(256);
      for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tabla[n] = c >>> 0; }
    }
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = tabla[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function escribir(archivos) {
    const enc = new TextEncoder();
    const d = new Date();
    const hora = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const fecha = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const partes = [], central = [];
    let off = 0;
    archivos.forEach(a => {
      const nombre = enc.encode(a.nombre);
      const datos = typeof a.datos === 'string' ? enc.encode(a.datos) : a.datos;
      const crc = crc32(datos);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, hora, true); lh.setUint16(12, fecha, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, datos.length, true); lh.setUint32(22, datos.length, true); lh.setUint16(26, nombre.length, true); lh.setUint16(28, 0, true);
      partes.push(new Uint8Array(lh.buffer), nombre, datos);

      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, hora, true); ch.setUint16(14, fecha, true); ch.setUint32(16, crc, true); ch.setUint32(20, datos.length, true); ch.setUint32(24, datos.length, true);

    let p = 0;

/* ==========================================================================
   §14  PUESTA AL DÍA DE LOS DATOS
   --------------------------------------------------------------------------
   Los datos de la empresa no vienen dentro del programa: viven en la nube
   (proveedores, equipos, configuración y, aparte, el histórico del Excel que
   carga 202_facturacion_historico.sql). Aquí sólo queda cómo se ponen al día
   los de versiones anteriores, por si se restaura un respaldo viejo. Una nube
   nueva arranca vacía.
   ========================================================================== */
const Semillas = {
  VERSION: 7,
  /** Corre una vez por versión: nunca pisa lo que ya existe */
  async aplicar() {
    const version = Datos.cfg.semillas || 0;
    if (version >= this.VERSION) return false;
    const ops = [];
    const cfg = U.clonar(Datos.cfg);
    cfg.semillas = this.VERSION;
    if (version >= 3 && version < 5) this.listaPropia(ops);
    if (version >= 1 && version < 6) this.estadosNuevos(ops);
    if (version >= 1 && version < 5) {
      /* Antes, borrar la última orden no devolvía su número: se devuelve ahora */
      const s = await Consecutivo.devolverA(Consecutivo.base());
      if (s < Consecutivo.base()) {
        cfg.consecutivo.siguiente = s;
        ops.push(Datos.evento('consecutivo', 'sistema', '', 'Consecutivo devuelto al ' + s + ': las últimas órdenes se habían borrado'));
      }
    }
    if (version >= 1 && version < 7) this.consecutivoBase(cfg);
    ops.push({ col: 'configuracion', tipo: 'put', doc: cfg });
    await Datos.lote(ops);
    return true;
  },
  /* v7: hacer una orden ya no cambia la configuración (en la nube, quien hace
     órdenes no puede cambiarla): el número sale de las órdenes y lo de
     Configuración es desde dónde se numera. Si allí quedó el que seguía (así lo
     dejaba la versión local), se baja a la primera orden de la plataforma, para
     que borrar la última siga devolviendo su número. */
  consecutivoBase(cfg) {
    const secs = Datos.ordenes.map(o => o.secuencia).filter(Boolean);
    if (secs.length && cfg.consecutivo.siguiente === Math.max(...secs) + 1) cfg.consecutivo.siguiente = Math.min(...secs);
  },
  /* v6: los estados siguen cómo trabaja la empresa (esperando factura → en
     contabilidad → pagada). Borrador, enviada y recibida quedan esperando la
     factura; facturada, en contabilidad. El historial conserva lo que pasó. */
  ANTES_V6: { BORRADOR: ['ESPERANDO', 'Creada'], ENVIADA: ['ESPERANDO', 'Enviada al proveedor'], RECIBIDA: ['ESPERANDO', 'Llegó el pedido'],
    FACTURADA: ['CONTABILIDAD', 'Llegó la factura'] },
  estadosNuevos(ops) {
    const m = e => (this.ANTES_V6[e] || [e])[0];
    Datos.ordenes.filter(o => this.ANTES_V6[o.estado] || (o.historial || []).some(h => this.ANTES_V6[h.estado]) ||
      (o.anulacion && this.ANTES_V6[o.anulacion.estadoPrevio])).forEach(viejo => {
      const o = U.clonar(viejo);
      o.estado = m(o.estado);
      o.historial = (o.historial || []).map(h => this.ANTES_V6[h.estado] ? Object.assign(h, { estado: m(h.estado), nota: h.nota || this.ANTES_V6[h.estado][1] }) : h);
      if (o.anulacion) o.anulacion.estadoPrevio = m(o.anulacion.estadoPrevio);
      ops.push({ col: 'ordenes', tipo: 'put', doc: o });
    });
  },
  /* v5: Facturación no se relaciona con otras plataformas: los equipos
     sembrados quedan como lista propia y sin notas que hablen de otra */
  listaPropia(ops) {
    const nota = 'No está en el maestro de activos de Flota (octubre de 2026).';
    Datos.equipos.filter(q => q.origen === 'FLOTA' || (q.notas || '').includes(nota)).forEach(q => {
      ops.push({ col: 'equipos', tipo: 'put', doc: Object.assign(U.clonar(q), { origen: q.origen === 'FLOTA' ? 'INICIAL' : q.origen,
        notas: (q.notas || '').replace(nota, 'No está en el inventario de activos de octubre de 2026.') }) });
    });
  }
};

/* ==========================================================================
   §14b  HISTÓRICO DEL EXCEL
   Las 392 órdenes del Excel de pedidos están en la nube (tabla
   facturacion.historico, que carga 202_facturacion_historico.sql), sólo para
   quien entra: se traen una vez al abrir y se arman en memoria. No tienen
   consecutivo ni estado y no cuentan en ninguna estadística. Sirven para
   buscar, consultar, imprimir de nuevo o repetir un pedido. El proveedor se
   encuentra por el nombre que tenía en el Excel (claveExcel) y sigue sus
   fusiones; el equipo, por su placa.
   ========================================================================== */
const HistoricoExcel = {
  _crudo: [], _lista: null, _idx: null, error: null,
  /** Lo trae de la nube. Si no se pudo, la plataforma sigue sin él y se avisa */
  async cargar() {
    try { this.poner(await db.historico()); this.error = null; }
    catch (e) { this.poner([]); this.error = e; console.warn('Sin el histórico del Excel:', e); }
  },
  /** Las hojas en el formato corto en que se copiaron, en el orden del libro */
  poner(lista) { this._crudo = (lista || []).slice().sort((a, b) => (a.k || 0) - (b.k || 0)); this.invalidar(); },
  crudo() { return this._crudo; },
  invalidar() { this._todas = null; this._lista = null; },
  /** Las de la empresa activa (las de JDPR traen «em»); orden(id) las encuentra todas */
  lista() {
    if (!this._todas) this.armar();
    if (!this._lista || this._lista.emp !== Empresa.activa) {
      this._lista = this._todas.filter(o => o.empresa === Empresa.activa);
      this._lista.emp = Empresa.activa;
    }
    return this._lista;
  },
  orden(id) { if (!this._todas) this.armar(); return (id && this._idx.get(id)) || null; },
  armar() {
    this._todas = this.crudo().map(r => this.convertir(r));
    this._idx = new Map(this._todas.map(o => [o.id, o]));
    this._lista = null;
  },
  /** Su lugar en el Excel lo da el número de la orden, no la fecha, que allá no
     siempre se cuidó (lo pidió Juan el 30/10/2026). Primero el año del número y
     después el número, porque SINUGRAVAS volvió a empezar desde 001 en 2017, 2022
     y 2023. Dos hojas con el mismo número, por su lugar en el libro */
  clave(o) {
    const m = /^(\d+)-(\d{2})$/.exec(o.numero || '');
    return (m ? m[2] + m[1].padStart(4, '0') : String(o.fecha || '').slice(2, 4).padStart(2, '0') + '0000') + String(o.excel.k || 0).padStart(4, '0');
  },
  /** Para ordenar de la más alta a la más baja */
  porNumero(a, b) { return HistoricoExcel.clave(b).localeCompare(HistoricoExcel.clave(a)); },
  proveedor(nombre) {
    if (!nombre) return null;
    const k = Txt.clave(nombre);
    let p = Datos.proveedores.find(x => x.claveExcel === nombre) ||
      Datos.proveedores.find(x => Txt.clave(x.nombre) === k || (x.alias || []).some(a => Txt.clave(a) === k));
    for (let i = 0; p && p.fusionadoCon && i < 9; i++) p = Datos.prov(p.fusionadoCon);
    return p || null;
  },
  /** Entre los equipos de la empresa de la hoja */
  equipo(clave, emp) {
    if (!clave) return null;
    const pn = EquipoService.placaNorm(clave), n = Txt.norm(clave);
    const l = Datos.crudo('equipos').filter(q => Empresa.de(q) === (emp || 'SINUGRAVAS'));
    return l.find(q => q.placa && EquipoService.placaNorm(q.placa) === pn) ||
      l.find(q => [q.nombre, ...(q.alias || [])].some(a => Txt.norm(a) === n)) || null;
  },
  /** Una hoja convertida a orden, con los mismos campos que una de la plataforma */
  convertir(r) {
    const emp = r.em || 'SINUGRAVAS', pre = r.em ? r.em + '-' : 'EXCEL-';
    const p = this.proveedor(r.p), q = this.equipo(r.e, emp);
    const st = r.st || 0, iv = r.iv || 0, rt = r.rt || 0;
    const pct = v => st && v ? Math.round(v / st * 1000) / 10 : 0;
    return {
      id: pre + r.k, empresa: emp, origen: 'EXCEL', numero: r.n, secuencia: null, tipo: r.t, fecha: r.f, estado: 'EXCEL',
      proveedorId: p ? p.id : null, proveedor: { nombre: r.ps || r.p || '' }, equipoId: q ? q.id : null, concepto: '', referencia: '',
      items: r.it.map(([descripcion, cantidad, unidad, valorUnitario, observacion], i) =>
        ({ id: pre + r.k + '-' + i, descripcion, cantidad: cantidad == null ? '' : cantidad, unidad: unidad || '', valorUnitario: valorUnitario || 0, observacion: observacion || '' })),
      ivaPct: pct(iv), retencionPct: pct(rt), subtotal: st, iva: iv, retencion: rt, total: r.tt || 0,
      formaPago: { C: 'CONTADO', R: 'CREDITO' }[r.fp] || '', plazoDias: r.pl || 0, cuotas: r.cu || 0, medioPago: '',
      entregaLugar: r.en || '', entregaRecibe: '', entregaCedula: '', notaProveedor: r.nt || '', notasInternas: '',
      solicitante: r.so ? { nombre: r.so[0], cargo: r.so[1], telefono: r.te || '' } : null,
      historial: [], factura: null, anulacion: null,
      excel: { k: r.k, hoja: r.h || r.n, impreso: r.ni || '', sinDia: !!r.fa, repetido: !!r.rp, proveedor: r.p || '', textoProveedor: r.ps || '' }
    };
  },
  /* Para pedir lo mismo hoy: el proveedor con sus condiciones de ahora, los
     artículos sin los precios de entonces y las unidades como se usan aquí */
  UNIDADES: { GLS: 'GLN', GALON: 'GLN', GALONES: 'GLN', MTS: 'MT', METROS: 'MT', METRO: 'MT', UNID: 'UND', UNIDAD: 'UND', UNIDADES: 'UND',
    UN: 'UND', LTS: 'LT', LITRO: 'LT', LITROS: 'LT', KILOS: 'KG', KGS: 'KG', ROLLOS: 'ROLLO', PARES: 'PAR', JUEGOS: 'JUEGO', CAJAS: 'CAJA', BULTOS: 'BULTO' },
  paraCopiar(id) {
    const o = this.orden(id);
    if (!o) return null;
    const n = OrdenService.nueva({ proveedorId: o.proveedorId });
    return Object.assign(n, {
      tipo: Empresa.tipos().includes(o.tipo) ? o.tipo : Empresa.tipoNuevo(), equipoId: o.empresa === Empresa.activa ? o.equipoId : null, numero: o.numero + ' del Excel',
      items: o.items.map(it => {
        const u = Txt.mayus(String(it.unidad || '').trim()).replace(/\.$/, '');
        return Object.assign(Modelo.itemVacio(), { descripcion: it.descripcion, cantidad: +it.cantidad > 0 ? it.cantidad : 1, unidad: this.UNIDADES[u] || u || 'UND', observacion: it.observacion });
      })
    });
  }
};

/* ==========================================================================
   §15  PRUEBAS DEL SISTEMA
   Corren contra una base en memoria aparte: guardan la real, la cambian por
   una vacía, prueban y la devuelven, pase lo que pase.
   ========================================================================== */
const Pruebas = {
  lista: [],
  def(nombre, fn) { this.lista.push({ nombre, fn }); },
  igual(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg ? msg + ': ' : '') + 'se esperaba ' + JSON.stringify(b) + ' y salió ' + JSON.stringify(a)); },
  cierto(v, msg) { if (!v) throw new Error(msg || 'no se cumplió'); },
  async falla(fn, tipo, msg) {
    try { await fn(); } catch (e) { if (!tipo || e instanceof tipo) return e; throw new Error((msg || 'error distinto') + ': ' + e.message); }
    throw new Error(msg || 'debía fallar y no falló');
  },
  /* Un histórico de juguete, con el formato de las hojas del Excel: las
     pruebas no usan los datos de la empresa */
  HISTORICO: [
    { k: 101, n: '120-19', f: '2019-03-02', t: 'PEDIDO', p: 'PROVEEDOR UNO', it: [['ACEITE DE MOTOR', 5, 'GLS', 30000, ''], ['GRASA', 1, 'UNID', 12000, '']], st: 162000, tt: 162000, fp: 'C' },
    { k: 102, n: '258-26', f: '2026-05-10', t: 'COMPRA', p: 'PROVEEDOR UNO', ps: 'PROVEEDOR UNO S.A.S', it: [['FILTRO DE ACEITE', 2, 'UND', null, '']], e: 'EQP001' },
    { k: 103, n: '289-26', f: '2026-10-20', t: 'COMPRA', p: 'PROVEEDOR DOS', it: [['MANGUERA HIDRÁULICA', 1, 'UND', null, '']], e: 'EQP001' }
  ],
  historico() { HistoricoExcel.poner(U.clonar(this.HISTORICO)); return HistoricoExcel.lista(); },
  async base() {
    db = new MemoryAdapter();
    await db.init();
    await Datos.cargar();
    HistoricoExcel.poner([]);
    const p1 = await ProveedorService.guardar(Object.assign(ProveedorService.vacio(), { nombre: 'Proveedor de prueba S.A.S.', nit: '900.111.222-3', formaPago: 'CREDITO', plazoDias: 90 }));
    const p2 = await ProveedorService.guardar(Object.assign(ProveedorService.vacio(), { nombre: 'Depósito El Ejemplo', ciudad: 'Montería' }));
    const e1 = await EquipoService.guardar(Object.assign(EquipoService.vacio(), { nombre: 'Cargador de prueba', tipo: 'maquinaria' }));
    return { p1, p2, e1 };
  },
  orden(p, extra) {
    const o = OrdenService.nueva({ proveedorId: p.id });
    o.items = [Object.assign(Modelo.itemVacio(), { descripcion: 'Filtro de aceite', cantidad: 2, unidad: 'UND', valorUnitario: 45000 })];
    /* Toda orden nueva dice para qué es: la de prueba, para el primer equipo */
    if (!o.equipoId && Datos.equipos[0]) o.equipoId = Datos.equipos[0].id;
    return Object.assign(o, extra || {});
  },
  async correr() {
    /* Se guardan las de todas las empresas, no sólo las que se ven */
    const real = { db, cfg: Datos.cfg, cfgs: Datos.cfgs, proveedores: Datos.proveedores, equipos: Datos.crudo('equipos'), ordenes: Datos.crudo('ordenes'),
      plantillas: Datos.crudo('plantillas'), acceso: Permiso.acceso, historico: HistoricoExcel.crudo(), autores: Autores.mapa,
      empresa: Empresa.activa, disponible: Empresa.disponible };
    /* Las pruebas no ven los nombres de la nube, y empiezan en SINUGRAVAS con las dos empresas */
    Autores.mapa = new Map();
    Empresa.disponible = true;
    Empresa.poner('SINUGRAVAS');
    const avisar = Canal.avisar;
    Canal.avisar = () => {};
    /* Mientras corren, nada llega de la nube y se prueba con todos los permisos */
    await Sincro.detener();
    Permiso.acceso = null;
    const res = [];
    try {
      for (const t of this.lista) {
        const ini = performance.now();
        try {
          Empresa.poner('SINUGRAVAS');
          const ctx = await this.base();
          const det = await t.fn(ctx);
          res.push({ nombre: t.nombre, ok: true, detalle: det || '', ms: performance.now() - ini });
        } catch (e) {
          res.push({ nombre: t.nombre, ok: false, detalle: e.message || String(e), ms: performance.now() - ini });
        }
      }
    } finally {
      db = real.db;
      Object.assign(Datos, { cfg: real.cfg, cfgs: real.cfgs, proveedores: real.proveedores, equipos: real.equipos, ordenes: real.ordenes, plantillas: real.plantillas });
      Empresa.disponible = real.disponible;
      Empresa.poner(real.empresa);
      Permiso.acceso = real.acceso;
      Datos.indexar();
      HistoricoExcel.poner(real.historico);
      Autores.mapa = real.autores;
      Canal.avisar = avisar;
      Sincro.seguir();
      Shell.refrescar();
    }
    return res;
  }
};

Pruebas.def('Un PDF que no se puede comprimir se adjunta igual, tal cual', async () => {
  const lib = Compresor.lib;
  let pedidas = 0;
  try {
    Compresor.lib = () => { pedidas++; return Promise.reject(new Error('Sin conexión')); };
    const grande = new File(['%PDF-1.4\n<< /Subtype /Image /Filter /DCTDecode >>\n' + 'x'.repeat(Compresor.MIN)], 'escaneada.pdf', { type: 'application/pdf' });
    const a = await Adjuntos.preparar(grande);
    Pruebas.cierto(pedidas === 1 && a.tipo === 'application/pdf' && a.tamano >= grande.size && !Adjuntos.ahorro(grande, a), 'sin internet debía quedar el original');
    const texto = new File(['%PDF-1.4\n<< /Type /Font >>\n' + 'x'.repeat(Compresor.MIN)], 'factura-electronica.pdf', { type: 'application/pdf' });
    Pruebas.igual([(await Compresor.pdf(texto)).nota, pedidas], ['no tiene fotos', 1], 'uno sin fotos JPEG se guarda tal cual, sin traer pdf-lib');
    const chico = new File(['%PDF-1.4 factura electrónica'], 'factura.pdf', { type: 'application/pdf' });
    Pruebas.igual((await Compresor.pdf(chico)).nota, 'es liviano', 'uno de menos de 200 KB no se toca');
  } finally { Compresor.lib = lib; }
  await Pruebas.falla(() => Adjuntos.preparar(new File([new Uint8Array(17 * 1048576)], 'enorme.pdf', { type: 'application/pdf' })), ErrorDominio,
    'uno que ni comprimido cabría no se intenta');
  return 'sin internet, tal cual';
});
Pruebas.def('La factura se corrige en una ventana pequeña: número, fecha y archivos', async ({ p1 }) => {

  const malo = await Adjuntos.preparar(pdf('factura-mala.pdf'));
  let o = Object.assign(Pruebas.orden(p1), { adjuntos: [Adjuntos.meta(malo)] });
  o = await OrdenService.guardar(o, [malo]);
  o = await OrdenService.guardarFactura(o, { numero: 'F-1', fecha: '2026-10-29' }, []);
  const espera = AccionesOrden.corregirFactura(o);
  const m = $$('#modals .modal-bd').pop();
  try {
    Pruebas.igual([$('#cfNum', m).value, $('#cfFecha', m).value, $$('[data-adj-quitar]', m).length], ['F-1', '2026-10-29', 1], 'debía traer la factura y su archivo');
    $('#cfNum', m).value = 'F-100';

/* La puerta de entrada: correo y contraseña, la misma cuenta de las demás
   plataformas de SINUGRAVAS (las crea el administrador en Supabase). Quien
   entra sin acceso a Facturación ve el aviso para pedirlo. */
const Sesion = {
  marca() {
    return '<div class="ses-marca">' + (MARCA.logo ? '<div class="ses-logo"><img src="' + MARCA.logo + '" alt="SINUGRAVAS S.A.S."></div>' : '') +
      '<div class="ses-titulo">Facturación · Órdenes de compra</div>' + (MARCA.logo ? '' : '<div class="ses-sub">SINUGRAVAS S.A.S.</div>') + '</div>';
  },
  nota: '<div class="ses-nota">La información está en la nube de SINUGRAVAS y es la misma desde cualquier equipo.<br>' +
    'Se entra con la cuenta de las demás plataformas de la empresa.</div>',
  /* Pide el correo y la contraseña. Termina cuando hay una sesión válida.
     correo: el de quien estaba trabajando, si la sesión se cayó */
  pedir(aviso, correoFijo) {
    return new Promise(listo => {
      const cont = $('#sesion'), correo = correoFijo || Prefs.get('ultimoCorreo', '') || '';
      cont.innerHTML = '<div class="ses"><div class="ses-caja">' + this.marca() +
        '<div class="card"><div class="card-b">' +
          (aviso ? '<div class="alert a-warn" style="padding:9px 11px;margin-bottom:12px">' + Icon('warn', '', 14) + '<div>' + esc(aviso) + '</div></div>' : '') +
          '<div class="field"><label for="sesCorreo">Correo</label>' +
            '<input class="inp" id="sesCorreo" type="email" autocomplete="username" value="' + attr(correo) + '"></div>' +
          '<div class="field"><label for="sesClave">Contraseña</label><div class="ses-clave">' +
            '<input class="inp" id="sesClave" type="password" autocomplete="current-password">' +
            '<button class="ses-ojo" type="button" id="sesOjo" title="Mostrar la contraseña" aria-label="Mostrar la contraseña">' + Icon('eye', '', 15) + '</button>' +
          '</div></div>' +
          '<div id="sesError"></div>' +
          '<button class="btn btn-primary ses-entrar" type="button" id="sesEntrar">' + Icon('shield', '', 15) + 'Entrar</button>' +
          '<div class="ses-estado" id="sesEstado"><span class="spin"></span>Comprobando el servidor…</div>' +
          (PANEL_URL ? '<a class="ses-panel" href="' + attr(PANEL_URL) + '">' + Icon('back', '', 14) + 'Volver al Panel de control</a>' : '') +
        '</div></div>' + this.nota +
      '</div></div>';
      const clave = $('#sesClave'), boton = $('#sesEntrar');
      const error = m => { $('#sesError').innerHTML = '<div class="alert a-err" style="padding:9px 11px;margin-bottom:12px">' + Icon('warn', '', 14) + '<div>' + esc(m) + '</div></div>'; };
      const entrar = async () => {
        const c = $('#sesCorreo').value.trim(), k = clave.value;
        if (!c || !k) { error('Escriba su correo y su contraseña.'); (c ? clave : $('#sesCorreo')).focus(); return; }
        boton.disabled = true;
        boton.innerHTML = '<span class="spin"></span>Verificando…';
        try {
          await Nube.entrar(c, k);
          Prefs.set('ultimoCorreo', c);
          cont.innerHTML = '';
          listo();
        } catch (e) {
          error(e.message);
          boton.disabled = false;
          boton.innerHTML = Icon('shield', '', 15) + 'Entrar';
          clave.focus();
        }
      };
      $('#sesOjo').onclick = () => {
        const ver = clave.type === 'password';
        clave.type = ver ? 'text' : 'password';
        $('#sesOjo').innerHTML = Icon(ver ? 'eyeOff' : 'eye', '', 15);
        $('#sesOjo').title = (ver ? 'Ocultar' : 'Mostrar') + ' la contraseña';
        clave.focus();
      };
      boton.onclick = entrar;
      $('#sesCorreo').addEventListener('keydown', e => { if (e.key === 'Enter') clave.focus(); });
      clave.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
      (correo ? clave : $('#sesCorreo')).focus();
      /* El estado del servidor no se supone: se comprueba. Si está caído, se
         sabe antes de escribir la contraseña. */
      Nube.latido().then(ms => {
        const e = $('#sesEstado');
        if (!e) return;
        e.innerHTML = ms == null ? '<span class="ses-punto mal"></span>El servidor no responde. Revise el internet.'
          : '<span class="ses-punto ok"></span>Servidor disponible · ' + ms + ' ms';
      });
    });
  },
  /* Entró bien, pero la cuenta no tiene acceso a Facturación: su sesión se
     cierra sólo aquí (scope=local) y el acceso se pide en el Panel de control */
  async sinAcceso(acc) {
    const correo = (acc && acc.correo) || Nube.correo();
    await Nube.salir();
    return new Promise(listo => {
      $('#sesion').innerHTML = '<div class="ses"><div class="ses-caja ancha">' + this.marca() +
        '<div class="card"><div class="card-b">' +
          '<div class="alert a-warn" style="padding:9px 11px;margin-bottom:12px">' + Icon('shield', '', 14) +
            '<div><b>Su cuenta no tiene acceso a Facturación.</b></div></div>' +
          '<p class="ses-txt">Entró bien' + (correo ? ' como <b>' + esc(correo) + '</b>' : '') + ', pero esta cuenta no tiene acceso a Facturación. ' +
            'Pídaselo al administrador en el Panel de control.</p>' +
          '<div class="ses-botones">' +
            (PANEL_URL ? '<a class="btn btn-primary" href="' + attr(PANEL_URL) + '">' + Icon('back', '', 14) + 'Volver al Panel de control</a>' : '') +
            '<button class="btn" type="button" id="sesOtra">' + Icon('salir', '', 14) + 'Entrar con otra cuenta</button></div>' +
        '</div></div>' + this.nota +
      '</div></div>';
      $('#sesOtra').onclick = () => listo();
    });
  },
  /* Hasta que haya una sesión con acceso a Facturación. Deja puesto lo que la
     persona puede hacer (Permiso.acceso). Si vino del Panel de control con un
     pase, primero se cambia por la sesión de esta pestaña: sin pantallas. */
  async iniciar() {
    let aviso = '';
    if (PASE) {
      const r = await Nube.canjearPase(PASE);
      if (r === 'vencido') aviso = 'El enlace del Panel de control ya se usó o venció. Vuelva al panel y entre otra vez, o ingrese con su contraseña.';
      else if (r === 'red') aviso = 'No hubo conexión para usar el enlace del Panel de control. Revise el internet y vuelva a entrar desde el panel, o ingrese con su contraseña.';
    }
    if (!(await Nube.token())) await this.pedir(aviso);
    for (;;) {
      let acc;
      try { acc = await Nube.miAcceso(); }
      catch (e) {
        if (!e.sesion) throw e;
        Nube.guardarSesion(null);
        await this.pedir();
        continue;
      }
      if (acc && acc.activo !== false && (acc.es_admin || (acc.acciones || []).includes('ver'))) { Permiso.acceso = acc; break; }
      await this.sinAcceso(acc);
      await this.pedir();
    }
    this.cerrar();
  },
  cerrar() { const c = $('#sesion'); if (c) c.innerHTML = ''; },
  /* La sesión se cayó trabajando (venció y no se pudo renovar): se vuelve a
     pedir la contraseña sin perder lo que está en pantalla, y se sigue. Si
     entra otra persona, la plataforma arranca de nuevo con lo suyo. */
  recuperar() {
    if (!this._recuperando) {
      const antes = Nube.correo();
      Nube.guardarSesion(null);
      this._recuperando = this.pedir('La sesión se cerró. Vuelva a entrar para seguir; lo que está en pantalla no se pierde.', antes).then(() => {
        this._recuperando = null;
        this.cerrar();
        if (antes && Nube.correo().toLowerCase() !== antes.toLowerCase()) location.reload();
      });
    }
    return this._recuperando;
  },
  async salir() {
    if (Router.sucio && !(await Modal.confirmar({ titulo: 'Hay cambios sin guardar', mensaje: 'Si sale ahora se pierde lo que escribió en esta pantalla.',
      ok: 'Salir sin guardar', cancelar: 'Seguir aquí', peligro: true }))) return;
    Router.sucio = false;
    await Nube.salir();
    location.reload();
  }
};

/* La nube cambia aunque esta pestaña no haga nada (otra persona guardó una
   orden, contabilidad la pagó). Mientras alguien la usa, cada 10 segundos
   se le pregunta a la nube qué cambió; si nadie la toca hace 3 minutos, cada
   minuto; al volver a la pestaña, o al tocarla después de estar quieta,
   enseguida; oculta, nada. La pregunta pesa casi nada y sólo trae lo que
   cambió. Lo nuevo se pinta enseguida, salvo que interrumpa: con alguien
   escribiendo, una ventana o un menú abiertos, o un clic de hace un instante,
   espera. */
const Sincro = {
  RAPIDA: 10000,
  LENTA: 60000,
  QUIETA: 180000,
  /* Sin el SQL 203 la nube no sabe decir qué cambió: cada medio minuto, como antes */
  SIN_203: 30000,
  estado: 'ok', ultima: 0, error: null, t: null, ocupado: null, pausa: false, pendiente: false, _avisado: false,
  _actividad: Date.now(), _toque: 0, _tPintar: null,
  iniciar() {
    /* Quién la usa: el mouse, el teclado o el dedo. Si estaba quieta y alguien
       la toca, se pregunta enseguida. */
    const usar = () => {
      const quieta = Date.now() - this._actividad > this.QUIETA;
      this._actividad = Date.now();
      if (quieta) this.programar(800);
    };
    const tocar = () => { this._toque = Date.now(); usar(); };
    ['pointermove', 'touchmove'].forEach(ev => addEventListener(ev, usar, { capture: true, passive: true }));
    ['pointerdown', 'keydown', 'wheel', 'scroll', 'touchstart'].forEach(ev => addEventListener(ev, tocar, { capture: true, passive: true }));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.programar(300); });
    addEventListener('focus', () => this.programar(300));
    addEventListener('online', () => this.ya());
    addEventListener('offline', () => { this.estado = 'sinred'; Shell.pintarConexion(); });
    Bus.on('ruta:cambio', () => { this.pendiente = false; this._avisado = false; });
    /* Lo que se ve se acaba de traer de la nube */
    this.ultima = Date.now();
    Shell.pintarConexion();
    this.programar();
  },
  /** Cada cuánto se pregunta: seguido si alguien la usa, despacio si está quieta */
  cada() { return db && db.sinCambios ? this.SIN_203 : Date.now() - this._actividad > this.QUIETA ? this.LENTA : this.RAPIDA; },
  programar(ms) { clearTimeout(this.t); this.t = setTimeout(() => this.ya(), ms == null ? this.cada() : ms); },
  /** Revisar enseguida (otra persona acaba de cambiar algo que esta quería guardar) */
  pronto() { this.programar(400); },
  /** Revisa ahora. aviso: lo pidió la persona, y se le dice cómo quedó */
  ya(aviso) {
    if (this.ocupado) return this.ocupado;
    if (this.pausa || !db || !db.nube || (document.hidden && !aviso)) { this.programar(); return Promise.resolve(false); }
    this.ocupado = (async () => {
      let hubo = false;
      try {
        hubo = await Datos.sincronizar();
        this.estado = 'ok';
        this.error = null;
        this.ultima = Date.now();
        if (hubo) this.pendiente = true;
        if (this.pendiente) this.repintar();
        if (aviso) Toast.ok(hubo ? 'Se trajeron los cambios de la nube.' : 'Todo está al día con la nube.');
      } catch (e) {
        this.estado = e.red ? 'sinred' : 'error';
        this.error = e;
        if (aviso) Toast.err(esc(e.red ? 'No hay conexión con la nube. Revise el internet.' : e.message));
      } finally {
        this.ocupado = null;
        Shell.pintarConexion();
        this.programar(this.estado === 'ok' ? this.cada() : 10000);
      }
      return hubo;
    })();
    return this.ocupado;
  },
  repintar() {
    if (Router.sucio) {
      if (!this._avisado) { this._avisado = true; Toast.info('Otra persona guardó cambios en Facturación. Al terminar aquí, los verá.'); }
      return;
    }
    const a = document.activeElement;
    const escribiendo = a && a.closest && a.closest('#content') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
    if (escribiendo || Modal.abiertos() || Menu.el || !Router.actual()) return;
    /* Un clic, una tecla o un scroll de hace un instante: se espera, para que
       la pantalla no salte bajo el dedo */
    const falta = 500 - (Date.now() - this._toque);
    if (falta > 0) {
      clearTimeout(this._tPintar);
      this._tPintar = setTimeout(() => { if (this.pendiente) this.repintar(); }, falta + 50);
      return;
    }
    this.pendiente = false;
    Shell.refrescar();
    Router.resolver(true);
  },
  /** Para las pruebas del sistema: que nada llegue mientras corren */
  async detener() {
    this.pausa = true;
    if (this.ocupado) { try { await this.ocupado; } catch (e) { /* da igual */ } }
  },
  seguir() { this.pausa = false; }
};

/* La versión anterior (1.x) guardaba todo en el navegador. Si en este
   computador quedaron datos de esa versión, el administrador los sube a la
   nube con un clic (o los descarga como respaldo). La base vieja sólo se lee. */
const Migracion = {
  local: null,
  /** El respaldo armado con lo que había en este navegador, o null. forzar: aunque se haya ocultado */
  async revisar(forzar) {
    if (!forzar) this.local = null;
    if (!Permiso.puede('configurar') || (!forzar && Prefs.get('migrado'))) return null;
    try {
      if (!globalThis.indexedDB || !indexedDB.databases) return null;
      if (!(await indexedDB.databases()).some(b => b.name === APP.dbName)) return null;
      const vieja = new IndexedDBAdapter();
      await vieja.init();
      const datos = {};
      try { for (const c of COLECCIONES) datos[c] = vieja.db.objectStoreNames.contains(c) ? await vieja.getAll(c) : []; }
      finally { vieja.db.close(); vieja.db = null; }
      if (!datos.configuracion.length && !datos.ordenes.length) return null;
      const obj = Respaldo.empacar(datos);
      if (!forzar) this.local = obj;
      return obj;
    } catch (e) {
      console.warn('No se pudo leer la versión local:', e);
      return null;
    }
  },
  html(obj) {
    const c = obj.conteos, enNube = Datos.ordenes.length, hecho = Prefs.get('migrado', '');
    /* Ya se subieron: queda en Copias de seguridad por si hacen falta otra vez */
    const subido = hecho && !/^oculto/.test(hecho) ? hecho : '';
    this._obj = obj;
    const que = Txt.plural(c.ordenes || 0, 'orden', 'órdenes') + ', ' + (c.proveedores || 0) + ' proveedores, ' + (c.equipos || 0) + ' equipos, ' +
      Txt.plural(c.plantillas || 0, 'plantilla') + ' y ' + Txt.plural(c.adjuntos || 0, 'archivo adjunto', 'archivos adjuntos') + ', con la configuración y las firmas. ';
    return '<div class="card mb16 migra" id="mgCaja"><div class="card-b"><div class="mg-ic">' + Icon('upload', '', 18) + '</div>' +
      '<div class="mg-tx">' + (subido
        ? '<b>Los datos de la versión anterior ya se subieron a la nube</b> el ' + esc(Fecha.stamp(subido)) + '. Siguen en este computador por si hacen falta: ' + que +
          'Si los sube otra vez, se reemplaza lo que hay ahora en la nube.'
        : '<b>Este computador tiene datos de la versión anterior</b>, la que guardaba todo en el navegador: ' + que +
          (enNube ? '<span class="txt-dang">En la nube ya hay ' + Txt.plural(enNube, 'orden', 'órdenes') + ': si los sube, lo de la nube se reemplaza.</span>'
            : 'Súbalos para seguir trabajando con ellos en la nube.')) + '</div>' +
      '<div class="mg-acc"><button class="btn btn-sm' + (subido ? '' : ' btn-primary') + '" id="mgSubir">' + Icon('upload', '', 13) + (subido ? 'Subir otra vez' : 'Subir a la nube') + '</button>' +
        '<button class="btn btn-sm" id="mgBajar">' + Icon('download', '', 13) + 'Descargar como respaldo</button>' +
        (subido ? '' : '<button class="btn btn-ghost btn-sm" id="mgNo">No, ocultar</button>') + '</div></div></div>';
  },
  unir(el) {
    const caja = $('#mgCaja', el);
    if (!caja) return;
    const obj = this._obj;
    $('#mgSubir', caja).onclick = () => this.subir(obj);
    $('#mgBajar', caja).onclick = () => {
      U.descargar(new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }), Exportar.nombre('respaldo-facturacion-version-local', 'json'));
      Toast.ok('Respaldo de la versión local descargado.');
    };
    if ($('#mgNo', caja)) $('#mgNo', caja).onclick = () => {
      Prefs.set('migrado', 'oculto ' + Fecha.ahora());
      this.local = null;
      caja.remove();
      Toast.info('Listo. Si lo necesita, está en Copias de seguridad.');
    };
  },
  async subir(obj) {
    const c = obj.conteos, hay = Datos.ordenes.length + Datos.plantillas.length;
    const ok = await Modal.confirmar({ titulo: 'Subir los datos a la nube', ok: 'Subir a la nube', escribir: hay ? 'SUBIR' : '',
      mensaje: 'Se suben ' + Txt.plural(c.ordenes || 0, 'orden', 'órdenes') + ', ' + (c.proveedores || 0) + ' proveedores, ' + (c.equipos || 0) + ' equipos, ' +
        Txt.plural(c.plantillas || 0, 'plantilla') + ', ' + Txt.plural(c.adjuntos || 0, 'archivo', 'archivos') + ' y la configuración de este computador. ' +
        'Lo que hay ahora en la nube (' + Txt.plural(Datos.ordenes.length, 'orden', 'órdenes') + ', ' + Datos.proveedores.length + ' proveedores) <b>se reemplaza</b>. ' +
        'Quienes tengan acceso a Facturación lo verán enseguida.' });
    if (!ok) return;
    const m = Modal.abrir({ titulo: 'Subiendo a la nube', ancho: 'narrow', fijo: true,
      cuerpo: '<p class="fs13 txt-2 flex aic g8" id="mgAvance"><span class="spin"></span>Preparando…</p>' });
    try {
      await Respaldo.restaurar(obj, (n, total) => { const a = $('#mgAvance', m); if (a) a.innerHTML = '<span class="spin"></span>Subiendo archivos ' + n + ' de ' + total + '…'; });
      Modal.cerrar(m);
      Prefs.set('migrado', Fecha.ahora());
      this.local = null;
      Toast.ok('Listo: los datos de este computador ya están en la nube.');
      Shell.render();
      Router.ir('/');
    } catch (e) {
      Modal.cerrar(m);
      Modal.alerta('No se pudo subir', esc(e.message) + '<br>No se cambió nada en la nube.', 'err');
    }
  }
};

async function arrancar() {
  const app = $('#app');
  document.documentElement.setAttribute('data-theme', Prefs.get('tema', 'light') === 'dark' ? 'dark' : 'light');
  document.documentElement.classList.toggle('sb-mini', !!Prefs.get('sbMini', false));
  app.innerHTML = '<div style="position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)"><div style="text-align:center">' +
    '<div class="sb-logo" style="width:58px;height:58px;border-radius:13px;margin:0 auto 16px;font-size:20px" id="bootLogo">SG</div>' +
    '<div style="font-weight:600;font-size:15px">Facturación · Órdenes de compra</div><div style="color:var(--text-3);font-size:12.5px;margin-top:4px">SINUGRAVAS S.A.S.</div>' +
    '<div style="margin-top:18px"><span class="spin"></span></div><div id="bootMsg" style="color:var(--text-3);font-size:11.5px;margin-top:10px">Conectando con la nube…</div></div></div>';
  const msg = t => { const e = $('#bootMsg'); if (e) e.textContent = t; };
  try {
    await MARCA.preparar();
    if (MARCA.emblema) { const b = $('#bootLogo'); if (b) { b.classList.add('marca'); b.innerHTML = '<img src="' + MARCA.emblema + '" alt="">'; } }
    db = new NubeAdapter();
    await db.init();
    msg('Revisando la sesión…');
    await Sesion.iniciar();
    msg('Trayendo los datos de la nube…');
    await Promise.all([Datos.cargar(), HistoricoExcel.cargar(), Autores.traer(true), Empresa.revisar()]);
    Empresa.iniciar();
    /* Quien administra pone al día lo que llegue de una versión anterior */
    if (Permiso.puede('configurar') && await Semillas.aplicar()) msg('Poniendo al día los datos…');
    Shell.render();
    Tip.iniciar();
    Canal.iniciar();
    registrarRutas();
    Router.iniciar();
    Bus.on('datos:cambio', U.debounce(() => Shell.refrescar(), 120));
    Bus.on('configuracion:cambio', U.debounce(() => Shell.refrescar(), 120));
    Sincro.iniciar();
    if (HistoricoExcel.error) {
      const falta = HistoricoExcel.error.sql === 'PGRST205' || /historico/.test(HistoricoExcel.error.message || '');
      Toast.warn(falta && Permiso.puede('configurar')
        ? 'El histórico del Excel todavía no está en la nube: corra <b>202_facturacion_historico.sql</b> en Supabase (SQL Editor).'
        : 'No se pudo traer el histórico del Excel. Las órdenes nuevas funcionan normal.', { ms: 12000 });
    }
    /* Sin el SQL 203 la nube no sabe decir qué cambió: se revisa como antes */
    if (db.sinCambios && Permiso.puede('configurar')) {
      Toast.warn('Para que lo que guardan los demás llegue en segundos, corra <b>203_facturacion_cambios.sql</b> en Supabase (SQL Editor). ' +
        'Mientras tanto se revisa cada medio minuto, como antes.', { ms: 12000 });
    }
    /* ¿Quedaron en este computador datos de la versión local? */
    Migracion.revisar().then(l => { const a = Router.actual(); if (l && a && a.patron === '/' && !Router.sucio) Router.resolver(true); });
    console.info('%cFacturación SINUGRAVAS v' + APP.version + ' · esquema ' + APP.esquema + ' · ' + NUBE.url, 'color:#2a52ad;font-weight:700');
  } catch (e) {
    console.error(e);
    Sesion.cerrar();
    app.innerHTML = '<div style="max-width:640px;margin:60px auto;padding:24px"><div class="alert a-err">' + Icon('warn') + '<div><b>' +
      (e.red ? 'No hay conexión con la nube.' : 'No se pudo abrir la plataforma.') + '</b><br>' +
      esc(e.red ? 'Revise el internet e intente otra vez. Nada de lo guardado se pierde: está en la nube.' : e.message || String(e)) +
      '<div class="mt8"><button class="btn btn-sm" onclick="location.reload()">Intentar otra vez</button></div></div></div></div>';
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);
else arrancar();
</script>
</body>
</html>
