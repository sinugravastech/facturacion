const Comp = {
  pillEstado(e) { const x = ESTADOS[e] || ESTADOS.ESPERANDO; return '<span class="pill ' + x.pill + '" data-tip="' + attr(x.ayuda) + '">' + esc(x.t) + '</span>'; },
  pillTipo(t) { const x = TIPOS[t] || TIPOS.COMPRA; return '<span class="pill np ' + x.pill + '">' + esc(x.c) + '</span>'; },
  /** De contado o a crédito, a simple vista: las de crédito son las que esperan factura y pago */
  pago(o) {
    /* Sin los días del plazo: Juan sólo quiere ver si es a crédito (30/10/2026) */
    if (o.formaPago === 'CREDITO') return '<div class="or-pago credito">' + Icon('calendar', '', 10) + 'Crédito</div>';
    if (o.formaPago === 'CONTADO') return '<div class="or-pago contado">' + Icon('cash', '', 10) + 'Contado' + (o.pago && o.pago.contado ? ' · pagada' : '') + '</div>';
    return '';
  },
  /** El estado de una orden, o «Excel» si es del histórico */
  pillOrden(o) { return o.excel ? '<span class="pill p-gray np" data-tip="Copiada del Excel: sólo para consultar">Excel</span>' : Comp.pillEstado(o.estado); },
  /** El estado como desplegable: se cambia ahí mismo, también si algo se marcó por error */
  selEstado(o) {
    if (o.excel || !Permiso.puedeOrden(o)) return Comp.pillOrden(o);
    const x = ESTADOS[o.estado] || ESTADOS.ESPERANDO;
    return '<select class="sel-estado ' + x.pill + '" data-estado="' + attr(o.id) + '" data-tip="Cambiar el estado" aria-label="Estado de la orden ' + attr(Modelo.codigo(o)) + '">' +
      Object.keys(ESTADOS).map(k => '<option value="' + k + '"' + (k === o.estado ? ' selected' : '') + '>' + esc(ESTADOS[k].t) + '</option>').join('') + '</select>';
  },
  kpi(o) {
    return '<div class="kpi' + (o.ir ? ' clickable' : '') + '" style="--k:' + (o.k || 'var(--brand-500)') + '"' + (o.ir ? ' data-ir="' + attr(o.ir) + '"' : '') +
      (o.tip ? ' data-tip="' + attr(o.tip) + '"' : '') + '>' +
      '<div class="kpi-l">' + (o.icono ? Icon(o.icono, '', 13) : '') + esc(o.l) + '</div>' +
      '<div class="kpi-v">' + o.v + '</div>' + (o.m ? '<div class="kpi-m">' + o.m + '</div>' : '') + '</div>';
  },
  vacio(icono, titulo, texto, accion, sm) {
    return '<div class="empty' + (sm ? ' sm' : '') + '">' + Icon(icono, '', sm ? 28 : 38) + '<h4>' + esc(titulo) + '</h4>' +
      (texto ? '<p>' + texto + '</p>' : '') + (accion || '') + '</div>';
  },
  fallo(e) {
    return '<div class="alert a-err" style="max-width:720px">' + Icon('warn') + '<div><b>Algo salió mal al mostrar esta pantalla.</b><br>' +
      esc(e && e.message ? e.message : String(e)) + '<div class="mt8"><button class="btn btn-sm" onclick="location.reload()">' + Icon('refresh', '', 13) +
      'Recargar</button> <a class="btn btn-sm" href="#/">Ir al inicio</a></div></div></div>';
  },
  /** redondo: sumas de varias órdenes, en pesos enteros */
  dinero(n, redondo) { return +n > 0 ? (redondo ? Money.redondo(n) : Money.fmt(n)) : '<span class="txt-3" data-tip="Sin valorizar: la orden no tiene precios">—</span>'; },
  /** El total que traía la hoja del Excel: se ve, pero en gris y sin sumar */
  valorExcel(o) { return '<span class="txt-3"' + (o.total > 0 ? ' data-tip="Valor de la hoja del Excel: no suma en nada">' + Money.fmt(o.total) : '>—') + '</span>'; },
  provCelda(p, sub) {
    if (!p) return '<span class="txt-3">Sin proveedor</span>';
    return '<div class="cel-prov"><div class="av sm">' + esc(Txt.iniciales(p.nombre)) + '</div><div class="cp-t"><div title="' + attr(p.nombre) + '">' +
      esc(p.nombre) + '</div>' + (sub !== false && (sub || p.categoria) ? '<small>' + esc(sub || p.categoria) + '</small>' : '') + '</div></div>';
  },
  /** Ranking con barras (proveedores, equipos, artículos) */
  rank(lista, opts) {
    opts = opts || {};
    if (!lista.length) return Comp.vacio('chart', opts.vacio || 'Sin datos en el periodo.', '', '', true);
    const max = Math.max(...lista.map(x => x.valor), 1);
    const maxN = Math.max(...lista.map(x => x.n), 1);
    return lista.slice(0, opts.n || 6).map((x, i) => {
      const pct = opts.porConteo ? x.n / maxN : x.valor / max;
      return '<div class="rank' + (opts.ir ? ' click' : '') + '"' + (opts.ir && opts.ir(x) ? ' data-ir="' + attr(opts.ir(x)) + '"' : '') + '>' +
        '<div class="rk-n">' + (i + 1) + '</div><div class="rk-b"><div class="rk-t"><span title="' + attr(x.nombre) + '">' + esc(x.nombre) + '</span>' +
        '<b>' + (opts.porConteo ? Txt.plural(x.n, 'vez', 'veces') : (x.valor > 0 ? Money.redondo(x.valor) : '<span class="txt-3 fw6">' + Txt.plural(x.n, 'orden', 'órdenes') + '</span>')) +
        (!opts.porConteo && x.valor > 0 ? '<small>' + x.n + '</small>' : '') + '</b></div>' +
        '<div class="bar"><i style="width:' + Math.max(2, Math.round(pct * 100)) + '%"></i></div></div></div>';
    }).join('');
  },
  /** Tabla corta de órdenes (inicio, ficha de proveedor, equipo) */
  tablaOrdenes(lista, opts) {
    opts = opts || {};
    if (!lista.length) return Comp.vacio('doc', opts.vacio || 'Aún no hay órdenes.', opts.vacioTexto || '', opts.vacioAccion || '', true);
    return '<div class="tbl-wrap"><table class="tbl compacta"><thead><tr><th>N.º</th><th>Fecha</th>' +
      (opts.sinProveedor ? '' : '<th>Proveedor</th>') + '<th>Concepto</th><th class="num">Total</th><th>Estado</th>' +
      (opts.dias ? '<th class="num">Días</th>' : '') + '</tr></thead><tbody>' +
      lista.map(o => '<tr class="row-click est-' + o.estado + '" data-ir="/orden/' + o.id + '"><td class="mono fw7 t-num">' + esc(Modelo.codigo(o)) + '</td>' +
        '<td class="nowrap">' + Fecha.corta(o.fecha) + '</td>' +
        (opts.sinProveedor ? '' : '<td class="trunc" style="max-width:180px" title="' + attr(Modelo.nombreProveedor(o)) + '">' + esc(Modelo.nombreProveedor(o)) + '</td>') +
        '<td class="trunc" style="max-width:220px" title="' + attr(Modelo.concepto(o)) + '">' + esc(Modelo.concepto(o)) + '</td>' +
        '<td class="num">' + (o.excel ? Comp.valorExcel(o) : Comp.dinero(Modelo.valor(o))) + '</td><td>' + Comp.pillOrden(o) + '</td>' +
        (opts.dias ? '<td class="num">' + OrdenService.diasEnEstado(o) + '</td>' : '') + '</tr>').join('') +
      '</tbody></table></div>';
  },
  /** Paginador al pie de una tabla */
  pager(total, pag, porPag, id) {
    const paginas = Math.max(1, Math.ceil(total / porPag));
    const ini = total ? (pag - 1) * porPag + 1 : 0, fin = Math.min(total, pag * porPag);
    return '<div class="pager" data-pager="' + attr(id) + '"><span>' + ini + '–' + fin + ' de <b>' + total + '</b></span><span class="pg-sp"></span>' +
      '<select class="inp" data-pp>' + [25, 50, 100].map(n => '<option value="' + n + '"' + (n === porPag ? ' selected' : '') + '>' + n + ' por página</option>').join('') + '</select>' +
      '<button class="btn btn-sm btn-icon" data-pg="1"' + (pag <= 1 ? ' disabled' : '') + ' aria-label="Primera página">' + Icon('chevsL', '', 12) + '</button>' +
      '<button class="btn btn-sm btn-icon" data-pg="' + (pag - 1) + '"' + (pag <= 1 ? ' disabled' : '') + ' aria-label="Anterior">' + Icon('chevL', '', 12) + '</button>' +
      '<span>Pág. <b>' + pag + '</b> / ' + paginas + '</span>' +
      '<button class="btn btn-sm btn-icon" data-pg="' + (pag + 1) + '"' + (pag >= paginas ? ' disabled' : '') + ' aria-label="Siguiente">' + Icon('chevR', '', 12) + '</button>' +
      '<button class="btn btn-sm btn-icon" data-pg="' + paginas + '"' + (pag >= paginas ? ' disabled' : '') + ' aria-label="Última página"><span style="transform:rotate(180deg);display:inline-grid">' + Icon('chevsL', '', 12) + '</span></button></div>';
  },
  /** Selector de periodo (Todo · Año · Mes · Rango), igual que en caja menor */
  periodo(p, id) {
    p = p || { modo: 'todo' };
    const anios = [...new Set([new Date().getFullYear(), ...Datos.ordenes.map(o => Fecha.anio(o.fecha)).filter(Boolean)])].sort((a, b) => b - a);
    let extra = '';
    if (p.modo === 'anio') extra = '<select class="inp" data-per="anio">' + anios.map(a => '<option' + (a === (p.anio || anios[0]) ? ' selected' : '') + '>' + a + '</option>').join('') + '</select>';
    if (p.modo === 'mes') extra = '<input class="inp" type="month" data-per="mes" value="' + attr(p.mes || Fecha.hoy().slice(0, 7)) + '">';
    if (p.modo === 'rango') extra = '<input class="inp" type="date" data-per="desde" value="' + attr(p.desde || '') + '" aria-label="Desde"><span class="txt-3">a</span>' +
      '<input class="inp" type="date" data-per="hasta" value="' + attr(p.hasta || '') + '" aria-label="Hasta">';
    return '<div class="periodo" data-periodo="' + attr(id) + '"><div class="seg">' +
      [['todo', 'Todo'], ['anio', 'Año'], ['mes', 'Mes'], ['rango', 'Rango']].map(([k, t]) => '<button data-modo="' + k + '" class="' + (p.modo === k ? 'on' : '') + '">' + t + '</button>').join('') +
      '</div>' + extra + '</div>';
  },
  /** Conecta el selector de periodo: guarda la elección y vuelve a pintar */
  unirPeriodo(cont, clave, alCambiar) {
    const caja = $('[data-periodo]', cont);
    if (!caja) return;
    const p = Prefs.get(clave, { modo: 'todo' });
    caja.addEventListener('click', e => {
      const b = e.target.closest('[data-modo]');
      if (!b) return;
      p.modo = b.dataset.modo;
      if (p.modo === 'anio' && !p.anio) p.anio = new Date().getFullYear();
      if (p.modo === 'mes' && !p.mes) p.mes = Fecha.hoy().slice(0, 7);
      Prefs.set(clave, p); alCambiar();
    });
    caja.addEventListener('change', e => {
      const k = e.target.dataset.per;
      if (!k) return;
      p[k] = k === 'anio' ? +e.target.value : e.target.value;
      Prefs.set(clave, p); alCambiar();
    });
  }
};

/* Autocompletar: el menú se dibuja en una capa fija (portal) para que no lo
   recorte una tabla ni una ventana con desplazamiento. */
const Combo = {
  vivos: new Set(),
  /** opts: { fuente(q) → [{ t, s, tag, data }], alElegir(item), nuevo: { texto(q), accion(q) }, alAbrirVacio: bool } */
  unir(input, opts) {
    const portal = document.createElement('div');
    portal.className = 'combo-portal';
    portal.setAttribute('role', 'listbox');
    document.body.appendChild(portal);
    let lista = [], hl = -1, abierto = false;
    const c = { input, portal };
    const posicionar = () => {
      const r = input.getBoundingClientRect();
      portal.style.minWidth = Math.max(r.width, 220) + 'px';
      portal.style.left = Math.min(r.left, innerWidth - Math.max(r.width, 220) - 8) + 'px';
      const abajo = innerHeight - r.bottom;
      if (abajo < 200 && r.top > abajo) { portal.style.top = ''; portal.style.bottom = (innerHeight - r.top + 4) + 'px'; }
      else { portal.style.bottom = ''; portal.style.top = (r.bottom + 4) + 'px'; }
    };
    const pintar = () => {
      const q = input.value.trim();
      lista = opts.fuente(q) || [];
      const nuevo = opts.nuevo && q ? opts.nuevo : null;
      if (!lista.length && !nuevo) {
        if (q && opts.vacio) { portal.innerHTML = '<div class="combo-vacio">' + esc(opts.vacio) + '</div>'; } else { c.cerrar(); return; }
      } else {
        portal.innerHTML = lista.map((it, i) => '<div class="combo-opt" data-i="' + i + '" role="option"><div class="co-t"><div>' +
          (it.html || esc(it.t)) + '</div>' + (it.s ? '<div class="co-s">' + esc(it.s) + '</div>' : '') + '</div>' +
          (it.tag ? '<span class="co-tag">' + esc(it.tag) + '</span>' : '') + '</div>').join('') +
          (nuevo ? '<div class="combo-opt combo-new" data-nuevo="1">' + Icon('plus', '', 13) + esc(nuevo.texto(q)) + '</div>' : '');
      }
      hl = lista.length ? 0 : (nuevo ? lista.length : -1);
      marcar();
      portal.classList.add('open');
      abierto = true;
      posicionar();
    };
    const marcar = () => {
      $$('.combo-opt', portal).forEach((e, i) => e.classList.toggle('hl', i === hl));
      const e = $('.combo-opt.hl', portal);
      if (e) e.scrollIntoView({ block: 'nearest' });
    };
    const elegir = i => {
      const opcs = $$('.combo-opt', portal);
      const el = opcs[i];
      if (!el) return;
      if (el.dataset.nuevo) { c.cerrar(); opts.nuevo.accion(input.value.trim()); return; }
      const it = lista[+el.dataset.i];
      c.cerrar();
      opts.alElegir(it);
    };
    c.cerrar = () => { portal.classList.remove('open'); abierto = false; };
    c.abrir = pintar;
    input.setAttribute('autocomplete', 'off');
    input.addEventListener('input', pintar);
    input.addEventListener('focus', () => { if (opts.alAbrirVacio || input.value.trim()) pintar(); });
    input.addEventListener('click', () => { if (!abierto && (opts.alAbrirVacio || input.value.trim())) pintar(); });
    input.addEventListener('keydown', e => {
      if (!abierto) { if (e.key === 'ArrowDown') { e.preventDefault(); pintar(); } return; }
      const n = $$('.combo-opt', portal).length;
      if (e.key === 'ArrowDown') { e.preventDefault(); hl = (hl + 1) % n; marcar(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); hl = (hl - 1 + n) % n; marcar(); }
      else if (e.key === 'Enter') { if (hl >= 0) { e.preventDefault(); elegir(hl); } }
      else if (e.key === 'Escape') { e.stopPropagation(); c.cerrar(); }
      else if (e.key === 'Tab') { c.cerrar(); }
    });
    input.addEventListener('blur', () => setTimeout(() => c.cerrar(), 160));
    portal.addEventListener('mousedown', e => {
      const o = e.target.closest('.combo-opt');
      if (!o) return;
      e.preventDefault();
      elegir($$('.combo-opt', portal).indexOf(o));
    });
    addEventListener('scroll', () => { if (abierto) posicionar(); }, true);
    this.vivos.add(c);
    return c;
  },
  cerrarTodos() { this.vivos.forEach(c => c.cerrar()); },
  /** Quita los menús de los campos que ya no están en la página */
  limpiar() {
    this.vivos.forEach(c => { if (!document.body.contains(c.input)) { c.portal.remove(); this.vivos.delete(c); } });
  }
};

/* Pesos con puntos de miles mientras se escribe, sin perder el cursor. Los
   centavos van después de la coma; el punto que se escriba también la pone,
   porque los puntos de miles salen solos. */
const MoneyInput = {
  /** «12605,0» → «12.605,0»: deja la coma y los ceros del final mientras se
      escriben los centavos, máximo dos */
  formato(txt) {
    const s = String(txt || '').replace(/[^\d,]/g, '');
    const c = s.indexOf(',');
    const ent = (c < 0 ? s : s.slice(0, c)).slice(0, 15);
    const miles = ent ? Money.num(+ent) : c < 0 ? '' : '0';
    return c < 0 ? miles : miles + ',' + s.slice(c + 1).replace(/,/g, '').slice(0, 2);
  },
  unir(input, alCambiar) {
    input.classList.add('inp-money');
    input.setAttribute('inputmode', 'decimal');
    /* Una sola coma: si ya hay centavos, otra coma o punto no hace nada */
    input.addEventListener('beforeinput', e => {
      if (e.inputType !== 'insertText' || (e.data !== '.' && e.data !== ',')) return;
      e.preventDefault();
      const v = input.value, a = input.selectionStart, b = input.selectionEnd;
      if ((v.slice(0, a) + v.slice(b)).includes(',')) return;
      input.setRangeText(',', a, b, 'end');
      input.dispatchEvent(new Event('input', { bubbles: true }));
    });
    const pintar = e => {
      /* Lo pegado, o lo que llega de una vez (autocompletar, dictado), se lee
         entero: «12605.04» trae centavos */
      if (e && (e.inputType === 'insertFromPaste' || e.inputType === 'insertFromDrop' || (e.data && e.data.length > 1))) {
        const v = Money.parse(input.value);
        input.value = v ? Money.num(v) : '';
        alCambiar && alCambiar(v);
        return;
      }
      const pos = input.selectionStart || 0;
      const antes = input.value.slice(0, pos).replace(/[^\d,]/g, '').length;
      input.value = this.formato(input.value);
      let n = 0, i = 0;
      for (; i < input.value.length && n < antes; i++) if (/[\d,]/.test(input.value[i])) n++;
      try { input.setSelectionRange(i, i); } catch (er) { /* tipo sin selección */ }
      alCambiar && alCambiar(Money.parse(input.value));
    };
    input.addEventListener('input', pintar);
    if (input.value) input.value = Money.parse(input.value) ? Money.num(Money.parse(input.value)) : '';
  }
};

/* Zona para soltar un archivo (respaldo, logo, firma) */
const DropZone = {
  unir(el, aceptar, alSoltar) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = aceptar || ''; input.style.display = 'none';
    el.appendChild(input);
    el.addEventListener('click', e => { if (e.target !== input) input.click(); });
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) alSoltar(f); });
    input.addEventListener('change', () => { const f = input.files[0]; if (f) alSoltar(f); input.value = ''; });
  }
};

/* Gráficas en SVG, sin librerías: barras con línea de conteo y dona. */
const Chart = {
  paso(max) {
    if (max <= 0) return 1;
    const crudo = max / 4, e = Math.pow(10, Math.floor(Math.log10(crudo))), f = crudo / e;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  },
  /** serie: [{ etiqueta, valor, n, tip }] */
  barras(serie, opts) {
    opts = opts || {};
    if (!serie.length || serie.every(x => !x.valor && !x.n)) return Comp.vacio('chart', 'Sin datos en el periodo.', '', '', true);
    const W = 680, H = opts.alto || 230, pl = 58, pr = opts.conteo ? 30 : 10, pt = 14, pb = 28;
    const iw = W - pl - pr, ih = H - pt - pb;
    const max = Math.max(...serie.map(x => x.valor), 0);
    const paso = Chart.paso(max), tope = Math.max(paso * Math.ceil(max / paso), paso);
    const maxN = Math.max(...serie.map(x => x.n || 0), 1);
    const n = serie.length, bw = iw / n, ancho = Math.max(3, Math.min(38, bw * .62));
    let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + attr(opts.titulo || 'Gráfica') + '">';
    for (let v = 0; v <= tope + 1e-6; v += paso) {
      const y = pt + ih - (v / tope) * ih;
      s += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/>' +
        '<text x="' + (pl - 7) + '" y="' + (y + 3) + '" text-anchor="end">' + esc(Money.corto(v)) + '</text>';
    }
    const cada = Math.ceil(n / 14);
    serie.forEach((x, i) => {
      const h = tope ? (x.valor / tope) * ih : 0;
      const cx = pl + bw * i + bw / 2;
      s += '<rect class="bar-r" x="' + (cx - ancho / 2) + '" y="' + (pt + ih - h) + '" width="' + ancho + '" height="' + Math.max(0, h) + '" rx="2" ' +
        'data-tip="' + attr((x.tip || x.etiqueta) + ': ' + Money.redondo(x.valor) + (x.n != null ? ' · ' + Txt.plural(x.n, 'orden', 'órdenes') : '')) + '"/>';
      if (i % cada === 0) s += '<text x="' + cx + '" y="' + (H - 9) + '" text-anchor="middle">' + esc(x.etiqueta) + '</text>';
    });
    if (opts.conteo) {
      const pts = serie.map((x, i) => [pl + bw * i + bw / 2, pt + ih - ((x.n || 0) / maxN) * ih * .92]);
      s += '<polyline class="ln" points="' + pts.map(p => p.join(',')).join(' ') + '"/>';
      pts.forEach((p, i) => { s += '<circle class="dot" cx="' + p[0] + '" cy="' + p[1] + '" r="3" data-tip="' + attr(serie[i].etiqueta + ': ' + Txt.plural(serie[i].n || 0, 'orden', 'órdenes')) + '"/>'; });
      s += '<text x="' + (W - pr + 6) + '" y="' + (pt + 8) + '" text-anchor="start">' + maxN + '</text>';
    }
    s += '<line class="ax" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '"/></svg>';
    if (opts.conteo) s += '<div class="legend"><span><i style="background:var(--brand-500)"></i>Valor comprado</span><span><i style="background:var(--sun-500);height:3px;vertical-align:3px"></i>Número de órdenes</span></div>';
    return s;
  },
  /* En otra empresa la marca ya es su color, que puede parecerse al verde de
     «pagada»: ese verde se va al final, para que dos tajadas no se confundan */
  get COLORES() {
    const c = ['var(--brand-500)', 'var(--sun-500)', 'var(--ok-500)', 'var(--violet-500)', 'var(--info-500)', 'var(--warn-500)', 'var(--dang-500)', 'var(--ink-400)'];
    if (Empresa.activa !== 'SINUGRAVAS') [c[2], c[7]] = [c[7], c[2]];
    return c;
  },
  /** partes: [{ etiqueta, valor }] */
  dona(partes, opts) {
    opts = opts || {};
    const v = partes.filter(p => p.valor > 0);
    if (!v.length) return Comp.vacio('chart', 'Sin datos en el periodo.', '', '', true);
    const total = U.sumar(v, p => p.valor);
    const r = 52, c = 2 * Math.PI * r;
    let acum = 0, arcos = '';
    v.forEach((p, i) => {
      const largo = c * p.valor / total;
      arcos += '<circle cx="70" cy="70" r="' + r + '" fill="none" stroke="' + (p.color || Chart.COLORES[i % Chart.COLORES.length]) + '" stroke-width="18" ' +
        'stroke-dasharray="' + Math.max(0, largo - (v.length > 1 ? 1.5 : 0)) + ' ' + (c - largo + (v.length > 1 ? 1.5 : 0)) + '" stroke-dashoffset="' + (-acum) + '" transform="rotate(-90 70 70)" ' +
        'data-tip="' + attr(p.etiqueta + ': ' + (opts.conteo ? p.valor : Money.redondo(p.valor)) + ' (' + Math.round(p.valor / total * 100) + ' %)') + '"/>';
      acum += largo;
    });
    const centro = opts.conteo ? String(total) : Money.corto(total);
    return '<div class="dona-wrap"><svg class="chart" width="140" height="140" viewBox="0 0 140 140" style="width:140px">' + arcos +
      '<text x="70" y="68" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--text)">' + esc(centro) + '</text>' +
      '<text x="70" y="84" text-anchor="middle">' + esc(opts.centro || 'total') + '</text></svg>' +
      '<div class="dona-l">' + v.map((p, i) => '<div><i style="background:' + (p.color || Chart.COLORES[i % Chart.COLORES.length]) + '"></i><span>' + esc(p.etiqueta) + '</span><b>' +
        (opts.conteo ? p.valor : Money.redondo(p.valor)) + '</b><span class="txt-3 fs11" style="flex:0 0 auto">' + Math.round(p.valor / total * 100) + ' %</span></div>').join('') + '</div></div>';
  }
};

/* Atajos: Ctrl + K busca; Ctrl + G abre una orden nueva (como en caja menor) */
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
  const k = e.key.toLowerCase();
  if (k === 'k') { const i = $('#gsInput'); if (i) { e.preventDefault(); i.focus(); i.select(); } }
  else if (k === 'g' && $('#app .sidebar') && !Modal.abiertos() && Permiso.puede('editar')) { e.preventDefault(); Router.ir('/orden-nueva'); }
});

/* Cualquier elemento con data-ir navega (filas de tabla, KPI, rankings…) */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-ir]');
  if (!el || el.closest('.modal-bd') || el.closest('#sbCons')) return;
  if (e.target.closest('a[href],button:not([data-ir]),select,input,label')) return;
  Router.ir(el.dataset.ir);
});

/* Acciones sobre una orden que se usan desde varias pantallas */
const AccionesOrden = {
  /** La factura se pone en la misma hoja de la orden: su número, su fecha y los valores de cada artículo */
  registrarFactura(o) { Router.ir('/orden-editar/' + o.id + '?factura=1'); return null; },
  /** Corregir la factura en una ventana pequeña, sin abrir la hoja (Juan,
      30/10/2026): su número, su fecha y sus archivos. Lo que se quita o se
      adjunta queda pendiente hasta «Guardar cambios». Los valores son los de
      los artículos: para cambiarlos se abre la hoja */
  corregirFactura(o) {
    return new Promise(res => {
      let hecho = null, nuevos = [];
      const quitados = new Set();
      const fac = o.factura || {};
      const m = Modal.abrir({
        titulo: 'Corregir la factura', subtitulo: 'Orden ' + esc(Modelo.codigo(o)) + ' · ' + esc(Modelo.nombreProveedor(o)),
        cuerpo: '<div class="row"><div class="field"><label for="cfNum">N.º de la factura</label><input class="inp" id="cfNum" autocomplete="off" value="' + attr(fac.numero || '') + '"></div>' +
          '<div class="field" style="flex:0 1 180px"><label for="cfFecha">Fecha de la factura</label><input class="inp" type="date" id="cfFecha" value="' + attr(fac.fecha || '') + '"></div></div>' +
          '<div class="cf-valor"><span>Valor <b>' + esc(Money.fmt(Modelo.valor(o))) + '</b>, lo que suman los artículos.</span><button type="button" class="link fs12" id="cfValores">Cambiar los valores</button></div>' +
          '<div class="field" id="cfAdj"><div class="cf-adj-h"><label>Archivos de la orden</label><button type="button" class="btn btn-sm" data-adj-subir>' + Icon('upload', '', 12) + 'Adjuntar</button></div>' +
          '<div id="cfAdjLista"></div></div><div class="fs12 txt-dang" id="cfErr"></div>',
        pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-primary" id="cfOk">' + Icon('check', '', 14) + 'Guardar cambios</button>',
        alCerrar: () => res(hecho)
      });
      const lista = () => (o.adjuntos || []).filter(a => !quitados.has(a.id)).concat(nuevos.map(Adjuntos.meta));
      const pintar = () => { $('#cfAdjLista', m).innerHTML = Adjuntos.html(lista(), true); };
      pintar();
      const cont = $('#cfAdj', m);
      const adjuntando = Adjuntos.unir(cont, (a, ahorro) => {
        nuevos.push(a); pintar();
        if (ahorro) Toast.info('<b>' + esc(a.nombre) + '</b>: ' + esc(ahorro) + '.');
      });
      cont.addEventListener('click', e => {
        const v = e.target.closest('[data-adj-ver]');
        if (v) { const x = lista().find(y => y.id === v.dataset.adjVer); if (x) Adjuntos.ver(x, nuevos); return; }
        const q = e.target.closest('[data-adj-quitar]');
        if (q) { const id = q.dataset.adjQuitar; if (nuevos.some(y => y.id === id)) nuevos = nuevos.filter(y => y.id !== id); else quitados.add(id); pintar(); }
      });
      $('#cfValores', m).onclick = () => { Modal.cerrar(m); this.registrarFactura(o); };
      const boton = $('#cfOk', m), texto = boton.innerHTML;
      boton.onclick = async () => {
        boton.disabled = true;
        $('#cfErr', m).textContent = '';
        try {
          /* Un PDF que todavía se está comprimiendo se espera */
          if (adjuntando.ocupado()) { boton.innerHTML = '<span class="spin"></span>Comprimiendo el adjunto…'; await adjuntando.listo(); }
          const numero = $('#cfNum', m).value.trim(), fecha = $('#cfFecha', m).value;
          if (numero === (fac.numero || '') && fecha === (fac.fecha || '') && !quitados.size && !nuevos.length) { Modal.cerrar(m); return; }
          /* Sobre la orden como está ahora: si otra persona adjuntó algo mientras tanto, se queda */
          const actual = U.clonar(Datos.orden(o.id) || o);
          actual.adjuntos = (actual.adjuntos || []).filter(a => !quitados.has(a.id)).concat(nuevos.map(Adjuntos.meta));
          hecho = await OrdenService.guardarFactura(actual, { numero, fecha }, nuevos);
          Modal.cerrar(m, hecho);
          Toast.ok('Factura <b>' + esc(hecho.factura.numero) + '</b> corregida.');
        } catch (e) {
          $('#cfErr', m).textContent = e instanceof ErrorValidacion ? Object.values(e.errores).join(' ') : e.message;
          boton.disabled = false;
          boton.innerHTML = texto;
        }
      };
    });
  },
  /** Lo hace contabilidad cuando paga la factura */
  marcarPagada(o) {
    return new Promise(res => {
      let hecho = null;
      const m = Modal.abrir({
        titulo: 'Marcar como pagada', subtitulo: 'Orden ' + esc(Modelo.codigo(o)) + ' · ' + esc(Modelo.nombreProveedor(o)) + (o.factura ? ' · factura ' + esc(o.factura.numero || 's/n') : ''),
        cuerpo: '<p class="fs13 txt-2 mb12">Contabilidad la marca cuando paga la factura de <b>' + esc(Money.fmt(Modelo.valor(o))) + '</b>.</p>' +
          '<div class="row"><div class="field" style="flex:0 1 190px"><label>Fecha del pago</label><input class="inp" type="date" id="mpFecha" value="' + attr(Fecha.hoy()) + '"></div>' +
          '<div class="field"><label>Nota</label><input class="inp" id="mpNota" placeholder="Opcional: transferencia, cheque…"></div></div>',
        pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-primary" id="mpOk">' + Icon('checkCircle', '', 14) + 'Marcar como pagada</button>',
        alCerrar: () => res(hecho)
      });
      $('#mpOk', m).onclick = async () => {
        try {
          hecho = await OrdenService.marcarPagada(o, { fecha: $('#mpFecha', m).value, nota: $('#mpNota', m).value.trim() });
          Modal.cerrar(m, hecho);
          Toast.ok('Orden <b>' + esc(Modelo.codigo(o)) + '</b> pagada.');
        } catch (e) { Toast.err(esc(e instanceof ErrorValidacion ? Object.values(e.errores).join(' ') : e.message)); }
      };
    });
  },
  /** Cambiar el estado a mano, por si algo se marcó por error. Lo que necesita
      datos los pide: sin factura no se pasa a contabilidad ni a pagada */
  async cambiar(o, estado) {
    if (!o || estado === o.estado) return o;
    if (estado === 'ANULADA') return this.anular(o);
    const fac = o.factura && o.factura.numero;
    if (!fac && estado !== 'ESPERANDO') {
      Toast.info('Primero registre la factura: con ella se ponen los valores de lo comprado.');
      this.registrarFactura(o);
      return null;
    }
    if (estado === 'PAGADA') return this.marcarPagada(o);
    const quita = estado === 'ESPERANDO' ? [fac ? 'la factura ' + o.factura.numero : '', o.pago ? 'el pago' : ''].filter(Boolean) : o.pago ? ['el pago'] : [];
    const ok = await Modal.confirmar({ titulo: 'Cambiar el estado', ok: 'Cambiar',
      mensaje: 'La orden <b>' + esc(Modelo.codigo(o)) + '</b> pasa de «' + esc(ESTADOS[o.estado].t) + '» a «' + esc(ESTADOS[estado].t) + '».' +
        (quita.length ? ' Se quita ' + esc(quita.join(' y ')) + (estado === 'ESPERANDO' && fac ? '; los valores de los artículos se quedan.' : '.') : '') });
    if (!ok) return null;
    try {
      const n = await OrdenService.cambiarEstado(o, estado, { nota: 'Cambiado a mano', quitarFactura: estado === 'ESPERANDO', quitarPago: true,
        permiso: o.estado === 'PAGADA' ? 'pagar' : 'editar' });
      Toast.ok('Orden <b>' + esc(Modelo.codigo(n)) + '</b>: ' + esc(ESTADOS[estado].t.toLowerCase()) + '.');
      return n;
    } catch (e) { Toast.err(esc(e.message)); return null; }
  },
  async anular(o) {
    const motivo = await Modal.pedir({ titulo: 'Anular la orden ' + esc(Modelo.codigo(o)), etiqueta: 'Motivo', obligatorio: true, largo: true,
      mensaje: 'La orden conserva su número y queda marcada como anulada. No cuenta en las estadísticas.', ok: 'Anular orden', peligro: true,
      placeholder: 'Ej.: el proveedor no tenía el repuesto' });
    if (motivo == null) return null;
    const n = await OrdenService.cambiarEstado(o, 'ANULADA', { motivo, nota: motivo });
    Toast.ok('Orden <b>' + esc(Modelo.codigo(o)) + '</b> anulada.');
    return n;
  },
  async reactivar(o) {
    const a = (o.anulacion && o.anulacion.estadoPrevio) || 'ESPERANDO';
    const n = await OrdenService.cambiarEstado(o, a, { nota: 'Reactivada' });
    Toast.ok('Orden <b>' + esc(Modelo.codigo(o)) + '</b> reactivada como ' + esc(ESTADOS[a].t.toLowerCase()) + '.');
    return n;
  },
  async eliminar(o) {
    const ultima = Consecutivo.esUltima(o);
    const fac = o.factura && o.factura.numero;
    const despues = Datos.ordenes.some(x => (x.secuencia || 0) > (o.secuencia || 0));
    const ok = await Modal.confirmar({ titulo: 'Eliminar la orden ' + esc(Modelo.codigo(o)), peligro: true, ok: 'Eliminar',
      mensaje: 'Se borra del todo y no se puede deshacer. ' +
        (fac ? 'Se pierde también su factura <b>' + esc(fac) + '</b>' + (o.pago ? ' y su pago' : '') + ', y deja de contar en las estadísticas. ' : '') + (ultima
        ? 'Como es la última, el número <b>' + esc(o.numero) + '</b> vuelve a quedar libre y lo toma la próxima orden.' +
          ' Bórrela sólo si fue un error: si el proveedor ya la tiene, mejor ' + (o.estado === 'ANULADA' ? 'déjela anulada' : 'anúlela') + ', porque la próxima saldría con el mismo número.'
        : despues ? 'Como hay órdenes después de ella, el número <b>' + esc(o.numero) + '</b> queda sin usar (sólo vuelve a quedar libre si también se borran las siguientes).'
        : 'El número <b>' + esc(o.numero) + '</b> queda sin usar, porque el consecutivo se ajustó más adelante (' + esc(Consecutivo.vistaPrevia()) + ').') });
    if (!ok) return false;
    try {
      await OrdenService.eliminar(o);
      Toast.ok('Orden ' + esc(Modelo.codigo(o)) + ' eliminada.' + (ultima ? ' La próxima será la <b class="mono">' + esc(Consecutivo.vistaPrevia()) + '</b>.' : ''));
      Shell.refrescar();
      return true;
    } catch (e) { Toast.err(esc(e.message)); return false; }
  },
  async comoPlantilla(o) {
    const sug = [Modelo.nombreEquipo(o) ? 'Kit · ' + Modelo.nombreEquipo(o) : '', Modelo.nombreProveedor(o)].filter(Boolean).join(' · ');
    const nombre = await Modal.pedir({ titulo: 'Guardar como plantilla', etiqueta: 'Nombre de la plantilla', obligatorio: true, valor: o.concepto || sug,
      mensaje: 'Una plantilla guarda los artículos, el proveedor y el equipo para repetir este pedido con un clic.', ok: 'Guardar plantilla' });
    if (nombre == null) return;
    try {
      await PlantillaService.guardar(PlantillaService.desdeOrden(o, nombre));
      Toast.ok('Plantilla <b>' + esc(nombre) + '</b> guardada.', { accion: 'Ver plantillas', alAccionar: () => Router.ir('/plantillas') });
    } catch (e) { Toast.err(esc(e.message)); }
  },
  imprimir(o) { Documento.imprimir(o); },
  /** Lo que va en «⋯»: sólo lo que no tiene otro lugar (Juan, 30/10/2026).
      Ver la orden es un clic en la fila; copiar e imprimir tienen su ícono;
      editar y la factura están dentro de la orden, y los pasos (la factura, el
      pago y deshacerlo) en el estado. enLaOrden: allá Duplicar ya es un botón */
  opciones(o, alCambiar, enLaOrden) {
    const listo = r => { if (r) alCambiar && alCambiar(r); };
    const ed = Permiso.puede('editar');
    const ops = [];
    if (ed && !enLaOrden) ops.push({ texto: 'Duplicar', icono: 'copy', accion: () => Router.ir('/orden-nueva?duplicar=' + o.id) });
    if (o.excel) {
      if (ed) ops.push({ texto: 'Guardar como plantilla', icono: 'layers', accion: () => this.comoPlantilla(HistoricoExcel.paraCopiar(o.id)) });
      return ops;
    }
    /* Duplicar y hacer plantilla crean algo nuevo: cualquier editor. Lo demás
       cambia la orden: el administrador, o el Editor que la hizo */
    if (ed) ops.push({ texto: 'Guardar como plantilla', icono: 'layers', accion: () => this.comoPlantilla(o) });
    if (Permiso.puedeOrden(o)) {
      if (ops.length) ops.push('-');
      if (o.estado === 'ANULADA') ops.push({ texto: 'Reactivar', icono: 'rotate', accion: async () => listo(await this.reactivar(o)) });
      else ops.push({ texto: 'Anular', icono: 'ban', peligro: true, accion: async () => listo(await this.anular(o)) });
      ops.push({ texto: 'Eliminar', icono: 'trash', peligro: true, accion: async () => { if (await this.eliminar(o)) alCambiar && alCambiar(null); } });
    }
    return ops;
  },
  menu(boton, o, alCambiar, enLaOrden) {
    const ops = this.opciones(o, alCambiar, enLaOrden);
    if (ops.length) Menu.abrir(boton, ops);
  }
};

          Object.keys(FORMAS_PAGO).map(k => '<option value="' + k + '"' + (f.pago === k ? ' selected' : '') + '>' + FORMAS_PAGO[k] + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>Origen</label><select class="inp" id="fOrigen"><option value="">Todas</option>' +
          [['plataforma', 'Plataforma'], ['excel', 'Excel (histórico)']].map(([k, x]) => '<option value="' + k + '"' + (f.origen === k ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>Proveedor</label><select class="inp" id="fProv" style="max-width:220px"><option value="">Todos</option>' +
          provs.map(p => '<option value="' + attr(p.id) + '"' + (f.proveedorId === p.id ? ' selected' : '') + '>' + esc(p.nombre) + '</option>').join('') + '</select></div>' +

      '</div></div></div>' +
      '<div class="card"><div class="tbl-wrap" id="orTabla"></div><div id="orPager"></div></div>';
    const leer = () => ({ q: $('#fQ', el).value.trim(), estado: $('#fEstado', el).value, tipo: $('#fTipo', el).value, proveedorId: $('#fProv', el).value,

    const cambiar = () => { Prefs.set('filOrd', leer()); this.pag = 1; this.pintar(el); };
    $('#fQ', el).addEventListener('input', U.debounce(cambiar, 160));
    ['#fEstado', '#fTipo', '#fPago', '#fOrigen', '#fProv', '#fEq', '#fDesde', '#fHasta'].forEach(s => $(s, el).addEventListener('change', cambiar));
    $('#fLimpiar', el).onclick = () => { Prefs.set('filOrd', {}); Router.ir('/ordenes'); };
    $('#orCsv', el).onclick = () => Exportar.ordenes(this.lista(), 'csv');
    $('#orXlsx', el).onclick = () => Exportar.ordenes(this.lista(), 'xlsx');

      }

  lista() {
    const f = this.filtros();
    const nq = Txt.norm(f.q);
    /* El histórico del Excel va detrás de las órdenes de la plataforma, por su número; no tiene estado */
    const fuente = (f.origen === 'excel' ? [] : Datos.ordenes).concat(f.origen === 'plataforma' || f.estado ? [] : HistoricoExcel.lista());
    let l = fuente.filter(o =>
      (!f.estado || o.estado === f.estado) && (!f.tipo || o.tipo === f.tipo) && (!f.pago || o.formaPago === f.pago) && (!f.proveedorId || o.proveedorId === f.proveedorId) &&
      (!f.equipoId || o.equipoId === f.equipoId) && (!f.desde || o.fecha >= f.desde) && (!f.hasta || o.fecha <= f.hasta) &&
      (!nq || [o.numero, Modelo.codigo(o), Modelo.nombreProveedor(o), o.concepto, o.referencia, Modelo.nombreEquipo(o), o.factura && o.factura.numero, o.entregaRecibe,
        o.excel && o.excel.hoja, o.excel && o.excel.textoProveedor, ...o.items.map(i => i.descripcion + ' ' + i.observacion)].some(x => Txt.norm(x).includes(nq))));
    const { k, d } = this.orden || { k: 'secuencia', d: -1 };
    const pos = o => o.excel ? '0' + HistoricoExcel.clave(o) : '1' + String(o.secuencia || 0).padStart(7, '0');
    const val = {
      secuencia: pos, fecha: o => o.fecha + pos(o), proveedor: o => Modelo.nombreProveedor(o),
      total: o => Modelo.valor(o), estado: o => RUTA.indexOf(o.estado)
    }[k] || pos;
    l.sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y, 'es') : x - y) * d; });
    return l;
  },
  pintar(el) {
    const l = this.lista();
    const porPag = Prefs.get('filas', 25);
    const paginas = Math.max(1, Math.ceil(l.length / porPag));
    if (this.pag > paginas) this.pag = paginas;
    const vis = l.slice((this.pag - 1) * porPag, this.pag * porPag);
    const k = Analitica.kpis(l.filter(o => !o.excel));
    const nEx = l.filter(o => o.excel).length;
    $('#orSub', el).innerHTML = Txt.plural(l.length, 'orden', 'órdenes') + ' · Total ' + Money.redondo(k.total) +
      ' · ' + (k.sinFactura + k.porPagar) + ' abiertas' + (k.sinValor ? ' · ' + k.sinValor + ' sin valorizar' : '') +
      (nEx ? ' · <span data-tip="Copiadas del Excel: se consultan, pero no suman">' + nEx + ' del Excel</span>' : '');
    const th = (key, t, cls) => '<th class="sortable' + (cls ? ' ' + cls : '') + (this.orden.k === key ? ' sorted' : '') + '" data-sort="' + key + '">' + t +
      '<span class="sarrow">' + (this.orden.k === key ? (this.orden.d > 0 ? '▲' : '▼') : '▾') + '</span></th>';
    if (!l.length) {
      const hayFiltro = Object.values(this.filtros()).some(Boolean);
      $('#orTabla', el).innerHTML = Comp.vacio('doc', hayFiltro ? 'Ninguna orden coincide' : 'Aún no hay órdenes',
        hayFiltro ? 'Pruebe con otros filtros o límpielos.' : 'La primera tomará el número ' + esc(Consecutivo.vistaPrevia()) + '.',
        hayFiltro ? '' : si('editar', '<a class="btn btn-primary" href="#/orden-nueva">' + Icon('plus', '', 14) + 'Crear la primera orden</a>'));
      $('#orPager', el).innerHTML = '';
      return;
    }
    $('#orTabla', el).innerHTML = '<table class="tbl compacta"><thead><tr>' + th('secuencia', 'N.º') + '<th>Equipo o destino</th>' + th('fecha', 'Fecha') + '<th>Tipo</th>' +
      th('proveedor', 'Proveedor') + '<th>Concepto</th><th class="num">Ítems</th>' + th('total', 'Total', 'num') + th('estado', 'Estado') +
      '<th></th></tr></thead><tbody>' +
      vis.map(o => {
        const eq = Modelo.nombreEquipo(o), q = eq && Datos.equipo(o.equipoId);
        return '<tr class="row-click est-' + o.estado + '" data-ir="/orden/' + o.id + '"><td class="mono fw7 t-num nowrap">' + esc(Modelo.codigo(o)) +
          (o.adjuntos && o.adjuntos.length ? ' <span class="adj-ic" data-tip="' + attr(Txt.plural(o.adjuntos.length, 'archivo adjunto', 'archivos adjuntos')) + '">' + Icon('clip', '', 12) + '</span>' : '') + '</td>' +
          '<td class="trunc or-eq" style="max-width:170px" title="' + attr(eq) + '">' + (eq ? Icon(EquipoService.icono(q), '', 13) + esc(eq) : '<span class="txt-3">—</span>') + '</td>' +
          '<td class="nowrap">' + (o.excel && o.excel.sinDia ? o.fecha.slice(5, 7) + '/' + o.fecha.slice(0, 4) : Fecha.corta(o.fecha)) +
          (o.excel || !Modelo.autor(o) ? '' : '<div class="or-autor" title="Hecha por ' + attr(Modelo.autor(o)) + '">' + Icon('user', '', 10) + esc(Modelo.autorCorto(o)) + '</div>') +
          '</td><td>' + Comp.pillTipo(o.tipo) + Comp.pago(o) + '</td>' +

};

/* ---------- Detalle de una orden ---------- */
const VistaOrden = {

      esc(TIPOS[o.tipo].t) + ' <span class="mono">N.º ' + esc(Modelo.codigo(o)) + '</span> ' + Comp.selEstado(o) + '</h1>' +
      (eq ? '<div class="or-para">' + Icon(EquipoService.icono(eq), '', 16) + '<span>Para</span><b>' + esc(eq.nombre) + '</b>' +
        (EquipoService.sub(eq) ? '<small>' + esc(EquipoService.sub(eq)) + '</small>' : '') + '</div>' : '') +
      '<div class="ph-sub">' + esc(Fecha.larga(o.fecha)) + ' · ' + esc(Modelo.nombreProveedor(o)) + ' · ' +
      Txt.plural(o.items.length, 'artículo') + (Modelo.autor(o) ? ' · hecha por <b>' + esc(Modelo.autor(o)) + '</b>' : '') + '</div></div><div class="ph-actions">' +
      '<button class="btn" id="odCopiar" data-tip="Para pegarla en WhatsApp o en un correo">' + Icon('image', '', 14) + 'Copiar imagen</button>' +
      '<button class="btn btn-primary" id="odImp">' + Icon('print', '', 14) + 'Imprimir o PDF</button>' +

    /* Un Editor mirando la orden de otra persona: sabe por qué no la puede cambiar */

      h += '<div class="alert a-info mb16">' + Icon('lock') + '<div>Esta orden la hizo <b>' + esc(Modelo.autor(o) || 'otra persona') +

      h += '<div class="alert a-err mb16">' + Icon('ban') + '<div><b>Orden anulada</b>' + (o.anulacion && o.anulacion.en ? ' el ' + esc(Fecha.stamp(o.anulacion.en)) : '') +
        (o.anulacion && o.anulacion.motivo ? '. Motivo: ' + esc(o.anulacion.motivo) : '') + '. No cuenta en las estadísticas.</div></div>';
    }
    h += '<div class="grid g-form"><div class="col">' +

      const s = e.target.closest('select[data-estado]');

      const b = e.target.closest('[data-paso]');

      const v = e.target.closest('[data-adj-ver]');
      if (v) { const m = (o.adjuntos || []).find(x => x.id === v.dataset.adjVer); if (m) Adjuntos.ver(m); return; }
      const q = e.target.closest('[data-adj-quitar]');
      if (q) {
        const m = (o.adjuntos || []).find(x => x.id === q.dataset.adjQuitar);
        if (m && await Modal.confirmar({ titulo: 'Quitar el archivo', mensaje: '¿Quitar <b>' + esc(m.nombre) + '</b> de la orden ' + esc(o.numero) + '? Se borra de la plataforma.', ok: 'Quitar', peligro: true })) {
          await OrdenService.quitarAdjunto(Datos.orden(o.id), m.id); Toast.ok('Archivo quitado.'); recargar();

      }

    if (cAdj && Permiso.puedeOrden(o)) Adjuntos.unir(cAdj, async (a, ahorro) => { await OrdenService.adjuntar(Datos.orden(o.id), a); Toast.ok('<b>' + esc(a.nombre) + '</b> adjuntado' + (ahorro ? ', ' + esc(ahorro) : '') + '.'); recargar(); });
  },
  adjuntos(o) {

      (o.factura.fecha ? ' · ' + esc(Fecha.corta(o.factura.fecha)) : '') + ' · ' + esc(Money.fmt(Modelo.valor(o))) + '</span>' +
      (mia && ['CONTABILIDAD', 'PAGADA'].includes(o.estado) ? '<button type="button" class="btn btn-ghost btn-icon btn-sm" data-fact data-tip="Corregir la factura" aria-label="Corregir la factura">' + Icon('edit', '', 13) + '</button>' : '') +

    return '<div class="card" id="odAdj"><div class="card-h"><h3>' + Icon('clip', '', 15) + 'Cotización y soportes</h3><span class="ch-sub">' + (l.length ? Txt.plural(l.length, 'archivo') : 'PDF o fotos') + '</span>' +

      '<div class="card-b">' + fac + Adjuntos.html(l, mia) + '</div></div>';
  },

  ruta(o) {
    const actual = RUTA.indexOf(o.estado);

    /* [paso, botón, ícono, quién lo hace]: compras registra la factura; contabilidad, el pago */
    const siguiente = {
      ESPERANDO: ['FACTURA', 'Llegó la factura', 'receipt', 'editar'],
      CONTABILIDAD: ['PAGAR', 'Marcar como pagada', 'checkCircle', 'pagar']

      const u = ultimo(e);
      const cerrada = o.estado === 'PAGADA' && i === actual;

        (i === actual && siguiente ? (Permiso.puedeOrden(o) ? si(siguiente[3], '<button class="btn btn-sm btn-primary" data-paso="' + siguiente[0] + '">' + Icon(siguiente[2], '', 12) + esc(siguiente[1]) + '</button>') : '') +

    }

  resumen(o) {

            '<div class="hj-emp">' + esc(emp.nombre) + '</div><div class="hj-meta">' + esc([emp.nit ? (emp.tipoDoc || 'NIT') + ' ' + emp.nit : '', emp.ciudad].filter(Boolean).join(' · ')) + '</div></div>' +
          '<div class="hj-num"><small>N.º</small><b id="ofNumPrev">' + esc(Modelo.codigo(o, this.editando ? o.numero : Consecutivo.vistaPrevia(o.fecha))) + '</b>' +

  marcar() { Router.sucio = true; },
  pintarAdjuntos() {
    $('#ofAdjLista', this.el).innerHTML = Adjuntos.html(this.o.adjuntos, true);
    /* Junto al número de la factura, los archivos que ya tiene la orden */
    const f = $('#ofFacAdjLista', this.el);
    if (f) f.innerHTML = this.o.adjuntos.length ? this.o.adjuntos.map(a => '<button type="button" class="fac-chip" data-adj-ver="' + attr(a.id) + '" data-tip="Ver el archivo">' +
      Icon(/pdf/.test(a.tipo || '') ? 'doc' : 'image', '', 12) + '<span>' + esc(a.nombre) + '</span></button>').join('') : '<span class="txt-3 fs12">Todavía sin archivos</span>';
  },
  /** El número de arriba, con las iniciales del tipo escogido */
  pintarNumero() {
    const b = $('#ofNumPrev', this.el), o = this.o;
    if (!b) return;
    if (this.editando) b.textContent = Modelo.codigo(o);
    else if (Fecha.valida(o.fecha)) b.textContent = Modelo.codigo(o, Consecutivo.vistaPrevia(o.fecha));
  },
  /** El botón de guardar dice lo que va a pasar */
  pintarBotones() {
    const o = this.o;
    const t = this.modoFactura ? (o.estado === 'ESPERANDO' ? 'Pasar a contabilidad' : 'Guardar la factura') : this.yaPagada ? 'Guardar como pagada' : 'Guardar orden';
    $$('[data-acc="guardar"]', this.el).forEach(b => { b.innerHTML = Icon(this.modoFactura ? 'receipt' : this.yaPagada ? 'checkCircle' : 'save', '', 14) + t; });
  },
  /** «Ya se pagó» se ofrece en una de contado que no ha pasado de «esperando», a quien puede registrar pagos */
  puedePagarYa() {
    const o = this.o;
    return !this.modoFactura && o.formaPago === 'CONTADO' && (!this.editando || o.estado === 'ESPERANDO') && Permiso.puede('pagar');
  },
  /** Siempre queda la hoja mínima y una fila vacía al final para seguir escribiendo */
  completarFilas() {
    const o = this.o;
    if (!o.items.length || Modelo.itemValido(o.items[o.items.length - 1])) o.items.push(Modelo.itemVacio());
    while (o.items.length < this.FILAS) o.items.push(Modelo.itemVacio());
  },
  unir() {
    const el = this.el, o = this.o;
    const volver = () => Router.ir(this.editando ? '/orden/' + o.id : '/ordenes', { reemplazar: true });
    $('#ofVolver', el).onclick = volver;
    $$('[data-acc]', el).forEach(b => { b.onclick = () => (b.dataset.acc === 'cancelar' ? volver() : this.guardar()); });
    el.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); this.guardar(); } });
    $('#ofFecha', el).addEventListener('change', e => { o.fecha = e.target.value; this.marcar(); this.pintarNumero(); });
    /* Si otra persona guarda una orden mientras se llena esta, el número de arriba se corre solo */
    if (!this.editando) {
      const quitar = Bus.on('ordenes:cambio', () => {
        const b = $('#ofNumPrev', el);
        if (!b || !b.isConnected) { quitar(); return; }
        this.pintarNumero();
      });
    }
    $('#ofTipo', el).addEventListener('change', e => { o.tipo = e.target.value; this.marcar(); this.pintarNumero(); });
    if (this.modoFactura) {
      ['#ofFacNum', '#ofFacFecha'].forEach(s => $(s, el).addEventListener('input', () => this.marcar()));
      /* La factura se adjunta al lado de su número, o soltándola encima del recuadro */
      const fac = $('#ofFacCard', el);
      $('#ofFacAdjBtn', el).onclick = () => $('#ofAdj input[type="file"]', el).click();
      fac.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); fac.classList.add('adj-sobre'); } });
      fac.addEventListener('dragleave', e => { if (!fac.contains(e.relatedTarget)) fac.classList.remove('adj-sobre'); });
      fac.addEventListener('drop', e => { if (!e.dataTransfer.files.length) return; e.preventDefault(); fac.classList.remove('adj-sobre'); this.adjuntando.tomar([...e.dataTransfer.files]); });
      $('#ofFacAdjLista', el).addEventListener('click', e => {
        const v = e.target.closest('[data-adj-ver]');
        const m = v && o.adjuntos.find(x => x.id === v.dataset.adjVer);
        if (m) Adjuntos.ver(m, this.adjNuevos);
      });
    }
    $('#ofConcepto', el).addEventListener('input', e => { o.concepto = e.target.value; this.marcar(); });
    $('#ofRef', el).addEventListener('input', e => { o.referencia = e.target.value; this.marcar(); });
    $('#ofNota', el).addEventListener('input', e => { o.notaProveedor = e.target.value; this.marcar(); });
    $('#ofInt', el).addEventListener('input', e => { o.notasInternas = e.target.value; this.marcar(); });
    /* Proveedor */
    const inpP = $('#ofProv', el);
    Combo.unir(inpP, {
      alAbrirVacio: true,
      fuente: txt => ProveedorService.ordenados(true).filter(p => ProveedorService.coincide(p, txt)).slice(0, 12).map(p => {
        const n = Datos.ordenes.filter(x => x.proveedorId === p.id).length;
        return { html: Txt.resaltar(p.nombre, txt), s: [p.categoria, p.nit ? 'NIT ' + p.nit : ''].filter(Boolean).join(' · '),
          tag: n ? Txt.plural(n, 'orden', 'órdenes') : (p.historico ? 'Excel ' + p.historico.hasta.slice(0, 4) : 'nuevo'), data: p };
      }),
      vacio: 'Ningún proveedor coincide.',
      alElegir: it => this.elegirProveedor(it.data),
      nuevo: { texto: t => 'Crear el proveedor «' + t + '»', accion: async t => { const np = await ProveedorForm.abrir({ nombre: t }); if (np) this.elegirProveedor(np); } }
    });
    inpP.addEventListener('input', () => {
      const p = Datos.prov(o.proveedorId);
      if (!p || Txt.norm(p.nombre) !== Txt.norm(inpP.value)) { o.proveedorId = null; this.pintarProveedor(); }
      this.marcar();
    });
    /* Equipo */
    const inpE = $('#ofEq', el);
    const ponerEquipo = q => { o.equipoId = q ? q.id : null; inpE.value = q ? q.nombre : ''; inpE.classList.remove('is-err'); this.pintarEquipo(); this.marcar(); };
    Combo.unir(inpE, {
      alAbrirVacio: true,
      fuente: txt => EquipoService.ordenados(true).filter(x => EquipoService.coincide(x, txt)).slice(0, 12)
        .map(x => ({ html: Txt.resaltar(x.nombre, txt), s: EquipoService.sub(x), data: x })),
      vacio: 'Ningún equipo coincide.',
      alElegir: it => ponerEquipo(it.data),

  /* ---------- Artículos: la tabla de la hoja ---------- */

      '<td class="it-uni"><input class="inp" data-k="unidad" data-i="' + i + '" list="dlUnidades" value="' + attr(vacia ? '' : it.unidad) + '" placeholder="Unidad" aria-label="Unidad"></td>' +
      '<td class="it-val"><input class="inp" data-k="valorUnitario" data-i="' + i + '" value="' + attr(it.valorUnitario ? Money.num(it.valorUnitario) : '') + '" placeholder="Valor" aria-label="Valor unitario"></td>' +
      '<td class="it-dto"><input class="inp inp-num" data-k="descuentoPct" data-i="' + i + '" inputmode="decimal" value="' + attr(Modelo.descuento(it) ? Num.fmt(Modelo.descuento(it)) : '') + '" placeholder="% Desc." aria-label="Descuento en %"></td>' +
      '<td class="it-tot" data-tot="' + i + '"></td>' +

        Icon('x', '', 13) + '</button></td></tr>';
  },
  /** Autocompletar, pegar y formato de pesos de una fila */
  unirFila(tr, i) {
    const o = this.o;
    MoneyInput.unir($('[data-k="valorUnitario"]', tr));
    const inp = $('[data-k="descripcion"]', tr);
    Combo.unir(inp, {
      fuente: txt => Catalogo.buscar(txt, o.proveedorId, 8).map(a => ({ html: Txt.resaltar(a.descripcion, txt),
        s: a.unidad + (a.valor ? ' · último ' + Money.fmt(a.valor) : '') + ' · ' + Txt.plural(a.veces, 'vez', 'veces'),
        tag: a.proveedores.has(o.proveedorId) ? 'este proveedor' : '', data: a })),
      alElegir: it => {
        const item = o.items[i];
        item.descripcion = it.data.descripcion;
        item.unidad = it.data.unidad || item.unidad;
        if (!Money.parse(item.valorUnitario) && it.data.valor) item.valorUnitario = it.data.valor;
        inp.value = item.descripcion;
        tr.classList.remove('it-vacia');
        $('[data-k="cantidad"]', tr).value = Num.parse(item.cantidad) > 0 ? Num.fmt(item.cantidad) : '';
        $('[data-k="unidad"]', tr).value = item.unidad;
        $('[data-k="valorUnitario"]', tr).value = item.valorUnitario ? Money.num(item.valorUnitario) : '';
        if (i === o.items.length - 1) this.agregarFila();
        this.totalFila(i); this.pintarResumen(); this.marcar();
        $('[data-k="cantidad"]', tr).focus(); $('[data-k="cantidad"]', tr).select();
      }
    });
    inp.addEventListener('paste', e => this.pegar(e, i));
  },
  pintarItems() {
    const o = this.o, tb = $('#ofItems', this.el);
    Combo.limpiar();
    tb.innerHTML = o.items.map((it, i) => this.fila(it, i)).join('');
    $$('tr', tb).forEach((tr, i) => { this.unirFila(tr, i); this.totalFila(i); });
    if (!tb._unido) {
      tb._unido = true;
      tb.addEventListener('input', e => {
        const inp = e.target.closest('input[data-k]'); if (!inp) return;
        const i = +inp.dataset.i, k = inp.dataset.k, it = o.items[i];
        if (!it) return;
        it[k] = k === 'valorUnitario' ? Money.parse(inp.value) : inp.value;
        if (k === 'cantidad' || k === 'valorUnitario' || k === 'descuentoPct') { this.totalFila(i); this.pintarResumen(); }
        if (k === 'descripcion') {
          /* Al empezar una fila se ven la cantidad y la unidad que trae, y aparece otra vacía debajo */
          const tr = inp.closest('tr'), c = $('[data-k="cantidad"]', tr), u = $('[data-k="unidad"]', tr);
          tr.classList.toggle('it-vacia', !inp.value.trim());
          if (inp.value.trim()) {
            if (!c.value && Num.parse(it.cantidad) > 0) c.value = Num.fmt(it.cantidad);
            if (!u.value && it.unidad) u.value = it.unidad;
            if (i === o.items.length - 1) this.agregarFila();
          }
          this.totalFila(i); this.pintarResumen();
        }
        this.marcar();
      });
      tb.addEventListener('change', e => {
        const inp = e.target.closest('input[data-k="unidad"]');
        if (inp) { inp.value = Txt.mayus(inp.value.trim()); o.items[+inp.dataset.i].unidad = inp.value; }
        const c = e.target.closest('input[data-k="cantidad"]');
        if (c) { const v = Num.parse(c.value); c.value = c.value.trim() ? Num.fmt(v) : ''; o.items[+c.dataset.i].cantidad = v; this.totalFila(+c.dataset.i); this.pintarResumen(); }
        const dp = e.target.closest('input[data-k="descuentoPct"]');
        if (dp) { const v = Num.parse(dp.value); dp.value = v ? Num.fmt(v) : ''; o.items[+dp.dataset.i].descuentoPct = v; this.totalFila(+dp.dataset.i); this.pintarResumen(); }
      });
      tb.addEventListener('click', e => {
        const b = e.target.closest('[data-quitar]'); if (!b) return;
        const i = +b.dataset.quitar;
        const tenia = Modelo.itemValido(o.items[i]);
        o.items.splice(i, 1);
        this.completarFilas(); this.pintarItems(); this.pintarResumen();
        if (tenia) this.marcar();
      });
      /* Como en la hoja: Enter y las flechas pasan de fila en la misma columna */
      tb.addEventListener('keydown', e => {
        const inp = e.target.closest('input[data-k]');
        if (!inp || e.ctrlKey || e.metaKey || e.altKey || !['Enter', 'ArrowDown', 'ArrowUp'].includes(e.key)) return;
        if ([...Combo.vivos].some(c => c.input === inp && c.portal.classList.contains('open'))) return;
        if (e.key !== 'Enter' && inp.hasAttribute('list')) return;
        e.preventDefault();
        const i = +inp.dataset.i;
        if (e.key === 'ArrowUp') { if (i > 0) this.enfocar(i - 1, inp.dataset.k); return; }
        let k = inp.dataset.k;
        if (i === o.items.length - 1) {
          if (!Modelo.itemValido(o.items[i])) return;
          this.agregarFila(); k = 'descripcion';
        }
        this.enfocar(i + 1, k);
      });
    }
    this.pintarSubItems();
  },
  /** Una fila más al final, sin volver a pintar las demás (no se pierde lo que se escribe) */
  agregarFila() {
    const o = this.o, tb = $('#ofItems', this.el);
    o.items.push(Modelo.itemVacio());
    const i = o.items.length - 1;
    tb.insertAdjacentHTML('beforeend', this.fila(o.items[i], i));
    this.unirFila(tb.lastElementChild, i);
    this.totalFila(i);
  },
  enfocar(i, k) { const inp = $('#ofItems input[data-i="' + i + '"][data-k="' + k + '"]', this.el); if (inp) { inp.focus(); inp.select && inp.select(); } },
  totalFila(i) {
    const td = $('[data-tot="' + i + '"]', this.el);
    if (!td) return;
    const it = this.o.items[i];
    const t = Modelo.itemValido(it) ? Modelo.totalItem(it) : 0;
    td.innerHTML = t ? Money.fmt(t) : '';
  },
  pintarSubItems() {
    const v = this.o.items.filter(Modelo.itemValido);
    const conV = v.filter(it => Money.parse(it.valorUnitario) > 0).length;
    const s = $('#ofItSub', this.el);
    if (s) s.textContent = v.length ? Txt.plural(v.length, 'artículo') + (conV === v.length ? ' con precio' : conV ? ' · ' + conV + ' con precio' : ' · sin precios') : '';
  },
  /** Pegar varias líneas: cada línea es un artículo. Si vienen de Excel, las
      columnas (separadas por tabulador) son descripción, cantidad, unidad y valor. */
  pegar(e, i) {
    const txt = (e.clipboardData || window.clipboardData).getData('text');
    if (!txt || !/[\r\n\t]/.test(txt.trim())) return;
    e.preventDefault();
    const filas = txt.replace(/\r/g, '').split('\n').map(l => l.trim() ? l.split('\t').map(x => x.trim()) : null).filter(Boolean);
    const nuevos = filas.map(c => {
      const it = Modelo.itemVacio();
      it.descripcion = c[0] || '';
      if (c[1] && Num.parse(c[1]) > 0) it.cantidad = Num.parse(c[1]);
      if (c[2]) it.unidad = Txt.mayus(c[2]);
      if (c[3] && Money.parse(c[3]) > 0) it.valorUnitario = Money.parse(c[3]);
      if (c[4]) it.observacion = c[4];
      return it;
    }).filter(Modelo.itemValido);
    if (!nuevos.length) return;
    const o = this.o;
    o.items.splice(i, Modelo.itemValido(o.items[i]) ? 0 : 1, ...nuevos);
    this.completarFilas(); this.pintarItems(); this.pintarResumen(); this.marcar();
    Toast.ok('Se agregaron ' + Txt.plural(nuevos.length, 'artículo') + ' pegados.');
  },

    const o = this.o, t = Modelo.totales(o), el = this.el;
    const menos = v => v ? '− ' + Money.fmt(v) : Money.fmt(0);
    $('#ofSubL', el).textContent = o.ivaIncluido ? 'Subtotal sin IVA' : 'Subtotal';
    $('#ofSubV', el).textContent = Money.fmt(t.subtotal);
    $('#ofRetV', el).textContent = menos(t.retencion);
    $('#ofIcaV', el).textContent = menos(t.reteIca);
    $('#ofIvaV', el).textContent = Money.fmt(t.iva);
    $('#ofFleV', el).textContent = t.flete ? '+ ' + Money.fmt(t.flete) : Money.fmt(0);
    $('#ofTotV', el).textContent = Money.fmt(t.total);
    $('#ofTotNota', el).textContent = !t.valorizada ? 'Sin precios: puede enviarla así y registrar la factura después.'
      : o.ivaIncluido ? 'Los precios ya traen el IVA: no se suma. Total = lo que suman los artículos − retención − ReteICA + flete.'
      : 'Total = subtotal − retención − ReteICA + IVA + flete, como en la factura.';
    this.pintarSubItems();
  },
  /** Al lado del proveedor: lo que suministra, sus condiciones y su última orden (también la del Excel) */
  pintarProveedor() {
    const o = this.o;
    const cont = $('#ofProvInfo', this.el);
    const p = Datos.prov(o.proveedorId);
    if (!p) { cont.innerHTML = '<span class="txt-3">Sus datos y condiciones se cargan solos. Si no aparece, créelo desde la misma lista.</span>'; return; }
    const falt = ProveedorService.faltantes(p);
    const ult = OrdenService.ultimaDe(p.id, o.id) || HistoricoExcel.lista().filter(h => h.proveedorId === p.id).sort(HistoricoExcel.porNumero)[0];
    const cond = p.formaPago ? FORMAS_PAGO[p.formaPago] + (p.plazoDias ? ' a ' + p.plazoDias + ' días' : '') : '';
    cont.innerHTML = esc([p.categoria, cond, p.nit ? 'NIT ' + p.nit : ''].filter(Boolean).join(' · ')) +
      (falt.length ? ' <button type="button" class="link fs12" id="ofEditProv" data-tip="Le falta: ' + attr(falt.join(', ')) + '">Completar datos</button>' : '') +
      (ult ? '<div class="hj-ult">Última orden: <a href="#/orden/' + attr(ult.id) + '" class="mono fw7">' + esc(Modelo.codigo(ult)) + '</a>' + (ult.excel ? ' del Excel' : '') +
        ', ' + esc(Fecha.corta(ult.fecha)) + ' · <button type="button" class="link fs12" id="ofRepetir">Repetir sus artículos (' + ult.items.length + ')</button></div>' : '');
    const ed = $('#ofEditProv', cont);
    if (ed) ed.onclick = async () => { const np = await ProveedorForm.abrir(p); if (np) this.pintarProveedor(); };
    const rep = $('#ofRepetir', cont);
    if (rep) rep.onclick = () => this.agregarItems(ult.excel ? HistoricoExcel.paraCopiar(ult.id).items : ult.items, 'la orden ' + ult.numero + (ult.excel ? ' del Excel' : ''));
  },
  pintarEquipo() {
    const q = Datos.equipo(this.o.equipoId);
    $('#ofEqInfo', this.el).innerHTML = q ? Icon(EquipoService.icono(q), '', 14) + ' ' + esc(EquipoService.sub(q))
      : '<span class="txt-3">El vehículo, la máquina o el destino (oficina, bodega, finca…) para el que se compra.</span>';
  },
  /** Las firmas como salen impresas: el solicitante se escoge sobre su línea */
  pintarSolicitante() {
    const o = this.o, cfg = Datos.cfg, ce = Empresa.cfg(Empresa.de(o));
    const cont = $('#ofSol', this.el);
    const lista = Config.solicitantes();
    if (o.solicitante && !lista.some(s => s.id === o.solicitante.id)) lista.unshift(Object.assign({}, o.solicitante, { _viejo: true }));
    const firmaDe = id => (cfg.solicitantes.find(s => s.id === id) || {}).firma;
    const bloque = (img, nombre, cargo, rol) => '<div class="hj-firma"><div class="hj-fm">' + (img ? '<img src="' + attr(img) + '" alt="Firma">' : '') + '</div><div class="hj-ln"></div>' +
      nombre + '<small>' + esc(cargo || '') + '</small><small>' + rol + '</small></div>';
    if (lista.length) {
      const elegido = (o.solicitante && lista.find(s => s.id === o.solicitante.id)) || lista[0];
      o.solicitante = { id: elegido.id, nombre: elegido.nombre, cargo: elegido.cargo, telefono: elegido.telefono || '' };
    }
    cont.innerHTML = (lista.length ? bloque(firmaDe(o.solicitante.id), '<select class="inp hj-solsel" id="ofSolSel" aria-label="Solicitante">' +
        lista.map(s => '<option value="' + attr(s.id) + '"' + (o.solicitante.id === s.id ? ' selected' : '') + '>' + esc(s.nombre) + (s._viejo ? ' (inactivo)' : '') + '</option>').join('') + '</select>',
        o.solicitante.cargo, 'Solicitante')
      : '<div class="hj-firma"><div class="hj-fm"></div><div class="hj-ln"></div><div class="fs12 txt-3">No hay firmantes activos. <a href="#/configuracion">Agregue uno en Configuración</a>.</div></div>') +
      (ce.autoriza && ce.autoriza.nombre ? bloque(ce.autoriza.firma, '<b>' + esc(ce.autoriza.nombre) + '</b>', ce.autoriza.cargo, 'Autorizó') : '');
    const s = $('#ofSolSel', cont);
    if (s) s.addEventListener('change', () => { const x = lista.find(y => y.id === s.value); if (x) o.solicitante = { id: x.id, nombre: x.nombre, cargo: x.cargo, telefono: x.telefono || '' }; this.marcar(); this.pintarSolicitante(); });
  },
  menuPlantillas(boton) {
    const o = this.o;
    const lista = Datos.plantillas.slice().sort((a, b) => (b.proveedorId === o.proveedorId) - (a.proveedorId === o.proveedorId) || (b.usos || 0) - (a.usos || 0));
    if (!lista.length) { Toast.info('Aún no hay plantillas. Guarde una orden como plantilla desde su menú ⋯ (también sirven las del Excel).'); return; }
    Menu.abrir(boton, lista.slice(0, 12).map(pl => ({ texto: pl.nombre + ' (' + pl.items.length + ')', icono: 'layers', accion: () => {
      if (!o.proveedorId && pl.proveedorId && Datos.prov(pl.proveedorId)) this.elegirProveedor(Datos.prov(pl.proveedorId));
      if (!o.equipoId && pl.equipoId && Datos.equipo(pl.equipoId)) { o.equipoId = pl.equipoId; $('#ofEq', this.el).value = Datos.equipo(pl.equipoId).nombre; this.pintarEquipo(); }
      o.plantillaId = pl.id;
      this.agregarItems(pl.items, 'la plantilla');
    } })).concat(['-', { texto: 'Administrar plantillas', icono: 'cog', accion: () => Router.ir('/plantillas') }]));
  },
  /** Agrega artículos copiados: si la orden está vacía los pone, si no, al final */
  agregarItems(items, deDonde) {
    const o = this.o;
    const nuevos = items.map(it => Object.assign(Modelo.itemVacio(), U.clonar(it), { id: ID() }));
    const tenia = o.items.filter(Modelo.itemValido);
    o.items = tenia.concat(nuevos);
    this.completarFilas(); this.pintarItems(); this.pintarResumen(); this.marcar();
    Toast.ok(Txt.plural(nuevos.length, 'artículo') + ' de ' + esc(deDonde) + (tenia.length ? ', agregados al final.' : '.'));
  },
  async guardar() {
    const el = this.el;
    $('#ofErr', el).innerHTML = '';
    $$('.is-err', el).forEach(x => x.classList.remove('is-err'));
    $('#ofProvErr', el).classList.add('hidden');
    const btns = $$('[data-acc="guardar"]', el);
    btns.forEach(b => { b.disabled = true; });
    try {
      /* Un PDF que todavía se está comprimiendo se espera: así se guarda con la orden */
      if (this.adjuntando && this.adjuntando.ocupado()) {
        const textos = btns.map(b => b.innerHTML);
        btns.forEach(b => { b.innerHTML = '<span class="spin"></span>Comprimiendo el adjunto…'; });
        await this.adjuntando.listo();
        btns.forEach((b, i) => { b.innerHTML = textos[i]; });
      }
      if (this.editando && !Datos.orden(this.o.id)) {
        btns.forEach(b => { b.disabled = false; });
        Modal.alerta('Esta orden ya no existe', 'Otra persona la eliminó mientras usted la editaba. Lo que escribió no se guardó.', 'err');
        return;
      }
      if (this.editando && db.version('ordenes', this.o.id) !== this.version) {
        const ok = await Modal.confirmar({ titulo: 'Otra persona cambió esta orden', ok: 'Guardar lo mío', cancelar: 'Volver a la hoja',
          mensaje: 'Mientras usted la editaba, alguien más guardó cambios en la orden <b>' + esc(this.o.numero) + '</b>. Si guarda, lo que usted escribió en la hoja ' +
            '(artículos, valores, proveedor y demás datos) queda encima de lo de esa persona. El estado, el pago y la anulación se conservan como están.' });
        if (!ok) { btns.forEach(b => { b.disabled = false; }); return; }
        this.version = db.version('ordenes', this.o.id);
      }
      const previsto = this.editando || !$('#ofNumPrev', el) ? '' : $('#ofNumPrev', el).textContent.trim();
      const pagada = this.yaPagada && this.puedePagarYa();
      const g = this.modoFactura
        ? await OrdenService.guardarFactura(this.o, { numero: $('#ofFacNum', el).value, fecha: $('#ofFacFecha', el).value }, this.adjNuevos)
        : pagada ? await OrdenService.guardarPagada(this.o, { numero: this.recibo.numero, fecha: this.recibo.fecha || this.o.fecha }, this.adjNuevos)
        : await OrdenService.guardar(this.o, this.adjNuevos);
      Router.sucio = false;
      Toast.ok(this.modoFactura ? 'Factura <b>' + esc(g.factura.numero) + '</b> guardada: la orden ' + esc(Modelo.codigo(g)) + ' está en contabilidad.'
        : pagada ? 'Orden <b class="mono">' + esc(Modelo.codigo(g)) + '</b> registrada como pagada de contado.'
        : (this.editando ? 'Cambios guardados en la orden ' : 'Orden creada: ') + '<b class="mono">' + esc(Modelo.codigo(g)) + '</b>.');
      /* Otra persona guardó una orden con el número que se veía: esta tomó el siguiente */
      if (previsto && Modelo.codigo(g) !== previsto) Toast.info('El número <b class="mono">' + esc(previsto) + '</b> lo tomó otra orden guardada casi al mismo tiempo. Esta quedó con el <b class="mono">' + esc(Modelo.codigo(g)) + '</b>.', { ms: 9000 });
      Shell.refrescar();
      Router.ir('/orden/' + g.id, { reemplazar: true });
    } catch (e) {
      btns.forEach(b => { b.disabled = false; });
      if (e instanceof ErrorValidacion) {
        const er = e.errores;
        if (er.proveedor) { $('#ofProv', el).classList.add('is-err'); const pe = $('#ofProvErr', el); pe.textContent = er.proveedor; pe.classList.remove('hidden'); }
        if (er.fecha) $('#ofFecha', el).classList.add('is-err');
        if (er.factura) $('#ofFacNum', el).classList.add('is-err');
        if (er.facturaFecha) $('#ofFacFecha', el).classList.add('is-err');
        if (er.pagoFecha && $('#ofPgFecha', el)) $('#ofPgFecha', el).classList.add('is-err');
        if (er.equipo) $('#ofEq', el).classList.add('is-err');
        if (er.valores) $$('#ofItems input[data-k="valorUnitario"]', el).forEach((x, i) => { if (Modelo.itemValido(this.o.items[i])) x.classList.add('is-err'); });
        Object.keys(er).forEach(k => {
          const m = /^(cant|val|desc)-(.+)$/.exec(k);
          if (!m) return;
          const i = this.o.items.findIndex(it => it.id === m[2]);
          const inp = $('#ofItems input[data-i="' + i + '"][data-k="' + { cant: 'cantidad', val: 'valorUnitario', desc: 'descuentoPct' }[m[1]] + '"]', el);
          if (inp) inp.classList.add('is-err');
        });
        if (er.reteIca) $('#ofIca', el).classList.add('is-err');
        if (er.flete) $('#ofFlete', el).classList.add('is-err');
        $('#ofErr', el).innerHTML = '<div class="alert a-err mb12">' + Icon('warn') + '<div><b>Falta algo para guardar:</b><ul style="margin:4px 0 0;padding-left:18px">' +
          Object.values(er).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div></div>';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        console.error(e);
        Toast.err('No se pudo guardar: ' + esc(e.message || e));
      }
    }
  }
};

/* Editor sencillo de artículos para las plantillas (sin precios obligatorios) */
const EditorItems = {
  html(items) {
    return '<div class="card"><div class="tbl-wrap"><table class="items-ed pl"><thead><tr><th class="it-n">#</th><th>Descripción</th><th class="num" style="width:84px">Cantidad</th>' +
      '<th style="width:100px">Unidad</th><th class="num" style="width:130px">Valor unitario</th><th style="width:34px"></th></tr></thead><tbody data-ed>' +
      items.map((it, i) => this.fila(it, i)).join('') + '</tbody></table></div>' +
      '<div class="items-pie"><button type="button" class="btn btn-sm" data-ed-add>' + Icon('plus', '', 12) + 'Agregar artículo</button>' +
      '<span class="ip-nota">El valor es opcional: si lo pone, se propone en cada orden.</span></div></div>';
  },
  fila(it, i) {
    return '<tr><td class="it-n">' + (i + 1) + '</td><td class="it-desc"><input class="inp" data-c="descripcion" value="' + attr(it.descripcion) + '"></td>' +
      '<td class="it-cant"><input class="inp inp-num" data-c="cantidad" value="' + attr(Num.fmt(it.cantidad || 1)) + '" inputmode="decimal"></td>' +
      '<td class="it-uni"><input class="inp" data-c="unidad" list="dlUnidadesPl" value="' + attr(it.unidad || 'UND') + '"></td>' +
      '<td class="it-val"><input class="inp" data-c="valorUnitario" value="' + attr(it.valorUnitario ? Money.num(it.valorUnitario) : '') + '" placeholder="Opcional"></td>' +
      '<td class="it-acc"><button type="button" class="btn btn-ghost btn-icon btn-sm" data-ed-quitar aria-label="Quitar">' + Icon('x', '', 13) + '</button></td></tr>';
  },
  unir(cont) {
    const tb = $('[data-ed]', cont);
    if (!$('#dlUnidadesPl')) { const dl = document.createElement('datalist'); dl.id = 'dlUnidadesPl'; dl.innerHTML = UNIDADES.map(u => '<option value="' + u + '">').join(''); document.body.appendChild(dl); }
    const renumerar = () => $$('tr', tb).forEach((tr, i) => { $('.it-n', tr).textContent = i + 1; });
    $$('[data-c="valorUnitario"]', tb).forEach(i => MoneyInput.unir(i));
    $('[data-ed-add]', cont).onclick = () => {
      tb.insertAdjacentHTML('beforeend', this.fila(Modelo.itemVacio(), $$('tr', tb).length));
      const tr = tb.lastElementChild;
      MoneyInput.unir($('[data-c="valorUnitario"]', tr));
      $('[data-c="descripcion"]', tr).focus();
    };
    tb.addEventListener('click', e => {
      if (!e.target.closest('[data-ed-quitar]')) return;
      const tr = e.target.closest('tr');
      if ($$('tr', tb).length > 1) tr.remove(); else $$('input', tr).forEach(i => { i.value = i.dataset.c === 'cantidad' ? '1' : i.dataset.c === 'unidad' ? 'UND' : ''; });
      renumerar();
    });
  },
  leer(cont) {
    return $$('[data-ed] tr', cont).map(tr => ({ id: ID(), descripcion: $('[data-c="descripcion"]', tr).value.trim(), cantidad: Num.parse($('[data-c="cantidad"]', tr).value) || 1,
      unidad: Txt.mayus($('[data-c="unidad"]', tr).value.trim()) || 'UND', valorUnitario: Money.parse($('[data-c="valorUnitario"]', tr).value), observacion: '' })).filter(Modelo.itemValido);
  }
};

          eqs.map(x => '<option value="' + attr(x.id) + '"' + (p.equipoId === x.id ? ' selected' : '') + '>' + esc(x.nombre) + '</option>').join('') + '</select></div></div>' +
          '<div class="field"><label>Artículos<span class="req">*</span></label>' + EditorItems.html(p.items.length ? p.items : [Modelo.itemVacio()]) + '</div>' +
          '<div class="row"><div class="field"><label>Concepto para la orden</label><input class="inp" id="pfConcepto" value="' + attr(p.concepto || '') + '" placeholder="Opcional"></div>' +
          '<div class="field"><label>Notas</label><input class="inp" id="pfNotas" value="' + attr(p.notas || '') + '" placeholder="Opcional: para qué es, cada cuánto se pide…"></div></div>' +

        pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-primary" id="pfOk">' + Icon('save', '', 14) + 'Guardar plantilla</button>',
        alCerrar: () => res(hecho)
      });
      EditorItems.unir(m);
      $('#pfOk', m).onclick = async () => {
        Object.assign(p, { nombre: $('#pfNombre', m).value, tipo: $('#pfTipo', m).value, proveedorId: $('#pfProv', m).value || null, equipoId: $('#pfEq', m).value || null,
          concepto: $('#pfConcepto', m).value.trim(), notas: $('#pfNotas', m).value.trim(), items: EditorItems.leer(m) });

};

        '<div class="field"><label>Datos</label><select class="inp" id="pfDatos"><option value="">Todos</option><option value="completos"' + (f.datos === 'completos' ? ' selected' : '') +
          '>Completos</option><option value="faltan"' + (f.datos === 'faltan' ? ' selected' : '') + '>Por completar</option></select></div>' +
        '<div class="field"><label>Movimiento</label><select class="inp" id="pfMov"><option value="">Todos</option><option value="aqui"' + (f.mov === 'aqui' ? ' selected' : '') +
          '>Con órdenes aquí</option><option value="reciente"' + (f.mov === 'reciente' ? ' selected' : '') + '>Activos en el Excel 2025–2026</option><option value="viejo"' +
          (f.mov === 'viejo' ? ' selected' : '') + '>Sin movimiento desde 2024</option></select></div>' +
        '<button class="btn" id="pfLimpiar">' + Icon('refresh', '', 13) + 'Limpiar</button></div></div></div>' +

    const leer = () => ({ q: $('#pfQ', el).value.trim(), estado: $('#pfEst', el).value, datos: $('#pfDatos', el).value, mov: $('#pfMov', el).value });
    const cambiar = () => { Prefs.set('filProv', leer()); this.pag = 1; this.pintar(el); };

    ['#pfEst', '#pfDatos', '#pfMov'].forEach(s => $(s, el).addEventListener('change', cambiar));
    $('#pfLimpiar', el).onclick = () => { Prefs.set('filProv', {}); Router.resolver(true); };
