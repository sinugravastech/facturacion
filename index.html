/* Identificadores ULID: ordenables por fecha de creación y únicos sin
   coordinar con nadie, que es lo que pedirá la base de datos el día que se suba. */
const ID = (() => {
  const A = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  let ultT = 0, ultR = null;
  const azar = () => {
    const a = new Uint8Array(16);
    (globalThis.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => { a[i] = Math.random() * 256 | 0; });
    return Array.from(a, x => x % 32);
  };
  return function nuevo() {
    let t = Date.now();
    let r;
    if (t === ultT && ultR) {
      r = ultR.slice();
      for (let i = r.length - 1; i >= 0; i--) { if (r[i] < 31) { r[i]++; break; } r[i] = 0; }
    } else r = azar();
    ultT = t; ultR = r;
    let ts = '';
    for (let i = 0; i < 10; i++) { ts = A[t % 32] + ts; t = Math.floor(t / 32); }
    return ts + r.map(x => A[x]).join('');
  };
})();

/* Pesos colombianos, con centavos cuando el precio los trae (las cotizaciones
   suelen venir con decimales): hasta dos, después de la coma. Lo que no tiene
   centavos se ve como siempre, sin «,00». */
const Money = (() => {
  const nf = new Intl.NumberFormat('es-CO', { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const M = {
    /** A dos decimales, sin los errores de la coma flotante (1,005 → 1,01) */
    cent(n) {
      const v = +n || 0;
      if (!isFinite(v) || Math.abs(v) < 1e-6) return 0;
      const r = +(Math.round(Math.abs(v) + 'e2') + 'e-2');
      return Math.sign(v) * (isFinite(r) ? r : Math.round(Math.abs(v) * 100) / 100);
    },
    num(n) { const v = M.cent(n); return (Number.isInteger(v) ? nf : nf2).format(v); },
    fmt(n) { const v = M.cent(n); return (v < 0 ? '−$ ' : '$ ') + M.num(Math.abs(v)); },
    /** Sumas y promedios de muchas órdenes (tablero, estadísticas): en pesos enteros */
    redondo(n) { const v = Math.round(+n || 0); return (v < 0 ? '−$ ' : '$ ') + nf.format(Math.abs(v)); },
    /* «$ 1,2 M» para los ejes de las gráficas */
    corto(n) {
      const v = Math.abs(+n || 0), s = n < 0 ? '−' : '';
      if (v >= 1e9) return s + '$ ' + (v / 1e9).toFixed(1).replace('.', ',').replace(',0', '') + ' mil M';
      if (v >= 1e6) return s + '$ ' + (v / 1e6).toFixed(1).replace('.', ',').replace(',0', '') + ' M';
      if (v >= 1e3) return s + '$ ' + Math.round(v / 1e3) + ' mil';
      return s + '$ ' + Math.round(v);
    },
    /* Lo escrito o pegado: los puntos son de miles y la coma, de los centavos
       («12.605,04»). Un punto con uno o dos dígitos al final también se toma
       como decimal («12605.04», como lo copian algunos sistemas). */
    parse(t) {
      if (typeof t === 'number') return M.cent(t);
      const s = String(t == null ? '' : t).trim();
      if (!s) return 0;
      const neg = /^[−-]/.test(s);
      const limpio = s.replace(/[^\d.,]/g, '');
      const coma = limpio.lastIndexOf(','), punto = limpio.lastIndexOf('.');
      let ent = limpio, dec = '';
      if (coma > punto && (punto >= 0 || limpio.indexOf(',') === coma)) { ent = limpio.slice(0, coma); dec = limpio.slice(coma + 1); }
      else if (punto > coma && /^\d{1,2}$/.test(limpio.slice(punto + 1))) { ent = limpio.slice(0, punto); dec = limpio.slice(punto + 1); }
      const v = M.cent(parseFloat((ent.replace(/\D/g, '') || '0') + '.' + (dec.replace(/\D/g, '') || '0')));
      return neg ? -v : v;
    }
  };
  return M;
})();

/* Cantidades: admiten decimales con coma («2,5» galones). */
const Num = {
  parse(t) {
    if (typeof t === 'number') return isFinite(t) ? t : 0;
    const s = String(t == null ? '' : t).trim().replace(/\s/g, '');
    if (!s) return 0;
    let n;
    if (s.indexOf(',') >= 0) n = parseFloat(s.replace(/\./g, '').replace(',', '.'));
    else n = parseFloat(s);
    return isFinite(n) ? n : 0;
  },
  fmt(n) {
    const v = +n || 0;
    return new Intl.NumberFormat('es-CO', { maximumFractionDigits: 3 }).format(v);
  },
  pct(n) { return new Intl.NumberFormat('es-CO', { maximumFractionDigits: 2 }).format(+n || 0) + ' %'; }
};

const Fecha = (() => {
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const dos = n => String(n).padStart(2, '0');
  const F = {
    MESES, MES_C,
    iso(d) { return d.getFullYear() + '-' + dos(d.getMonth() + 1) + '-' + dos(d.getDate()); },
    hoy() { return F.iso(new Date()); },
    ahora() { return new Date().toISOString(); },
    parse(s) { if (!s) return null; const p = String(s).slice(0, 10).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); },
    valida(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s || ''))) return false; const d = F.parse(s); return !!d && F.iso(d) === s; },
    corta(s) { const d = F.parse(s); return d ? dos(d.getDate()) + '/' + dos(d.getMonth() + 1) + '/' + d.getFullYear() : '—'; },
    larga(s) { const d = F.parse(s); return d ? d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear() : '—'; },
    media(s) { const d = F.parse(s); return d ? d.getDate() + ' ' + MES_C[d.getMonth()] + ' ' + d.getFullYear() : '—'; },
    anio(s) { return s ? +String(s).slice(0, 4) : null; },
    ym(s) { return s ? String(s).slice(0, 7) : ''; },
    mesCorto(ym) { if (!ym) return ''; const [y, m] = ym.split('-').map(Number); return MES_C[m - 1] + ' ' + String(y).slice(2); },
    mesLargo(ym) { if (!ym) return ''; const [y, m] = ym.split('-').map(Number); const t = MESES[m - 1]; return t.charAt(0).toUpperCase() + t.slice(1) + ' de ' + y; },
    /* «26/10/2026 11:45» */
    stamp(ts) { if (!ts) return '—'; const d = new Date(ts); return dos(d.getDate()) + '/' + dos(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + dos(d.getHours()) + ':' + dos(d.getMinutes()); },
    dias(desde, hasta) { const a = F.parse(desde), b = F.parse(hasta || F.hoy()); return a && b ? Math.round((b - a) / 864e5) : 0; },
    sumarDias(s, n) { const d = F.parse(s); d.setDate(d.getDate() + n); return F.iso(d); },
    hace(ts) {
      if (!ts) return 'nunca';
      const min = Math.round((Date.now() - new Date(ts)) / 6e4);
      if (min < 1) return 'hace un momento';
      if (min < 60) return 'hace ' + min + ' min';
      const h = Math.round(min / 60);
      if (h < 24) return 'hace ' + h + ' h';
      const d = Math.round(h / 24);
      return d === 1 ? 'ayer' : 'hace ' + d + ' días';
    },
    /* Meses entre dos «AAAA-MM», ambos incluidos */
    meses(desde, hasta) {
      const out = [];
      let [y, m] = desde.split('-').map(Number);
      const [y2, m2] = hasta.split('-').map(Number);
      while (y < y2 || (y === y2 && m <= m2)) { out.push(y + '-' + dos(m)); m++; if (m > 12) { m = 1; y++; } if (out.length > 600) break; }
      return out;
    }
  };
  return F;
})();

const Txt = {
  /* Para buscar: sin tildes, sin mayúsculas y con los espacios juntos */
  norm(s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); },
  /* Clave para detectar duplicados: además quita puntos y la forma societaria */
  clave(s) {
    return Txt.norm(s).replace(/[.,]/g, '').replace(/\b(s ?a ?s|sas|ltda|s ?a|e ?u)\b/g, '').replace(/[^a-z0-9& ]/g, ' ').replace(/\s+/g, ' ').trim();
  },
  iniciales(s) {
    const p = String(s || '').replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9 ]/g, ' ').split(/\s+/)
      .filter(w => w && !/^(de|del|la|las|los|y|e|s|sas|ltda)$/i.test(w));
    return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase();
  },
  /* Resalta lo buscado sin romper el escape del HTML */
  resaltar(texto, q) {
    const t = String(texto == null ? '' : texto);
    const nq = Txt.norm(q);
    if (!nq) return esc(t);
    const base = t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const i = base.indexOf(nq);
    if (i < 0) return esc(t);
    return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + nq.length)) + '</mark>' + esc(t.slice(i + nq.length));
  },
  plural(n, uno, varios) { return n + ' ' + (n === 1 ? uno : (varios || uno + 's')); },
  mayus(s) { return String(s || '').toLocaleUpperCase('es-CO'); }
};

const U = {
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  descargar(blob, nombre) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  },
  clonar(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); },
  leerArchivo(file, como) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(r.error || new Error('No se pudo leer el archivo'));
      como === 'texto' ? r.readAsText(file, 'utf-8') : r.readAsDataURL(file);
    });
  },
  /* Reduce una imagen (logo o firma) antes de guardarla: una foto del celular
     pesa varios MB y aquí basta con unos pocos KB. */
  reducirImagen(dataUrl, maxLado, tipo) {
    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxLado / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d');
        if (tipo !== 'image/png') { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(tipo || 'image/png', .9));
      };
      img.onerror = () => res(dataUrl);
      img.src = dataUrl;
    });
  },
  sumar(arr, fn) { return arr.reduce((s, x) => s + (fn ? fn(x) : x), 0); },
  agrupar(arr, fn) { const m = new Map(); arr.forEach(x => { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; },
  hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }
};

const Toast = (() => {
  function mostrar(tipo, msg, opts) {
    opts = opts || {};
    const cont = $('#toasts');
    if (!cont) return;
    const t = document.createElement('div');
    t.className = 'toast ' + (tipo || '');
    const ic = { ok: 'checkCircle', err: 'warn', warn: 'warn', info: 'info' }[tipo] || 'info';
    t.innerHTML = Icon(ic, '', 15) + '<div style="flex:1;min-width:0">' + msg + '</div>' +
      (opts.accion ? '<button class="t-acc">' + esc(opts.accion) + '</button>' : '') +
      '<button class="t-x" aria-label="Cerrar">' + Icon('x', '', 14) + '</button>';
    const quitar = () => { t.style.opacity = '0'; t.style.transition = 'opacity .2s'; setTimeout(() => t.remove(), 200); };
    $('.t-x', t).onclick = quitar;
    if (opts.accion) $('.t-acc', t).onclick = () => { quitar(); opts.alAccionar && opts.alAccionar(); };
    cont.appendChild(t);
    setTimeout(quitar, opts.ms || (tipo === 'err' ? 7000 : opts.accion ? 9000 : 3800));
  }
  return {
    ok: (m, o) => mostrar('ok', m, o), err: (m, o) => mostrar('err', m, o),
    warn: (m, o) => mostrar('warn', m, o), info: (m, o) => mostrar('info', m, o)
  };
})();

const Modal = (() => {
  const pila = [];
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !pila.length) return;
    const m = pila[pila.length - 1];
    if (m._fijo) return;
    e.preventDefault();
    cerrar(m);
  });
  function abrir(o) {
    const bd = document.createElement('div');
    bd.className = 'modal-bd';
    bd.innerHTML = '<div class="modal ' + (o.ancho || '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><div class="f1"><h3>' + o.titulo + '</h3>' +
      (o.subtitulo ? '<div class="mh-sub">' + o.subtitulo + '</div>' : '') + '</div>' +
      '<button class="btn btn-ghost btn-icon btn-sm" data-cerrar aria-label="Cerrar">' + Icon('x', '', 15) + '</button></div>' +
      '<div class="modal-b">' + (o.cuerpo || '') + '</div>' +
      (o.pie ? '<div class="modal-f">' + o.pie + '</div>' : '') + '</div>';
    bd._fijo = !!o.fijo;
    bd._alCerrar = o.alCerrar;
    bd.addEventListener('mousedown', e => { bd._abajo = e.target === bd; });
    bd.addEventListener('click', e => {
      if (e.target === bd && bd._abajo && !bd._fijo) cerrar(bd);
      const c = e.target.closest('[data-cerrar]');
      if (c && bd.contains(c)) cerrar(bd);
      const ir = e.target.closest('[data-ir]');
      if (ir && bd.contains(ir)) { cerrar(bd); Router.ir(ir.dataset.ir); }
    });
    $('#modals').appendChild(bd);
    pila.push(bd);
    setTimeout(() => {
      const f = bd.querySelector('[autofocus]') || bd.querySelector('.modal-b input:not([type=hidden]):not([readonly]),.modal-b select,.modal-b textarea');
      if (f) f.focus();
    }, 30);
    return bd;
  }
  function cerrar(bd, valor) {
    const i = pila.indexOf(bd);
    if (i >= 0) pila.splice(i, 1);
    if (!bd || !bd.parentNode) return;
    Combo.cerrarTodos();
    bd.remove();
    if (bd._alCerrar) bd._alCerrar(valor);
    /* Lo que llegó de la nube mientras la ventana estaba abierta se pinta al cerrarla */
    if (!pila.length && typeof Sincro !== 'undefined' && Sincro.pendiente) setTimeout(() => Sincro.repintar(), 60);
  }
  function cerrarTodos() { pila.slice().forEach(m => cerrar(m)); }
  /** Pregunta antes de algo delicado. Devuelve true si la persona confirma. */
  function confirmar(o) {
    return new Promise(res => {
      let ok = false;
      const m = abrir({
        titulo: o.titulo || '¿Está seguro?', ancho: 'narrow',
        cuerpo: '<div class="fs13 txt-2" style="line-height:1.55">' + (o.mensaje || '') + '</div>' +
          (o.escribir ? '<div class="field mt12 mb0"><label>Para confirmar escriba <b>' + esc(o.escribir) + '</b></label>' +
            '<input class="inp" id="cfEscribir" autocomplete="off" autofocus></div>' : ''),
        pie: '<button class="btn" data-cerrar>' + esc(o.cancelar || 'Cancelar') + '</button>' +
          '<button class="btn ' + (o.peligro ? 'btn-danger' : 'btn-primary') + '" id="cfOk"' + (o.escribir ? ' disabled' : '') + '>' +
          esc(o.ok || 'Aceptar') + '</button>',
        alCerrar: () => res(ok)
      });
      const b = $('#cfOk', m);
      if (o.escribir) {
        const inp = $('#cfEscribir', m);
        inp.addEventListener('input', () => { b.disabled = inp.value.trim().toUpperCase() !== o.escribir.toUpperCase(); });
        inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !b.disabled) b.click(); });
      }
      b.onclick = () => { ok = true; cerrar(m); };
      if (!o.escribir) setTimeout(() => b.focus(), 40);
    });
  }
  function alerta(titulo, html, tipo) {
    return new Promise(res => {
      abrir({
        titulo, ancho: 'narrow',
        cuerpo: '<div class="alert a-' + (tipo || 'info') + '">' + Icon(tipo === 'err' ? 'warn' : tipo === 'ok' ? 'checkCircle' : 'info') +
          '<div>' + html + '</div></div>',
        pie: '<button class="btn btn-primary" data-cerrar autofocus>Entendido</button>',
        alCerrar: () => res()
      });
    });
  }
  /** Pide un texto corto (un motivo, un nombre). Devuelve null si se cancela. */
  function pedir(o) {
    return new Promise(res => {
      let valor = null;
      const m = abrir({
        titulo: o.titulo, ancho: 'narrow',
        cuerpo: (o.mensaje ? '<p class="fs13 txt-2 mb12">' + o.mensaje + '</p>' : '') +
          '<div class="field mb0"><label>' + esc(o.etiqueta || '') + (o.obligatorio ? '<span class="req">*</span>' : '') + '</label>' +
          (o.largo ? '<textarea class="inp" id="pdV" rows="3" autofocus placeholder="' + attr(o.placeholder || '') + '">' + esc(o.valor || '') + '</textarea>'
            : '<input class="inp" id="pdV" autofocus autocomplete="off" placeholder="' + attr(o.placeholder || '') + '" value="' + attr(o.valor || '') + '">') +
          '<div class="err hidden" id="pdE">Este dato es obligatorio.</div></div>',
        pie: '<button class="btn" data-cerrar>Cancelar</button><button class="btn ' + (o.peligro ? 'btn-danger' : 'btn-primary') + '" id="pdOk">' + esc(o.ok || 'Aceptar') + '</button>',
        alCerrar: () => res(valor)
      });
      const inp = $('#pdV', m);
      const ok = () => {
        const v = inp.value.trim();
        if (o.obligatorio && !v) { $('#pdE', m).classList.remove('hidden'); inp.classList.add('is-err'); inp.focus(); return; }
        valor = v; cerrar(m);
      };
      $('#pdOk', m).onclick = ok;
      if (!o.largo) inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
    });
  }
  return { abrir, cerrar, cerrarTodos, confirmar, alerta, pedir, abiertos: () => pila.length };
})();

/* Burbujas de ayuda: cualquier elemento con data-tip la muestra al pasar el
   ratón o al recibir el foco. Una sola burbuja para toda la página. */
const Tip = {
  el: null, actual: null,
  iniciar() {
    this.el = document.createElement('div');
    this.el.className = 'tip';
    document.body.appendChild(this.el);
    const mostrar = e => {
      const t = e.target.closest && e.target.closest('[data-tip]');
      if (!t || t === this.actual) return;
      this.actual = t;
      this.el.innerHTML = t.getAttribute('data-tip-html') === '1' ? t.dataset.tip : esc(t.dataset.tip);
      const r = t.getBoundingClientRect();
      this.el.classList.add('on');
      const w = this.el.offsetWidth, h = this.el.offsetHeight;
      let x = r.left + r.width / 2 - w / 2, y = r.top - h - 8;
      if (y < 6) y = r.bottom + 8;
      x = Math.max(6, Math.min(x, innerWidth - w - 6));
      this.el.style.left = x + 'px'; this.el.style.top = y + 'px';
    };
    const ocultar = e => {
      if (!this.actual) return;
      const t = e.relatedTarget;
      if (t && this.actual.contains(t)) return;
      this.actual = null;
      this.el.classList.remove('on');
    };
    document.addEventListener('mouseover', mostrar);
    document.addEventListener('mouseout', ocultar);
    document.addEventListener('focusin', mostrar);
    document.addEventListener('focusout', ocultar);
    addEventListener('scroll', () => { this.actual = null; this.el.classList.remove('on'); }, true);
  }
};

/* Menú de «más acciones» que sale de un botón ⋯ */
const Menu = {
  el: null,
  abrir(boton, opciones) {
    this.cerrar();
    const m = document.createElement('div');
    m.className = 'menu-pop';
    m.innerHTML = opciones.map((o, i) => o === '-' ? '<hr>' :
      '<button data-i="' + i + '"' + (o.peligro ? ' class="peligro"' : '') + '>' + Icon(o.icono || 'chevR', '', 14) + esc(o.texto) + '</button>').join('');
    document.body.appendChild(m);
    const r = boton.getBoundingClientRect();
    const w = m.offsetWidth, h = m.offsetHeight;
    let x = r.right - w, y = r.bottom + 4;
    if (y + h > innerHeight - 8) y = r.top - h - 4;
    m.style.left = Math.max(8, x) + 'px'; m.style.top = Math.max(8, y) + 'px';
    m.addEventListener('click', e => {
      const b = e.target.closest('button[data-i]');
      if (!b) return;
      const o = opciones[+b.dataset.i];
      this.cerrar();
      o.accion && o.accion();
    });
    this.el = m;
    setTimeout(() => {
      this._fuera = e => { if (!m.contains(e.target)) this.cerrar(); };
      document.addEventListener('mousedown', this._fuera);
    }, 0);
  },
  cerrar() {
    if (this.el) { this.el.remove(); this.el = null; }
    if (this._fuera) { document.removeEventListener('mousedown', this._fuera); this._fuera = null; }
  }
};

/* La lista para cambiar de empresa desde la barra lateral: cada una con su
   color, su nombre completo y la marca de la que está activa. Se maneja con el
   mouse o con las flechas, Enter y Esc */
const ListaEmpresas = {
  el: null, boton: null,
  abrir(boton) {
    if (this.el) { const era = this.boton; this.cerrar(); if (era === boton) return; }
    const m = document.createElement('div');
    m.className = 'emp-pop';
    m.setAttribute('role', 'listbox');
    m.setAttribute('aria-label', 'Empresa con la que trabaja');
    m.innerHTML = Empresa.lista().map(id => '<button type="button" role="option" data-emp="' + attr(id) + '" aria-selected="' + (id === Empresa.activa) + '" style="--c:' + attr(Empresa.info(id).color) + '">' +
      '<i></i><span><b>' + esc(Empresa.info(id).corto) + '</b><small>' + esc(Empresa.nombre(id)) + '</small></span>' + (id === Empresa.activa ? Icon('check', '', 14) : '') + '</button>').join('');
    document.body.appendChild(m);
    /* Debajo del botón; en la barra angosta, a su derecha */
    const r = boton.getBoundingClientRect(), angosta = boton.id === 'sbEmpMini';
    m.style.minWidth = Math.max(angosta ? 230 : r.width, 200) + 'px';
    let x = angosta ? r.right + 8 : r.left, y = angosta ? r.top : r.bottom + 4;
    if (y + m.offsetHeight > innerHeight - 8) y = Math.max(8, r.top - m.offsetHeight - 4);
    m.style.left = Math.max(8, Math.min(x, innerWidth - m.offsetWidth - 8)) + 'px';
    m.style.top = y + 'px';
    boton.setAttribute('aria-expanded', 'true');
    this.el = m; this.boton = boton;
    const ops = () => $$('[data-emp]', m);
    (ops().find(b => b.getAttribute('aria-selected') === 'true') || ops()[0]).focus();
    m.addEventListener('click', e => { const b = e.target.closest('[data-emp]'); if (b) this.elegir(b.dataset.emp); });
    m.addEventListener('keydown', e => {
      const o = ops(), i = o.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); o[(i + (e.key === 'ArrowDown' ? 1 : o.length - 1)) % o.length].focus(); }
      else if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); o[e.key === 'Home' ? 0 : o.length - 1].focus(); }
      else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); this.cerrar(true); }
    });
    setTimeout(() => {
      if (this.el !== m) return;
      this._fuera = e => { if (!m.contains(e.target) && !boton.contains(e.target)) this.cerrar(); };
      this._quieta = () => this.cerrar();
      document.addEventListener('mousedown', this._fuera);
      addEventListener('resize', this._quieta);
    }, 0);
  },
  elegir(id) {
    this.cerrar(true);
    if (id !== Empresa.activa) Empresa.cambiar(id);
  },
  /** foco: devolverlo al botón, si todavía está */
  cerrar(foco) {
    if (!this.el) return;
    this.el.remove(); this.el = null;
    if (this._fuera) { document.removeEventListener('mousedown', this._fuera); this._fuera = null; }
    if (this._quieta) { removeEventListener('resize', this._quieta); this._quieta = null; }
    const b = this.boton;
    this.boton = null;
    if (b) { b.setAttribute('aria-expanded', 'false'); if (foco && b.isConnected) b.focus(); }
  }
};

/* ==========================================================================
   §4  ALMACENAMIENTO
   --------------------------------------------------------------------------
   Contrato que TODO adaptador cumple. Los datos y las vistas hablan sólo con
   esta interfaz: la nube (Supabase, §4b) es un adaptador más; la memoria es
   el de las pruebas del sistema, y el del navegador (IndexedDB) quedó sólo
   para leer lo que guardó la versión local.
   ========================================================================== */
const COLECCIONES = ['configuracion', 'proveedores', 'equipos', 'ordenes', 'plantillas', 'auditoria', 'adjuntos'];

class StorageAdapter {
  async init() { throw new Error('no implementado'); }
  /** opts.marcar: es la carga de la memoria (la nube anota desde dónde revisar cambios) */
  async getAll(coleccion, opts) { throw new Error('no implementado'); }
  /** Un solo documento; null si no está */
  async get(coleccion, id) { throw new Error('no implementado'); }
  async put(coleccion, doc) { throw new Error('no implementado'); }
  async putMany(coleccion, docs) { throw new Error('no implementado'); }
  async remove(coleccion, id) { throw new Error('no implementado'); }
  async clear(coleccion) { throw new Error('no implementado'); }
  /** Varias escrituras en distintas colecciones: o se hacen todas o ninguna.
      ops: [{ col, tipo: 'put' | 'del', doc | id }] */
  async lote(ops) { throw new Error('no implementado'); }
  async estimar() { return null; }
  get persistente() { return false; }
  /** ¿Es la nube? Allí se revisa cada poco lo que otros guardan */
  get nube() { return false; }
  /** La marca con que la base tiene guardado un documento (sólo en la nube) */
  version(coleccion, id) { return null; }
  /** Las hojas del Excel viejo (sólo en la nube; las pruebas ponen las suyas) */
  async historico() { return []; }
  /** Los n más recientes por su fecha «en» (la actividad), sin traer todo */
  async recientes(coleccion, n) { return (await this.getAll(coleccion)).sort((a, b) => String(b.en).localeCompare(String(a.en))).slice(0, n); }
}

/* IndexedDB: cientos de MB de cupo (frente a 5 MB de localStorage) y
   transacciones de verdad, que es lo que se necesita para que el consecutivo y
   la orden se guarden juntos o no se guarden. */
class IndexedDBAdapter extends StorageAdapter {
  constructor(nombre, version) {
    super();
    this.nombre = nombre || APP.dbName;
    this.version = version || APP.dbVersion;
    this.db = null;
  }
  get persistente() { return true; }
  init() {
    if (this.db) return Promise.resolve(this);
    return new Promise((res, rej) => {
      if (!globalThis.indexedDB) {
        rej(new ErrorDominio('Este navegador no permite guardar datos. Use Chrome o Edge actualizados.', 'SIN_IDB'));
        return;
      }
      let req;
      try { req = indexedDB.open(this.nombre, this.version); } catch (e) { rej(e); return; }
      req.onupgradeneeded = () => {
        const base = req.result;
        COLECCIONES.forEach(c => { if (!base.objectStoreNames.contains(c)) base.createObjectStore(c, { keyPath: 'id' }); });
      };
      req.onsuccess = () => {
        this.db = req.result;
        this.db.onversionchange = () => { this.db.close(); this.db = null; };
        res(this);
      };
      req.onerror = () => rej(req.error || new Error('No se pudo abrir la base del navegador'));
      req.onblocked = () => rej(new ErrorDominio('Cierre las otras pestañas de Facturación y recargue esta.', 'BLOQUEADA'));
    });
  }
  _tx(cols, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(cols, 'readwrite');
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('No se guardó: la operación se canceló.'));
      try { fn(tx); } catch (e) { try { tx.abort(); } catch (x) { /* ya cerrada */ } rej(e); }
    });
  }
  getAll(col) {
    return new Promise((res, rej) => {
      const r = this.db.transaction(col).objectStore(col).getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  }
  get(col, id) {
    return new Promise((res, rej) => {
      const r = this.db.transaction(col).objectStore(col).get(id);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => rej(r.error);
    });
  }
  put(col, doc) { return this._tx([col], tx => tx.objectStore(col).put(doc)); }
  putMany(col, docs) { return this._tx([col], tx => { const s = tx.objectStore(col); docs.forEach(d => s.put(d)); }); }
  remove(col, id) { return this._tx([col], tx => tx.objectStore(col).delete(id)); }
  clear(col) { return this._tx([col], tx => tx.objectStore(col).clear()); }
  lote(ops) {
    const cols = [...new Set(ops.map(o => o.col))];
    if (!cols.length) return Promise.resolve();
    return this._tx(cols, tx => ops.forEach(o => {
      const s = tx.objectStore(o.col);
      if (o.tipo === 'del') s.delete(o.id); else s.put(o.doc);
    }));
  }
  async estimar() {
    try { return navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch (e) { return null; }
  }
}

/* En memoria: para las pruebas del sistema. Se porta como la base de la nube
   en lo que importa: o se guarda todo el lote o nada, y nunca deja dos órdenes
   con el mismo número. */
class MemoryAdapter extends StorageAdapter {
  constructor() { super(); this.m = {}; COLECCIONES.forEach(c => { this.m[c] = new Map(); }); }
  async init() { return this; }
  async getAll(c) { return [...this.m[c].values()].map(U.clonar); }
  async get(c, id) { return U.clonar(this.m[c].get(id)) || null; }
  async put(c, d) { this.m[c].set(d.id, U.clonar(d)); }
  async putMany(c, ds) { ds.forEach(d => this.m[c].set(d.id, U.clonar(d))); }
  async remove(c, id) { this.m[c].delete(id); }
  async clear(c) { this.m[c].clear(); }
  async lote(ops) {
    const clave = o => o.secuencia == null ? null : Empresa.de(o) + ':' + o.secuencia;
    const quedan = new Map([...this.m.ordenes.values()].map(o => [o.id, clave(o)]));
    ops.forEach(o => { if (o.col === 'ordenes') { if (o.tipo === 'del') quedan.delete(o.id); else quedan.set(o.doc.id, clave(o.doc)); } });
    const secs = [...quedan.values()].filter(s => s != null);
    if (new Set(secs).size !== secs.length) throw new ErrorDominio('Ese número de orden ya lo tomó otra orden.', 'NUMERO_TOMADO');
    ops.forEach(o => { if (o.tipo === 'del') this.m[o.col].delete(o.id); else this.m[o.col].set(o.doc.id, U.clonar(o.doc)); });
  }
}

/* ==========================================================================
   §4b  LA NUBE — Supabase: la sesión, las tablas del esquema «facturacion» y
        su depósito de archivos. Se habla directo con su API (fetch), sin
        librerías, para que la plataforma siga siendo un solo archivo.
   ========================================================================== */
/* Un error que dice si fue la red, la sesión o el servidor */
const errorNube = (msg, o) => Object.assign(new ErrorDominio(msg, 'NUBE'), o || {});
const esperar = ms => new Promise(ok => setTimeout(ok, ms));

const Nube = {
  /* Sin pase, la sesión queda en este navegador (localStorage), como siempre.
     Si la pestaña vino del Panel de control, sólo en ella (sessionStorage, con
     el id de la pestaña): recargar sigue adentro y al cerrarla se acaba. */
  CLAVE: APP.prefs + 'sesion' + (DESDE_PANEL ? '.' + PESTANA : ''),
  _memoria: null,

  /* ---------------- La sesión ---------------- */
  _almacen() { return DESDE_PANEL ? sessionStorage : localStorage; },
  sesion() {
    try { return JSON.parse(this._almacen().getItem(this.CLAVE) || 'null') || this._memoria; } catch (e) { return this._memoria; }
  },
  guardarSesion(s) {
    try {
      if (s) this._almacen().setItem(this.CLAVE, JSON.stringify(s));
      else this._almacen().removeItem(this.CLAVE);
    } catch (e) { /* sin almacenamiento: la sesión dura lo que la pestaña */ }
    this._memoria = s || null;
  },
  _sesionDe(j, correo) {
    return { access_token: j.access_token, refresh_token: j.refresh_token,
      expira: Date.now() + (j.expires_in || 3600) * 1000, correo: (j.user && j.user.email) || correo || '' };
  },
  correo() { const s = this.sesion(); return s ? s.correo : ''; },
  async entrar(correo, clave) {
    let r;
    try {
      r = await this._fetch(NUBE.url + '/auth/v1/token?grant_type=password', {
        method: 'POST', headers: { apikey: NUBE.llave, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: correo, password: clave })
      }, 20000);
    } catch (e) { throw errorNube('No hay conexión con el servidor. Revise el internet e intente otra vez.', { red: true }); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      throw errorNube(r.status === 400 || r.status === 401 ? 'El correo o la contraseña no coinciden. Revíselos e intente otra vez.'
        : 'El servidor no dejó entrar: ' + (j.error_description || j.msg || j.message || 'error ' + r.status) + '.');
    }
    this.guardarSesion(this._sesionDe(j, correo));
  },
  /* Cambia el pase del Panel de control por una sesión de esta pestaña.
     'ok', 'vencido' (ya se usó, venció o la cuenta está suspendida) o 'red' */
  async canjearPase(pase) {
    let r;
    try {
      r = await this._fetch(NUBE.url + '/auth/v1/verify', {
        method: 'POST', headers: { apikey: NUBE.llave, 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'email', token_hash: pase })
      }, 20000);
    } catch (e) { return 'red'; }
    const j = r.ok ? await r.json().catch(() => null) : null;
    if (!j || !j.access_token) return 'vencido';
    this.guardarSesion(this._sesionDe(j));
    return 'ok';
  },
  /* Renueva la sesión con su refresh_token. Sin red, sigue la que había; si el
     servidor la rechaza, se cierra (null) */
  async refrescar() {
    const s = this.sesion();
    if (!s || !s.refresh_token) return null;
    let r;
    try {
      r = await this._fetch(NUBE.url + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', headers: { apikey: NUBE.llave, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token })
      }, 20000);
    } catch (e) { return s; }
    if (!r.ok) { this.guardarSesion(null); return null; }
    const nueva = this._sesionDe(await r.json(), s.correo);
    nueva.refresh_token = nueva.refresh_token || s.refresh_token;
    this.guardarSesion(nueva);
    return nueva;
  },
  /* Un token vigente, renovado si está por vencer. Dos pedidos a la vez no lo
     renuevan dos veces: cada refresh_token de Supabase sirve una sola vez. */
  async token() {
    let s = this.sesion();
    if (!s) return null;
    if (Date.now() > s.expira - 60000) {
      this._renovando = this._renovando || this.refrescar().finally(() => { this._renovando = null; });
      s = await this._renovando;
    }
    return s ? s.access_token : null;
  },
  async salir() {
    const s = this.sesion();
    if (s) {
      /* Sólo esta sesión: sin «scope=local», Supabase cerraría todas las de la
         cuenta, en todos los equipos y en las otras plataformas */
      try {
        await this._fetch(NUBE.url + '/auth/v1/logout?scope=local', { method: 'POST', headers: { apikey: NUBE.llave, Authorization: 'Bearer ' + s.access_token } }, 8000);
      } catch (e) { /* sin red: igual se olvida aquí */ }
    }
    this.guardarSesion(null);
  },
  /* ¿Responde el servidor? Los milisegundos, o null si no contestó */
  async latido() {
    const t0 = performance.now();
    try {
      await this._fetch(NUBE.url + '/auth/v1/health', { headers: { apikey: NUBE.llave } }, 10000);
      return Math.round(performance.now() - t0);
    } catch (e) { return null; }
  },
  /* fetch con tiempo máximo: si el servidor no contesta a tiempo, se corta y
     se trata como falta de conexión */
  async _fetch(url, opciones, ms) {
    const corte = new AbortController(), reloj = setTimeout(() => corte.abort(), ms);
    try {
      return await fetch(url, Object.assign({}, opciones, { signal: corte.signal }));
    } catch (e) {
      throw errorNube(corte.signal.aborted ? 'El servidor tardó demasiado en responder.' : 'Sin conexión con el servidor.', { red: true });
    } finally { clearTimeout(reloj); }
  },

  /* ---------------- Las tablas y las funciones ---------------- */
  /* Un pedido a la API. Lo que sólo lee se reintenta si la red falla; guardar
     no, para no guardar dos veces: el error se muestra y se intenta de nuevo.
     Si la sesión venció, se renueva o se vuelve a pedir la contraseña sin
     perder lo que está en pantalla, y se sigue. */
  async pedir(ruta, o) {
    o = o || {};
    const repetible = !o.method || o.method === 'GET' || o.leer;
    for (let intento = 1; ; intento++) {
      try { return await this._pedir(ruta, o); }
      catch (e) {
        if (e.sesion && intento <= 3) {
          if (intento > 1 || !(await this.refrescar())) await Sesion.recuperar();
          continue;
        }
        if (!e.red || !repetible || intento >= 3) throw e;
        await esperar(700 * intento);
      }
    }
  },
  async _pedir(ruta, o) {
    const tk = await this.token();
    if (!tk) throw errorNube('La sesión se cerró.', { sesion: true });
    const r = await this._fetch(NUBE.url + '/rest/v1/' + ruta, {
      method: o.method || 'GET',
      headers: Object.assign({ apikey: NUBE.llave, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' },
        o.publico ? {} : { 'Accept-Profile': NUBE.esquema, 'Content-Profile': NUBE.esquema }),
      body: o.body
    }, (o.method || 'GET') === 'GET' ? 20000 : 60000);
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw errorNube(j.message || j.msg || 'Error ' + r.status, { status: r.status, sql: j.code || '', detalle: j.details || j.hint || '', sesion: r.status === 401 });
    }
    if (r.status === 204) return null;
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  },
  rpc(nombre, args, o) { return this.pedir('rpc/' + nombre, Object.assign({ method: 'POST', body: JSON.stringify(args || {}) }, o)); },
  /* Quién entró y qué puede hacer en Facturación: lo decide el panel común
     (función de public, por eso sin el esquema de facturación) */
  miAcceso() { return this.rpc('panel_mi_acceso', { p_modulo: NUBE.modulo }, { publico: true, leer: true }); },

  /* ---------------- El depósito de archivos ---------------- */
  _url(ruta) { return NUBE.url + '/storage/v1/object/' + NUBE.deposito + '/' + String(ruta).split('/').map(encodeURIComponent).join('/'); },
  async _archivo(metodo, ruta, blob) {
    let renovado = false;
    for (let intento = 1; ; intento++) {
      const tk = await this.token();
      if (!tk) throw errorNube('La sesión se cerró.', { sesion: true });
      let r;
      try {
        /* Un archivo grande tarda en subir: se le dan hasta dos minutos */
        r = await this._fetch(this._url(ruta), { method: metodo, body: blob,
          headers: Object.assign({ apikey: NUBE.llave, Authorization: 'Bearer ' + tk },
            blob ? { 'Content-Type': blob.type || 'application/octet-stream', 'x-upsert': 'true' } : {}) }, metodo === 'POST' ? 120000 : 60000);
      } catch (e) {
        if (intento < 3) { await esperar(700 * intento); continue; }
        throw e;
      }
      if (r.ok) return r;
      const j = await r.clone().json().catch(() => ({}));
      if (!renovado && /jwt|token/i.test(j.message || '')) {
        renovado = true;
        if (!(await this.refrescar())) await Sesion.recuperar();
        continue;
      }
      return r;
    }
  },
  async subir(ruta, blob) {
    const r = await this._archivo('POST', ruta, blob);
    if (r.ok) return;
    const j = await r.json().catch(() => ({}));
    const c = String(j.statusCode || r.status);
    throw errorNube(c === '403' ? 'No tiene permiso para subir archivos. Pídaselo al administrador.'
      : c === '413' ? 'El archivo pesa más de lo que deja el depósito (8 MB).'
      : c === '415' ? 'Ese tipo de archivo no se puede adjuntar: sólo PDF o fotos.'
      : 'No se pudo subir el archivo: ' + (j.message || 'error ' + r.status) + '.', { status: r.status, archivo: true });
  },
  /** El archivo, o null si no está o no se pudo traer */
  async bajar(ruta) {
    try { const r = await this._archivo('GET', ruta); return r.ok ? await r.blob() : null; } catch (e) { return null; }
  },
  async quitarArchivo(ruta) {
    try { const r = await this._archivo('DELETE', ruta); return r.ok; } catch (e) { return false; }
  }
};

/* Cómo va cada colección a su tabla y de vuelta. Lo que tiene columna va en
   su columna, con el nombre en minúsculas y guiones bajos (ivaPct → iva_pct);
   lo demás va tal cual en «extra», para no perder nada, y al leer se arma el
   mismo documento de antes. «nulas»: las columnas que aceptan vacío; en las
   demás un null no se manda y queda lo que había. «fechas»: las de fecha y
   hora, que se leen en el formato de la plataforma. */
const MAPA = (() => {
  const def = {
    configuracion: ['empresa logo consecutivo iva_pct documento solicitantes autoriza ultimo_respaldo semillas', 'ultimo_respaldo', 'ultimo_respaldo'],
    proveedores: ['nombre nombre_norm nit tipo_persona categoria contacto cargo_contacto telefono celular correo direccion ciudad forma_pago plazo_dias ' +
      'medio_pago notas alias activo origen historico clave_excel fusionado_con fusionado_en', 'historico clave_excel fusionado_con fusionado_en', 'fusionado_en'],
    equipos: ['nombre tipo placa clase detalle alias notas activo origen empresa', '', ''],
    plantillas: ['nombre tipo proveedor_id equipo_id concepto items notas usos ultimo_uso empresa', 'proveedor_id equipo_id ultimo_uso', 'ultimo_uso'],
    ordenes: ['numero secuencia tipo fecha proveedor_id proveedor equipo_id concepto referencia items iva_pct retencion_pct subtotal iva retencion total ' +
      'forma_pago plazo_dias cuotas medio_pago entrega_lugar entrega_recibe entrega_cedula nota_proveedor notas_internas solicitante estado historial ' +
      'factura pago anulacion plantilla_id adjuntos empresa', 'proveedor equipo_id solicitante factura pago anulacion plantilla_id', ''],
    adjuntos: ['orden_id nombre tipo tamano ruta en', '', 'en'],
    auditoria: ['en accion entidad entidad_id detalle', '', 'en']
  };
  const conjunto = s => new Set(s.split(' ').filter(Boolean));
  const M = {};
  Object.keys(def).forEach(c => { M[c] = { cols: conjunto(def[c][0]), nulas: conjunto(def[c][1]), fechas: conjunto(def[c][2]) }; });
  const aColumna = k => k.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
  const aCampo = s => s.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
  const iso = v => { const d = new Date(v); return isNaN(d) ? v : d.toISOString(); };
  return {
    /** El documento de la plataforma → la fila de su tabla. conAutor: al subir
        un respaldo, cada fila conserva quién la creó (la base sólo se lo
        acepta al administrador) */
    fila(col, doc, conAutor) {
      const m = M[col], f = { id: doc.id }, extra = {};
      Object.keys(doc).forEach(k => {
        const v = doc[k];
        if (k === 'id' || v === undefined) return;
        if (k === 'creadoEn') { if (v) f.creado = v; return; }
        if (k === 'creadoPor') { if (conAutor && v) f.creado_por = v; return; }
        /* Quién y cuándo cambió la fila lo pone la base; el archivo va al depósito */
        if (k === 'actualizadoEn' || k === 'actualizadoPor' || (col === 'adjuntos' && k === 'datos')) return;
        const s = aColumna(k);
        if (m.cols.has(s)) { if (v !== null || m.nulas.has(s)) f[s] = v; }
        else extra[k] = v;
      });
      f.extra = extra;
      return f;
    },
    /** La fila de la tabla → el documento de la plataforma */
    doc(col, f) {
      const m = M[col], d = {};
      Object.keys(f).forEach(s => {

        if (s === 'extra') return;

        else if (s === 'actualizado') d.actualizadoEn = iso(v);
        else d[aCampo(s)] = m.fechas.has(s) && v ? iso(v) : v;
      });
      const x = f.extra || {};
      Object.keys(x).forEach(k => { if (!(k in d)) d[k] = x[k]; });

/* Lo que la plataforma tiene en memoria (y revisa cada poco en la nube) */
const EN_MEMORIA = ['configuracion', 'proveedores', 'equipos', 'plantillas', 'ordenes'];

/* La nube como almacén, con el mismo contrato que los demás. Guardar va
   siempre por la función aplicar_lote: todo junto o nada. Cada fila trae su
   marca «actualizado»: al cambiarla se manda la que se vio, y si otra persona
   la cambió o la borró entre tanto, la base no la pisa (CAMBIADO) y se traen
   los cambios. Los archivos adjuntos van al depósito, en orden/<orden>/<id>. */
class NubeAdapter extends StorageAdapter {
  constructor() {
    super();
    this.ver = {};      // colección → (id → marca «actualizado» que se vio)
    this.marca = {};    // colección → la última marca de la tabla ya revisada
    COLECCIONES.forEach(c => { this.ver[c] = new Map(); });
    this.desde = null;        // desde qué hora de la nube se pregunta qué cambió
    this.sinCambios = false;  // la nube todavía no tiene el SQL 203: se revisa como antes
    this._probado = 0;        // cuándo se miró por última vez si ya tiene el 203
    this._ultima = 0;         // cuándo respondió la última pregunta
    this._escribiendo = 0;    // lotes en camino a la nube
    this._escritos = 0;       // lotes que la nube ya guardó
  }
  get persistente() { return true; }
  get nube() { return true; }
  async init() { return this; }
  version(col, id) { return this.ver[col].get(id) || null; }
  /* Una tabla, de a mil filas (Supabase entrega máximo mil por pedido) */
  async _leer(col, filtro, campos) {
    const todas = [];
    for (let desde = 0; ; desde += 1000) {
      const lote = await Nube.pedir(col + '?select=' + (campos || '*') + '&order=id&limit=1000&offset=' + desde + (filtro ? '&' + filtro : ''));
      todas.push.apply(todas, lote || []);
      if (!lote || lote.length < 1000) return todas;
    }
  }
  async _porIds(col, ids, campos) {
    const out = [];
    for (let i = 0; i < ids.length; i += 80) {
      const lista = ids.slice(i, i + 80).map(id => '"' + String(id).replace(/["\\]/g, '\\$&') + '"').join(',');
      out.push.apply(out, await this._leer(col, 'id=in.(' + encodeURIComponent(lista) + ')', campos));
    }
    return out;
  }
  async getAll(col, opts) {
    const filas = await this._leer(col);
    if (opts && opts.marcar) {
      const ver = this.ver[col];
      ver.clear();
      let max = null;
      filas.forEach(f => { ver.set(f.id, f.actualizado); if (!max || f.actualizado > max) max = f.actualizado; });
      this.marca[col] = max;
    }
    return filas.map(f => MAPA.doc(col, f));
  }
  async historico() { return (await this._leer('historico', '', 'hoja')).map(f => f.hoja); }
  async recientes(col, n) {
    const filas = await Nube.pedir(col + '?select=*&order=en.desc&limit=' + n);
    return (filas || []).map(f => MAPA.doc(col, f));
  }
  async get(col, id) {
    const f = (await this._porIds(col, [id]))[0];
    if (!f) return null;
    const d = MAPA.doc(col, f);
    /* Un adjunto llega con su archivo, como en la versión local */
    if (col === 'adjuntos') { const b = await Nube.bajar(d.ruta); if (b) d.datos = await U.leerArchivo(b); }
    return d;
  }
  put(col, doc) { return this.lote([{ col, tipo: 'put', doc }]); }
  putMany(col, docs) { return this.lote(docs.map(doc => ({ col, tipo: 'put', doc }))); }
  remove(col, id) { return this.lote([{ col, tipo: 'del', id }]); }
  async clear(col) {
    const ids = (await this._leer(col, '', 'id')).map(f => f.id);
    if (ids.length) await this.lote(ids.map(id => ({ col, tipo: 'del', id })));
  }
  /** Dónde queda el archivo de un adjunto en el depósito */
  static ruta(a) { return a.ruta || 'orden/' + (a.ordenId || 'sin-orden') + '/' + a.id; }
  /* opts.avance(n, total): va contando los archivos que se suben. Mientras se
     guarda, la revisión de la nube espera; y si su respuesta salió antes de que
     esto quedara guardado, se descarta (traería lo de antes). */
  async lote(ops, opts) {
    if (!ops.length) return;
    this._escribiendo++;
    try { await this._lote(ops, opts || {}); this._escritos++; }
    finally { this._escribiendo--; }
  }
  async _lote(ops, opts) {
    /* De cada adjunto cuenta lo último que se pide (un respaldo lo borra y lo vuelve a poner) */
    const ultimo = new Map();
    ops.filter(o => o.col === 'adjuntos').forEach(o => ultimo.set(o.tipo === 'del' ? o.id : o.doc.id, o));
    const subir = [...ultimo.values()].filter(o => o.tipo !== 'del' && o.doc.datos).map(o => o.doc);
    const quitar = [...ultimo.values()].filter(o => o.tipo === 'del').map(o => o.id);
    const borrados = new Set(ops.filter(o => o.tipo === 'del').map(o => o.col + ':' + o.id));
    const nuevos = [];
    try {
      const rutasQuitar = quitar.length ? (await this._porIds('adjuntos', quitar, 'id,ruta')).map(f => f.ruta) : [];
      /* Primero los archivos: si después la base no guarda, se quitan */
      for (let i = 0; i < subir.length; i++) {
        const a = subir[i];
        a.ruta = NubeAdapter.ruta(a);
        if (opts.avance) opts.avance(i + 1, subir.length);
        await Nube.subir(a.ruta, await (await fetch(a.datos)).blob());
        if (!this.ver.adjuntos.has(a.id)) nuevos.push(a.ruta);
      }
      const filas = ops.map(o => {
        if (o.tipo === 'del') return { col: o.col, tipo: 'del', id: o.id };
        if (o.col === 'adjuntos') o.doc.ruta = NubeAdapter.ruta(o.doc);
        const op = { col: o.col, tipo: 'put', doc: MAPA.fila(o.col, o.doc, opts.conAutor) };
        const v = EN_MEMORIA.includes(o.col) && !borrados.has(o.col + ':' + o.doc.id) && this.ver[o.col].get(o.doc.id);
        if (v) op.antes = v;
        return op;
      });
      const res = await Nube.rpc('aplicar_lote', { ops: filas });
      ops.forEach(o => { if (o.tipo === 'del') this.ver[o.col].delete(o.id); });
      (res || []).forEach(r => { if (this.ver[r.col]) this.ver[r.col].set(r.id, r.actualizado); });
      /* Los archivos de los adjuntos que se quitaron. Si alguno falla, queda un
         archivo suelto en el depósito: no daña nada. */
      rutasQuitar.forEach(r => Nube.quitarArchivo(r));
    } catch (e) {
      nuevos.forEach(r => Nube.quitarArchivo(r));
      throw this._error(e);
    }
  }
  /* Los errores de la base, dichos para quien usa la plataforma */
  _error(e) {
    if (!e || (e.sql === undefined && !e.red)) return e;
    const m = String(e.message || '');
    const tabla = s => s.replace('«ordenes»', '«órdenes»').replace('«configuracion»', '«configuración»').replace('«auditoria»', '«actividad»');
    if (e.red) return errorNube('No hay conexión con la nube: no se guardó. Revise el internet e intente otra vez.', { red: true });
    if (e.sql === 'PT409' || /^(CAMBIADO|BORRADO)$/.test(m)) {
      if (typeof Sincro !== 'undefined') Sincro.pronto();
      return new ErrorDominio(m === 'BORRADO' ? 'Otra persona borró esto mientras usted trabajaba. Ya se trajo lo último.'
        : 'Otra persona cambió esto mientras usted trabajaba. Ya se trajeron sus cambios: revíselos y vuelva a intentarlo.', 'CAMBIADO');
    }
    if (e.sql === '23505' && /ordenes_secuencia_unica/.test(m)) return new ErrorDominio('Ese número de orden ya lo tomó otra orden.', 'NUMERO_TOMADO');
    if (e.sql === '23505' && /equipos_placa_unica/.test(m)) return new ErrorDominio('Esa placa ya es de otro equipo.', 'DUPLICADO');
    if (e.sql === '23505') return new ErrorDominio('Eso ya existe en la base: ' + m, 'DUPLICADO');
    if (/^No tiene permiso/.test(m)) return new ErrorDominio(tabla(m) + ' Pídaselo al administrador.', 'SIN_PERMISO');
    if (e.sql === '42501' || /row-level security/.test(m)) return new ErrorDominio('No tiene permiso para guardar eso. Pídaselo al administrador.', 'SIN_PERMISO');
    if (e.sql === '23503') return new ErrorDominio('Falta algo relacionado (un proveedor o un equipo que ya no existe). Recargue la página e intente otra vez.', 'REFERENCIA');
    if (e.sql === '57014') return new ErrorDominio('La base tardó demasiado y no guardó. Intente otra vez.', 'NUBE');
    if (/^(23|22)/.test(e.sql)) return new ErrorDominio('La base no aceptó un dato: ' + m, 'DATO');
    return new ErrorDominio('El servidor no guardó: ' + m, 'NUBE');
  }
  /* ¿Qué cambió en la nube? Una sola pregunta (facturacion.cambios, SQL 203)
     trae las filas que cambiaron desde la última vez y lo que se borró. «desde» es la hora de la NUBE menos un
     margen, nunca el reloj del PC: lo que se estaba guardando justo cuando se
     preguntó queda con una hora un poco anterior, y así también llega; repetir
     una fila no hace daño. Si esta pestaña guardó algo mientras llegaba la
     respuesta, se descarta y se pregunta otra vez desde la misma hora. Sin el
     SQL 203 se revisa como antes (_porResumen).
     Devuelve { colección: { poner: [docs], quitar: [ids] } } */
  async sincronizar() {
    /* Sin el 203, cada cinco minutos se mira si ya lo corrieron */
    if (this.sinCambios && Date.now() - this._probado > 300000) {
      const hora = await this.horaNube();
      if (hora) { const r = await this._porResumen(); this.desde = hora; this._ultima = Date.now(); return r; }
    }
    if (this.sinCambios) return this._porResumen();
    const escritos = this._escritos;
    if (this._escribiendo) return {};
    /* Sin la hora (no se pudo al entrar) o tras una semana sin preguntar (lo
       borrado se anota sólo 30 días): se compara todo una vez */
    if (!this.desde || Date.now() - this._ultima > 7 * 864e5) {
      const hora = await this.horaNube();
      if (!hora) return this.sinCambios ? this._porResumen() : {};
      const tablas = await Promise.all(EN_MEMORIA.map(c => this._leer(c)));
      if (this._escribiendo || escritos !== this._escritos) return {};
      this.desde = hora;
      this._ultima = Date.now();
      return this._todo(tablas);
    }
    const r = await Nube.rpc('cambios', { desde: this.desde }, { leer: true });
    if (!r || !r.ahora || this._escribiendo || escritos !== this._escritos) return {};
    this.desde = NubeAdapter.conMargen(r.ahora);
    this._ultima = Date.now();
    return this._poner(r.filas || {}, r.borrados || []);
  }
  /* Lo que llegó, sobre lo que se tenía: primero lo borrado (así una fila
     borrada y vuelta a crear queda) y después las filas. Lo que ya se tenía
     igual no cuenta: lo que guardó esta pestaña vuelve tal cual y no se pinta. */
  _poner(filas, borrados) {
    const out = {}, de = col => out[col] || (out[col] = { poner: [], quitar: [] });
    borrados.forEach(b => { if (EN_MEMORIA.includes(b.tabla) && this.ver[b.tabla].delete(b.id)) de(b.tabla).quitar.push(b.id); });
    EN_MEMORIA.forEach(col => (filas[col] || []).forEach(f => {
      const ver = this.ver[col];
      if (ver.get(f.id) === f.actualizado) return;
      ver.set(f.id, f.actualizado);
      de(col).poner.push(MAPA.doc(col, f));
      if (!this.marca[col] || f.actualizado > this.marca[col]) this.marca[col] = f.actualizado;
    }));
    return out;
  }
  /* Todo lo de la nube, comparado con lo que se tiene */
  _todo(tablas) {
    const out = {};
    EN_MEMORIA.forEach((col, i) => {
      const ver = this.ver[col], ids = new Set(), poner = [];
      tablas[i].forEach(f => {
        ids.add(f.id);
        if (ver.get(f.id) !== f.actualizado) { ver.set(f.id, f.actualizado); poner.push(MAPA.doc(col, f)); }
      });
      const quitar = [...ver.keys()].filter(id => !ids.has(id));
      quitar.forEach(id => ver.delete(id));
      this.marca[col] = tablas[i].reduce((m, f) => (!m || f.actualizado > m ? f.actualizado : m), null);
      if (poner.length || quitar.length) out[col] = { poner, quitar };
    });
    return out;
  }
  /* La hora de la nube, con el margen; null si todavía no tiene el SQL 203 */
  async horaNube() {
    try {
      const r = await Nube.rpc('cambios', {}, { leer: true });
      this.sinCambios = false;
      return r && r.ahora ? NubeAdapter.conMargen(r.ahora) : null;
    } catch (e) {
      if (!NubeAdapter.faltaFuncion(e)) throw e;
      this.sinCambios = true;
      this._probado = Date.now();
      return null;
    }
  }
  /** Antes de traer todo: desde qué hora se preguntará lo que cambie después */
  async marcarHora() {
    try { this.desde = await this.horaNube(); } catch (e) { this.desde = null; }
    this._ultima = Date.now();
  }
  /* 15 segundos de margen: más de lo que tarda el lote más largo (un respaldo
     grande se guarda en 1 a 3 s) */
  static conMargen(t) { return new Date(Date.parse(t) - 15000).toISOString(); }
  /* La nube no tiene la función: la API lo dice con 404 (PGRST202), la base con 42883 */
  static faltaFuncion(e) { return !!e && (e.status === 404 || e.sql === 'PGRST202' || e.sql === '42883'); }
  /* Como antes del 203: un pedido pequeño (resumen) dice cuántas filas y la
     última marca de cada tabla. Sólo si algo no cuadra se trae lo que cambió
     (con un minuto de margen) y, si se borró algo, la lista de ids. */
  async _porResumen() {
    const r = (await Nube.rpc('resumen', {}, { leer: true })) || {};
    const out = {};
    for (const col of EN_MEMORIA) {
      const s = r[col] || { n: 0, max: null }, ver = this.ver[col];
      if (s.max === (this.marca[col] || null) && s.n === ver.size) continue;
      const poner = [];
      const t = this.marca[col] ? Date.parse(this.marca[col]) : NaN;
      const filas = await this._leer(col, isNaN(t) ? '' : 'actualizado=gte.' + encodeURIComponent(new Date(t - 60000).toISOString()));
      filas.forEach(f => { if (ver.get(f.id) !== f.actualizado) { ver.set(f.id, f.actualizado); poner.push(MAPA.doc(col, f)); } });
      let quitar = [];
      if (ver.size !== s.n) {
        const ids = new Set((await this._leer(col, '', 'id')).map(f => f.id));
        quitar = [...ver.keys()].filter(id => !ids.has(id));
        quitar.forEach(id => ver.delete(id));
        const faltan = [...ids].filter(id => !ver.has(id));
        if (faltan.length) (await this._porIds(col, faltan)).forEach(f => { ver.set(f.id, f.actualizado); poner.push(MAPA.doc(col, f)); });
      }
      this.marca[col] = s.max;
      if (poner.length || quitar.length) out[col] = { poner, quitar };
    }
    return out;
  }
}
