  { v: 4, t: '4 % · servicios' }, { v: 6, t: '6 %' }, { v: 10, t: '10 % · honorarios' }, { v: 11, t: '11 %' }
];

/* Quién hizo cada orden, con el nombre de hoy de su cuenta en el Panel de
   control (SQL 206): la base sabe con qué cuenta se creó cada una. Se trae al
   entrar y cuando llega una orden de alguien que no estaba. Sin el 206, o sin
   conexión, queda el nombre que la página anotó al crearla */
const Autores = {
  mapa: new Map(),
  _cuando: 0,
  _pidiendo: null,
  de(id) { return (id && this.mapa.get(id)) || ''; },
  traer(forzar) {
    if (!db || !db.nube) return Promise.resolve(false);
    if (this._pidiendo) return this._pidiendo;
    if (!forzar && Date.now() - this._cuando < 60000) return Promise.resolve(false);
    return (this._pidiendo = (async () => {
      try {
        const filas = (await Nube.rpc('autores', {}, { leer: true })) || [];
        const nuevo = new Map(filas.filter(f => f && f.id && f.nombre).map(f => [f.id, f.nombre]));
        const cambio = nuevo.size !== this.mapa.size || [...nuevo].some(([k, v]) => this.mapa.get(k) !== v);
        this.mapa = nuevo;
        return cambio;
      } catch (e) {
        if (!NubeAdapter.faltaFuncion(e)) console.warn('No se trajeron los nombres de quién hizo cada orden:', e);
        return false;
      } finally { this._cuando = Date.now(); this._pidiendo = null; }
    })());
  },
  /** Llegaron órdenes: si alguna es de una cuenta que no está, se vuelve a pedir */
  async revisar() {
    if (!Datos.ordenes.some(o => o.creadoPor && !this.mapa.has(o.creadoPor))) return;
    if (await this.traer()) Bus.emit('datos:cambio');
  }
};

const Modelo = {
  itemVacio() { return { id: ID(), descripcion: '', cantidad: 1, unidad: 'UND', valorUnitario: 0, observacion: '' }; },
  itemValido(it) { return !!(it && String(it.descripcion || '').trim()); },
  /** Cantidad × valor unitario, menos el descuento del renglón si lo tiene (como la «% Desc.» de las facturas) */
  totalItem(it) {
    const bruto = Num.parse(it.cantidad) * Money.parse(it.valorUnitario);
    return Money.cent(bruto * (1 - Modelo.descuento(it) / 100));
  },
  descuento(it) { return Math.min(100, Math.max(0, Num.parse(it.descuentoPct))); },
  /** Igual que la factura: TOTAL = SUBTOTAL − RETENCIÓN EN LA FUENTE − RETEICA
      + IVA + FLETE, al centavo. El subtotal ya trae los descuentos de cada
      artículo; la retención y la ReteICA (por mil) van sobre él, y el flete se
      suma al final, sin IVA: si el proveedor le cobra IVA, va como un artículo.
      Con el IVA ya incluido en los precios (muchas cotizaciones llegan así), no
      se suma: el subtotal es la base sin IVA y el IVA sale de adentro. */
  totales(o) {
    const items = (o.items || []).filter(Modelo.itemValido);
    const suma = Money.cent(U.sumar(items, Modelo.totalItem));
    const pct = +o.ivaPct || 0;
    const subtotal = o.ivaIncluido ? Money.cent(suma / (1 + pct / 100)) : suma;
    const iva = o.ivaIncluido ? Money.cent(suma - subtotal) : Money.cent(subtotal * pct / 100);
    const retencion = Money.cent(subtotal * (+o.retencionPct || 0) / 100);
    const reteIca = Money.cent(subtotal * Num.parse(o.reteIcaPorMil) / 1000);
    const flete = Math.max(0, Money.parse(o.flete));
    return { subtotal, iva, retencion, reteIca, flete, total: Money.cent(subtotal - retencion - reteIca + iva + flete), valorizada: subtotal > 0, nItems: items.length };
  },
  /** «290-26»: consecutivo de tres cifras y los dos últimos dígitos del año */
  numero(secuencia, fecha) {
    const anio = Fecha.anio(fecha) || new Date().getFullYear();
    return String(secuencia).padStart(3, '0') + '-' + String(anio).slice(2);
  },
  /** Como se muestra: «OS-296-26». El número guardado no lleva las iniciales: si
      la orden cambia de tipo, cambian sólo ellas */
  codigo(o, numero) {
    const s = o && TIPOS[o.tipo] ? TIPOS[o.tipo].sigla : '';
    const n = numero || (o && o.numero) || '';
    return s && n ? s + '-' + n : n;
  },
  concepto(o) {
    if (o.concepto) return o.concepto;
    const its = (o.items || []).filter(Modelo.itemValido);
    if (!its.length) return '';
    return its[0].descripcion + (its.length > 1 ? ' y ' + Txt.plural(its.length - 1, 'artículo') + ' más' : '');
  },
  /** Lo que vale la orden para las estadísticas: si ya llegó la factura, manda la factura */
  valor(o) { return o.factura && +o.factura.valor > 0 ? +o.factura.valor : (+o.total || 0); },
  /** Las anuladas, las solicitudes de cotización y el histórico del Excel no cuentan */
  cuenta(o) { return !o.excel && o.estado !== 'ANULADA' && o.tipo !== 'COTIZACION'; },
  estadoTexto(o) { return o.excel ? 'Del Excel' : ESTADOS[o.estado].t; },
  /** Los datos del proveedor quedan copiados en la orden: lo impreso no cambia
      aunque después se corrija la ficha. */
  fotoProveedor(p) {
    return p ? { id: p.id, nombre: p.nombre, nit: p.nit || '', telefono: p.telefono || p.celular || '', direccion: p.direccion || '',
      ciudad: p.ciudad || '', contacto: p.contacto || '', correo: p.correo || '' } : null;
  },
  /** Quién hizo la orden: la cuenta con que se creó, con su nombre de hoy en el
      panel (ver Autores). No es la firma (el solicitante), que se escoge y se
      cambia en la hoja (Juan, 30/10/2026). Si la base no lo da, el nombre que
      la página anotó al crearla, y si tampoco, sólo se sabe si quien mira es
      quien la hizo */
  autor(o) {
    if (!o) return '';
    const deLaBase = Autores.de(o.creadoPor);
    if (deLaBase) return deLaBase;
    const h = o.historial && o.historial[0];
    if (h && h.por) return h.por;
    return o.creadoPor && o.creadoPor === Permiso.yo() ? Permiso.quien() : '';
  },
  /** El mismo, corto para las listas: «Delsy Rojas», «Juan Posada» */
  autorCorto(o) {
    const n = String(this.autor(o)).trim();
    if (n.includes('@')) return n.split('@')[0];
    const w = n.split(/\s+/).filter(Boolean).map(x => x.charAt(0).toUpperCase() + x.slice(1).toLowerCase());
    return (w.length >= 4 ? [w[0], w[2]] : w.slice(0, 2)).join(' ');
  },
  nombreProveedor(o) { const p = Datos.prov(o.proveedorId); return p ? p.nombre : (o.proveedor && o.proveedor.nombre) || 'Sin proveedor'; },
  nombreEquipo(o) { const e = o.equipoId ? Datos.equipo(o.equipoId) : null; return e ? e.nombre : ''; }
};

const Validar = {
  nit(n) { return String(n || '').replace(/[^\dkK]/g, ''); },
  /** opts.nueva: de aquí en adelante cada orden dice para qué es (Juan,
      30/10/2026), y va de primero porque es lo primero de la hoja. Las que ya
      existen sin equipo se pueden seguir corrigiendo */
  orden(o, opts) {
    const e = {};
    if (opts && opts.nueva && !o.equipoId) e.equipo = 'Escoja para qué es la orden: el vehículo, la máquina o el destino (oficina, bodega, finca…).';
    if (!Fecha.valida(o.fecha)) e.fecha = 'Escriba una fecha válida.';
    if (!o.proveedorId || !Datos.prov(o.proveedorId)) e.proveedor = 'Escoja el proveedor.';
    if (!Empresa.tipos(Empresa.de(o)).includes(o.tipo)) e.tipo = 'Escoja el tipo de orden.';
    if (!ESTADOS[o.estado || 'ESPERANDO']) e.estado = 'Estado no válido.';
    const its = (o.items || []).filter(Modelo.itemValido);
    if (!its.length) e.items = 'Agregue al menos un artículo con su descripción.';
    its.forEach((it, i) => {
      if (!(Num.parse(it.cantidad) > 0)) e['cant-' + it.id] = 'La cantidad del artículo ' + (i + 1) + ' debe ser mayor que cero.';
      if (Money.parse(it.valorUnitario) < 0) e['val-' + it.id] = 'El valor del artículo ' + (i + 1) + ' no puede ser negativo.';
      const d = Num.parse(it.descuentoPct);
      if (!(d >= 0 && d <= 100)) e['desc-' + it.id] = 'El descuento del artículo ' + (i + 1) + ' debe estar entre 0 y 100 %.';
    });
    if (!(+o.ivaPct >= 0 && +o.ivaPct <= 100)) e.iva = 'El IVA debe estar entre 0 y 100 %.';
    if (!(+o.retencionPct >= 0 && +o.retencionPct <= 100)) e.retencion = 'La retención debe estar entre 0 y 100 %.';
    const ica = Num.parse(o.reteIcaPorMil);
    if (!(ica >= 0 && ica <= 100)) e.reteIca = 'La ReteICA debe estar entre 0 y 100 por mil.';
    if (Money.parse(o.flete) < 0) e.flete = 'El flete no puede ser negativo.';
    if (+o.plazoDias < 0 || +o.plazoDias > 720) e.plazo = 'El plazo debe estar entre 0 y 720 días.';
    if (Object.keys(e).length) throw new ErrorValidacion(e);
  },
  proveedor(p, otros) {
    const e = {};
    if (!String(p.nombre || '').trim()) e.nombre = 'Escriba la razón social o el nombre.';
    const k = Txt.clave(p.nombre);
    const dup = k && otros.find(x => x.id !== p.id && !x.fusionadoCon && Txt.clave(x.nombre) === k);
    if (dup) e.nombre = 'Ya existe un proveedor con ese nombre: ' + dup.nombre + '.';
    const nit = Validar.nit(p.nit);
    if (nit) {
      const d2 = otros.find(x => x.id !== p.id && !x.fusionadoCon && Validar.nit(x.nit) === nit);
      if (d2) e.nit = 'Ese NIT ya está en la ficha de ' + d2.nombre + '.';
    }
    if (p.correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p.correo)) e.correo = 'Revise el correo.';
    if (+p.plazoDias < 0 || +p.plazoDias > 720) e.plazoDias = 'El plazo debe estar entre 0 y 720 días.';
    if (Object.keys(e).length) throw new ErrorValidacion(e);
  },
  equipo(q, otros) {
    const e = {};
    if (!String(q.nombre || '').trim()) e.nombre = 'Escriba el nombre.';
    const k = Txt.norm(q.nombre);
    const dup = k && otros.find(x => x.id !== q.id && Txt.norm(x.nombre) === k);
    if (dup) e.nombre = 'Ya existe: ' + dup.nombre + '.';
    const pn = EquipoService.placaNorm(q.placa);
    const dupP = pn && otros.find(x => x.id !== q.id && EquipoService.placaNorm(x.placa) === pn);
    if (dupP) e.placa = 'Esa placa ya es de ' + dupP.nombre + '.';
    if (!TIPOS_EQUIPO[q.tipo]) e.tipo = 'Escoja el tipo.';
    if (Object.keys(e).length) throw new ErrorValidacion(e);
  },
  plantilla(p) {
    const e = {};
    if (!String(p.nombre || '').trim()) e.nombre = 'Póngale un nombre.';
    if (!(p.items || []).filter(Modelo.itemValido).length) e.items = 'Agregue al menos un artículo.';
    if (Object.keys(e).length) throw new ErrorValidacion(e);
  }
};

/* ==========================================================================
   §6  DATOS EN MEMORIA
   --------------------------------------------------------------------------
   Todo se carga al abrir (son pocos miles de registros como mucho) y cada
   cambio se escribe en la nube en el mismo momento. La memoria es una copia de
   lectura rápida; la base manda, y lo que otros guardan llega cada poco
   (Datos.sincronizar).
   ========================================================================== */
let db = null;

const Config = {
  defecto() {
    return {
      id: 'general',
      empresa: { nombre: 'SINUGRAVAS S.A.S.', nit: '900.646.414-3', direccion: '', ciudad: '', telefono: '', correo: '' },
      logo: '',
      consecutivo: { siguiente: 290 },
      ivaPct: 19,
      documento: {
        saludoCompra: 'Señor Proveedor: favor facturar los siguientes artículos así:',
        saludoServicio: 'Señor Proveedor: favor facturar los siguientes servicios así:',
        saludoCotizacion: 'Señor Proveedor: favor cotizar los siguientes artículos así:',
        intro: 'Solicito su colaboración con el suministro de los siguientes repuestos, materiales y/o servicios:',
        citar: 'Favor citar el número de esta orden en su factura.',
        cierre: 'Agradecemos su gestión y colaboración,',
        lugarEntrega: 'Centro Logístico San Jerónimo, Km 3 vía Montería – Planeta Rica, Bodega 69A',
        telefono: '',
        filasMinimas: 12,
        /* El tamaño del logo en la orden, en %: 100 es el de siempre */
        tamLogo: 100
      },
      /* Quién firma lo pone la empresa en Configuración (queda en la nube) */
      solicitantes: [],
      autoriza: { nombre: '', cargo: '', firma: '' },
      ultimoRespaldo: null,
      semillas: 0
    };
  },
  /** Completa con los valores por defecto lo que falte (configuraciones viejas) */
  completar(c) {
    const d = this.defecto();
    if (!c) return d;
    const out = Object.assign({}, d, c);
    ['empresa', 'consecutivo', 'documento', 'autoriza'].forEach(k => { out[k] = Object.assign({}, d[k], c[k] || {}); });
    if (!Array.isArray(out.solicitantes)) out.solicitantes = d.solicitantes;
    return out;
  },
  /* Lo de cada empresa que no es SINUGRAVAS, en su propia fila (id = la empresa):
     su membrete, su logo, su firma, sus textos y desde dónde numera. Nada de
     SINUGRAVAS sirve de valor por defecto: ni su NIT, ni su bodega, ni su firma */
  defectoEmpresa(id) {
    const d = this.defecto();
    return {
      id, empresa: { nombre: id === 'JDPR' ? 'JUAN DAVID POSADA RESTREPO' : id, tipoDoc: 'C.C.', nit: '', direccion: '', ciudad: '', telefono: '', correo: '' },
      logo: '', consecutivo: { siguiente: id === 'JDPR' ? 472 : 1 },
      documento: Object.assign({}, d.documento, { lugarEntrega: '' }),
      autoriza: { nombre: '', cargo: '', firma: '' }
    };
  },
  completarEmpresa(id, c) {
    const d = this.defectoEmpresa(id);
    if (!c) return d;
    const out = Object.assign({}, d, c, { id });
    ['empresa', 'consecutivo', 'documento', 'autoriza'].forEach(k => { out[k] = Object.assign({}, d[k], c[k] || {}); });
    return out;
  },
  solicitantes() { return (Datos.cfg.solicitantes || []).filter(s => s.activo); },
  solicitantePred() { const s = this.solicitantes(); return s.find(x => x.predeterminado) || s[0] || null; },
  /** El logo de la empresa; el de SINUGRAVAS, si no se ha puesto otro, es el de la marca */
  logo(emp) { return (emp || Empresa.activa) === 'SINUGRAVAS' ? (Datos.cfg.logo || MARCA.logo) : (Empresa.cfg(emp).logo || ''); },
  /** Qué tan grande sale el logo en la orden (1 = el de siempre). Cada empresa lo
     escoge en Configuración, entre la mitad y dos veces y media */
  tamLogo(emp) { return this.escalaLogo(Empresa.cfg(emp || Empresa.activa).documento.tamLogo); },
  escalaLogo(pct) { return Math.min(250, Math.max(50, +pct || 100)) / 100; }
};

const Datos = {
  /* cfg: la configuración común y la de SINUGRAVAS; cfgs: la de cada otra empresa (ver Empresa.cfg) */
  cfg: null, cfgs: {}, proveedores: [],
  /* Órdenes, equipos y plantillas son de una empresa. Aquí están las de todas,
     y Datos.ordenes (y equipos y plantillas) da sólo las de la empresa activa */
  _todo: { ordenes: [], equipos: [], plantillas: [] },
  _vista: {},
  get ordenes() { return this._de('ordenes'); },
  set ordenes(v) { this._poner('ordenes', v); },
  get equipos() { return this._de('equipos'); },
  set equipos(v) { this._poner('equipos', v); },
  get plantillas() { return this._de('plantillas'); },
  set plantillas(v) { this._poner('plantillas', v); },
  _de(c) {
    const emp = Empresa.activa;
    if (this._vista.emp !== emp) this._vista = { emp };
    return this._vista[c] || (this._vista[c] = this._todo[c].filter(x => Empresa.de(x) === emp));
  },
  _poner(c, v) { this._todo[c] = v || []; this._vista = {}; },
  /** Las de todas las empresas: para guardar, para buscar por id y para el respaldo */
  crudo(c) { return this._todo[c] || this[c]; },
  refiltrar() { this._vista = {}; },
  _quitar(c, ids) {
    const q = ids instanceof Set ? ids : new Set(ids);
    if (this._todo[c]) this._poner(c, this._todo[c].filter(d => !q.has(d.id))); else this[c] = this[c].filter(d => !q.has(d.id));
  },
  _poner1(c, d) {
    const l = this.crudo(c), i = l.findIndex(x => x.id === d.id);
    if (i >= 0) l[i] = d; else l.push(d);
  },
  _idx: {},
  async cargar() {
    /* La hora de la nube antes de traer todo: lo que se guarde mientras tanto llega en la primera revisión */
    if (db.nube) await db.marcarHora();
    const [cfgs, prov, eq, ord, pl] = await Promise.all(['configuracion', 'proveedores', 'equipos', 'ordenes', 'plantillas'].map(c => db.getAll(c, { marcar: true })));
    this.cfg = Config.completar(cfgs.find(c => c.id === 'general'));
    this.cfgs = {};
    cfgs.filter(c => c.id !== 'general').forEach(c => { this.cfgs[c.id] = c; });
    this.proveedores = prov; this.equipos = eq; this.ordenes = ord; this.plantillas = pl;
    this.indexar();
  },
  indexar(col) {
    (col ? [col] : ['proveedores', 'equipos', 'ordenes', 'plantillas']).forEach(c => { this._idx[c] = new Map(this.crudo(c).map(d => [d.id, d])); });
    this._vista = {};
    if (!col || col === 'proveedores' || col === 'equipos') HistoricoExcel.invalidar();
  },
  prov(id) { return (id && this._idx.proveedores.get(id)) || null; },
  equipo(id) { return (id && this._idx.equipos.get(id)) || null; },
  orden(id) { return (id && this._idx.ordenes.get(id)) || null; },
  plantilla(id) { return (id && this._idx.plantillas.get(id)) || null; },
  /** Escribe varias cosas de una vez (orden + consecutivo + auditoría). La
      memoria sólo cambia si la base confirmó. */
  async lote(ops) {
    const ahora = Fecha.ahora();
    ops.forEach(o => { if (o.tipo !== 'del') { o.doc.actualizadoEn = ahora; if (!o.doc.creadoEn) o.doc.creadoEn = ahora; } });
    Cargando.on();
    try { await db.lote(ops); } finally { Cargando.off(); }
    const cols = new Set();
    ops.forEach(o => {
      if (o.col === 'auditoria' || o.col === 'adjuntos') return;
      cols.add(o.col);
      if (o.col === 'configuracion') {
        if (o.tipo === 'del') delete this.cfgs[o.id];
        else if (o.doc.id === 'general') this.cfg = Config.completar(o.doc); else this.cfgs[o.doc.id] = o.doc;
        return;
      }
      if (o.tipo === 'del') { this._quitar(o.col, [o.id]); return; }
      this._poner1(o.col, o.doc);
    });
    cols.forEach(c => { if (c !== 'configuracion') this.indexar(c); Bus.emit(c + ':cambio'); });
    if (cols.size) { Bus.emit('datos:cambio'); Canal.avisar(); }
  },
  /** Trae lo que otros guardaron. En la nube, sólo lo que cambió; en memoria, todo otra vez */
  async sincronizar() {
    if (!db) return false;
    if (!db.nube) { await this.cargar(); Bus.emit('datos:cambio'); return true; }
    const cambios = await db.sincronizar();
    const cols = Object.keys(cambios);
    cols.forEach(c => {
      const { poner, quitar } = cambios[c];
      if (c === 'configuracion') {
        poner.forEach(d => { if (d.id === 'general') this.cfg = Config.completar(d); else this.cfgs[d.id] = d; });
        quitar.forEach(id => { delete this.cfgs[id]; });
        Bus.emit(c + ':cambio');
        return;
      }
      if (quitar.length) this._quitar(c, quitar);
      poner.forEach(d => this._poner1(c, d));
      this.indexar(c);
      Bus.emit(c + ':cambio');
    });
    if (cols.length) Bus.emit('datos:cambio');
    if (cols.includes('ordenes')) Autores.revisar();
    return cols.length > 0;
  },
  guardar(col, doc) { return this.lote([{ col, tipo: 'put', doc }]); },
  quitar(col, id) { return this.lote([{ col, tipo: 'del', id }]); },
  guardarCfg(cambios) {
    const nuevo = Object.assign(U.clonar(this.cfg), cambios, { id: 'general' });
    return this.lote([{ col: 'configuracion', tipo: 'put', doc: nuevo }]);
  },
  /** Lo de una empresa: el de SINUGRAVAS va en la fila común; el de otra, en la suya */
  guardarCfgEmpresa(emp, cambios) {
    if (emp === 'SINUGRAVAS') return this.guardarCfg(cambios);
    const nuevo = Object.assign(U.clonar(Empresa.cfg(emp)), cambios, { id: emp });
    return this.lote([{ col: 'configuracion', tipo: 'put', doc: nuevo }]);
  },
  evento(accion, entidad, entidadId, detalle) {
    const doc = { id: ID(), en: Fecha.ahora(), accion, entidad, entidadId: entidadId || '', detalle: detalle || '' };
    const por = Permiso.quien();
    if (por) doc.por = por;
    return { col: 'auditoria', tipo: 'put', doc };
  }
};

/* Si hay dos pestañas abiertas, la que no guardó se entera enseguida y trae
   los cambios de la nube, sin esperar la próxima revisión. */
const Canal = {
  bc: null, yo: ID(),
  iniciar() {
    try {
      this.bc = new BroadcastChannel(APP.dbName);
      this.bc.onmessage = e => { if (e.data && e.data.de !== this.yo) this.recibir(); };
    } catch (e) { /* navegador sin BroadcastChannel: cada pestaña por su lado */ }
  },
  avisar() { try { this.bc && this.bc.postMessage({ de: this.yo }); } catch (e) { /* nada */ } },
  recibir: U.debounce(() => { Sincro.ya(); }, 350)
};

/* ==========================================================================
   §7  SERVICIOS
   ========================================================================== */
/* El número de cada orden sale de las órdenes: el que sigue a la última, y
   nunca antes del que se fijó en Configuración (290, después del Excel). Así
   hacer una orden no cambia la configuración, y si se borra la última su
   número vuelve a quedar libre solo; uno de en medio no se vuelve a usar. Si
   dos personas guardan a la vez, la base no deja repetir: la segunda toma el
   siguiente (OrdenService.guardar). */
const Consecutivo = {
  /** Desde dónde numera la plataforma: lo que se fijó en Configuración */
  base() { return Math.max(1, Math.floor(+Empresa.cfg().consecutivo.siguiente || 1)); },
  usado(sec, exceptoId) { return Datos.ordenes.some(o => o.secuencia === sec && o.id !== exceptoId); },
  maximo() { return Datos.ordenes.reduce((m, o) => Math.max(m, o.secuencia || 0), 0); },
  siguiente() { return Math.max(this.base(), this.maximo() + 1); },
  /** El número que toma la próxima orden: nunca se repite uno */
  libre() { return this.siguiente(); },
  vistaPrevia(fecha) { return Modelo.numero(this.libre(), fecha || Fecha.hoy()); },
  /** ¿Tiene el último número que se dio? Si se borra, se entiende que fue un error y su número vuelve a quedar libre */
  esUltima(o) { return !!o.secuencia && o.secuencia === this.maximo() && o.secuencia >= this.base(); },
  /* Sólo para poner al día datos de la versión 1.2 o anterior (Semillas v5),
     que borraban sin devolver el número: a dónde debía volver el que estaba
     configurado, mirando las órdenes borradas en la actividad. */
  async devolverA(sec) {
    const borrados = new Set((await db.getAll('auditoria')).filter(a => a.accion === 'eliminar' && a.entidad === 'orden')
      .map(a => +((/^(\d+)-\d{2}\b/.exec(a.detalle || '') || [])[1])).filter(Boolean));
    let s = sec;
    while (s > 1 && borrados.has(s - 1) && !this.usado(s - 1)) s--;
    return s;
  }
};

/* Los PDF que se adjuntan se comprimen al guardarlos, igual que en las demás
   plataformas de SINUGRAVAS (Juan, 30/10/2026): se recodifican sus fotos JPEG
   para bajar entre el 18 y el 30 % del peso, sin tocar la resolución ni el
   texto. Se guarda tal cual un PDF con firma digital, uno de menos de 200 KB
   o sin fotos JPEG (casi siempre una factura electrónica, sólo texto) o lo
   que no baje de peso. Si algo falla, también: comprimir nunca impide adjuntar. */
const Compresor = {
  TOPE: 0.30,
  MIN: 200 * 1024,
  /* Todo corre en el navegador: pasado este tiempo, las fotos que falten se
     dejan como venían (un escaneo de muchas páginas no se queda pegado) */
  TIEMPO: 25000,
  /* Las fotos JPEG de un PDF dicen /DCTDecode en su diccionario, que nunca va
     comprimido ni cifrado. Si no aparece, no hay nada que recomprimir y no
     hace falta traer pdf-lib */
  tieneFotos(bytes) {
    const p = [47, 68, 67, 84, 68, 101, 99, 111, 100, 101]; /* «/DCTDecode» */
    for (let i = bytes.indexOf(47); i >= 0 && i <= bytes.length - p.length; i = bytes.indexOf(47, i + 1)) {
      let k = 1;
      while (k < p.length && bytes[i + k] === p[k]) k++;
      if (k === p.length) return true;
    }
    return false;
  },
  /* pdf-lib se trae de internet la primera vez que se comprime un PDF. Con su
     huella (integrity) el navegador no lo ejecuta si alguien lo cambia */
  LIB: ['https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'],
  HUELLA: 'sha512-z8IYLHO8bTgFqj+yrPyIJnzBDf7DDhWwiEsk4sY+Oe6J2M+WQequeGS7qioI5vT6rXgVRb4K1UVQC5ER7MKzKQ==',
  _lib: null,
  lib() {
    if (window.PDFLib) return Promise.resolve(window.PDFLib);
    const traer = src => new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = src;
      s.integrity = this.HUELLA;
      s.crossOrigin = 'anonymous';
      s.onload = () => (window.PDFLib ? ok(window.PDFLib) : mal(new Error('pdf-lib')));
      s.onerror = () => { s.remove(); mal(new Error('Sin conexión')); };
      document.head.appendChild(s);
    });
    return this._lib || (this._lib = this.LIB.slice(1).reduce((p, src) => p.catch(() => traer(src)), traer(this.LIB[0]))
      .catch(e => { this._lib = null; throw e; }));
  },
  num(x) { return x && (typeof x.asNumber === 'function' ? x.asNumber() : x.numberValue); },
  /* JPEG → JPEG con otra calidad y la misma resolución. Dentro de un PDF la
     orientación de la cámara no cuenta, así que no se gira nada */
  async recodificar(bytes, q) {
    const blob = new Blob([bytes], { type: 'image/jpeg' });
    let bmp;
    try { bmp = await createImageBitmap(blob, { imageOrientation: 'none' }); } catch (e) { bmp = await createImageBitmap(blob); }
    const c = document.createElement('canvas');
    c.width = bmp.width;
    c.height = bmp.height;
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bmp, 0, 0);
    if (bmp.close) bmp.close();
    const out = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
    return { bytes: new Uint8Array(await out.arrayBuffer()), w: c.width, h: c.height };
  },
  /* La calidad que deja la foto entre un 18 y un 30 % más liviana, sin bajar
     nunca de 0,80: que se siga leyendo va primero. Se va acercando entre 0,80
     y 0,98, y si no cae en la franja se queda con la más cercana que no pasó
     del tope. Nada, si no conviene tocarla */
  async calidad(bytes) {
    const ahorro = async q => 1 - (await this.recodificar(bytes, q)).bytes.length / bytes.length;
    let bajo = 0.8, alto = 0.98, mejor = null;
    for (let i = 0; i < 6 && alto - bajo > 0.015; i++) {
      const q = Math.round((bajo + alto) * 50) / 100;
      const r = await ahorro(q);
      if (r >= 0.18 && r <= this.TOPE) return q;
      if (r > this.TOPE) bajo = q;
      else { if (r >= 0.03) mejor = q; alto = q; }
    }
    return mejor;
  },
  /** Un PDF → { blob, nota }: el comprimido, o el original y por qué quedó así.
      El resultado se vuelve a abrir para comprobar que está sano */
  async pdf(f) {
    if (f.size < this.MIN) return { blob: f, nota: 'es liviano' };
    const orig = new Uint8Array(await f.arrayBuffer());
    if (!this.tieneFotos(orig)) return { blob: f, nota: 'no tiene fotos' };
    const hasta = performance.now() + this.TIEMPO;
    const L = await this.lib();
    const N = n => L.PDFName.of(n);
    const doc = await L.PDFDocument.load(orig, { updateMetadata: false });
    const objs = doc.context.enumerateIndirectObjects();
    const dic = o => (o instanceof L.PDFDict ? o : o && o.dict instanceof L.PDFDict ? o.dict : null);
    /* Con firma digital no se toca: la firma dejaría de valer */
    if (objs.some(([, o]) => { const d = dic(o); return d && (d.get(N('FT')) === N('Sig') || d.get(N('Type')) === N('Sig') || d.has(N('ByteRange'))); }))
      return { blob: f, nota: 'tiene firma digital' };
    /* Las máscaras de otras imágenes tampoco se tocan */
    const mascaras = new Set();
    objs.forEach(([, o]) => {
      const d = dic(o);
      if (d) ['SMask', 'Mask'].forEach(k => { const v = d.get(N(k)); if (v instanceof L.PDFRef) mascaras.add(v.toString()); });
    });
    const fotos = objs.filter(([ref, o]) => o instanceof L.PDFRawStream && !mascaras.has(ref.toString()) && this.esFoto(L, doc, o));
    if (fotos.length) {
      const mayor = fotos.reduce((a, b) => (b[1].contents.length > a[1].contents.length ? b : a))[1];
      const q = await this.calidad(mayor.contents);
      if (q) for (const [ref, o] of fotos) {
        if (performance.now() > hasta) break;
        const out = await this.recodificar(o.contents, q);
        const W = this.num(doc.context.lookup(o.dict.get(N('Width')))), H = this.num(doc.context.lookup(o.dict.get(N('Height'))));
        if (out.bytes.length >= o.contents.length * 0.97 || out.w !== W || out.h !== H) continue;
        o.dict.set(N('Length'), L.PDFNumber.of(out.bytes.length));
        if (o.dict.get(N('ColorSpace')) === N('DeviceGray')) o.dict.set(N('ColorSpace'), N('DeviceRGB'));
        doc.context.assign(ref, L.PDFRawStream.of(o.dict, out.bytes));
      }
    }
    const paginas = doc.getPageCount();
    const out = await doc.save({ useObjectStreams: true });
    if ((await L.PDFDocument.load(out, { updateMetadata: false })).getPageCount() !== paginas) throw new Error('verificación');
    if (out.length > orig.length * 0.97) return { blob: f, nota: 'ya venía liviano' };
    return { blob: new File([out], f.name, { type: 'application/pdf' }) };
  },
  /* Sólo fotos JPEG corrientes (RGB o grises), sin máscaras ni ajustes raros */
  esFoto(L, doc, o) {
    const N = n => L.PDFName.of(n), d = o.dict;
    if (d.get(N('Subtype')) !== N('Image') || d.get(N('Decode')) || d.get(N('DecodeParms')) || d.get(N('ImageMask'))) return false;
    let filtro = d.get(N('Filter'));
    if (filtro instanceof L.PDFArray) { if (filtro.size() !== 1) return false; filtro = filtro.get(0); }
    if (filtro !== N('DCTDecode')) return false;
    let cs = d.get(N('ColorSpace'));
    if (cs instanceof L.PDFRef) cs = doc.context.lookup(cs);
    if (cs === N('DeviceRGB') || cs === N('DeviceGray')) return true;
    if (cs instanceof L.PDFArray && cs.get(0) === N('ICCBased')) {
      const icc = doc.context.lookup(cs.get(1));
      return Boolean(icc && icc.dict && this.num(icc.dict.get(N('N'))) === 3);
    }
    return false;
  }
};

/* La cotización del proveedor (o la factura, una foto del repuesto…) va
   adjunta a la orden. El archivo va al depósito de archivos de la nube y en la
   orden queda sólo su nombre, tipo y peso: así las listas no cargan megas que
   nadie está mirando. Las fotos se reducen y los PDF se comprimen antes de
   guardarlos. */
const Adjuntos = {
  MAX: 8 * 1048576,
  ACEPTA: 'application/pdf,image/jpeg,image/png,image/webp',
  async preparar(file) {
    if (!/^(application\/pdf|image\/(jpeg|png|webp))$/.test(file.type)) throw new ErrorDominio('«' + file.name + '»: sólo se adjuntan PDF o fotos (JPG, PNG).');
    /* Uno que ni comprimido cabría no se intenta: tardaría para nada */
    if (file.size > 2 * this.MAX) throw new ErrorDominio('«' + file.name + '» pesa ' + this.peso(file.size) + '; el máximo es 8 MB.');
    let f = file;
    if (file.type === 'application/pdf') {
      try { f = (await Compresor.pdf(file)).blob; } catch (e) { console.warn('El PDF se adjunta sin comprimir:', e); }
    }
    let datos = await U.leerArchivo(f);
    let tipo = file.type;
    if (tipo !== 'application/pdf') { datos = await U.reducirImagen(datos, 1800, 'image/jpeg'); tipo = 'image/jpeg'; }
    const tamano = Math.round((datos.length - datos.indexOf(',') - 1) * 3 / 4);
    if (tamano > this.MAX) throw new ErrorDominio('«' + file.name + '» pesa ' + this.peso(tamano) + '; el máximo es 8 MB.');
    const nombre = tipo === file.type ? file.name : file.name.replace(/\.[^.]+$/, '') + '.jpg';
    return { id: ID(), nombre, tipo, tamano, en: Fecha.ahora(), datos };
  },
  /** «comprimido de 2,4 MB a 1,7 MB» si el PDF bajó de peso, o nada */
  ahorro(file, a) { return a.tipo === 'application/pdf' && a.tamano < file.size * 0.97 ? 'comprimido de ' + this.peso(file.size) + ' a ' + this.peso(a.tamano) : ''; },
  meta(a) { return { id: a.id, nombre: a.nombre, tipo: a.tipo, tamano: a.tamano, en: a.en }; },
  peso(n) { return n >= 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; },
  html(lista, editable) {
    if (!lista.length) return '<div class="adj-vacio">' + (editable ? 'Arrastre aquí la cotización del proveedor (PDF o foto) o use «Adjuntar».' : 'Sin archivos.') + '</div>';
    return '<div class="adj-lista">' + lista.map(a => '<div class="adj">' + Icon(a.tipo === 'application/pdf' ? 'doc' : 'image', '', 16) +
      '<button type="button" class="adj-n" data-adj-ver="' + attr(a.id) + '" title="Ver ' + attr(a.nombre) + '">' + esc(a.nombre) + '</button>' +
      '<span class="adj-p">' + esc(this.peso(a.tamano)) + '</span>' +
      (editable ? '<button type="button" class="btn btn-ghost btn-icon btn-sm" data-adj-quitar="' + attr(a.id) + '" data-tip="Quitar" aria-label="Quitar ' + attr(a.nombre) + '">' + Icon('x', '', 12) + '</button>' : '') +
      '</div>').join('') + '</div>';
  },
  /** El botón «Adjuntar» y soltar archivos encima de la tarjeta */
  unir(cont, alAgregar) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = this.ACEPTA; input.multiple = true; input.hidden = true;
    cont.appendChild(input);
    /* Comprimir un PDF puede tardar unos segundos: se avisa, y los archivos se
       preparan de a uno. Lo que devuelve dice si todavía hay alguno en camino */
    let cola = Promise.resolve(), trabajando = 0;
    const tomar = files => {
      trabajando++;
      cola = cola.then(async () => {
        for (const f of files) {
          const pesado = f.type === 'application/pdf' && f.size >= Compresor.MIN;
          if (pesado) { Cargando.on(); Toast.info('Comprimiendo <b>' + esc(f.name) + '</b>…', { ms: 3000 }); }
          let a = null;
          try { a = await this.preparar(f); } catch (e) { Toast.err(esc(e.message)); } finally { if (pesado) Cargando.off(); }
          if (a) try { await alAgregar(a, this.ahorro(f, a)); } catch (e) { Toast.err(esc(e.message)); }
        }
      }).finally(() => { trabajando--; });
      return cola;
    };
    cont.addEventListener('click', e => { if (e.target.closest('[data-adj-subir]')) input.click(); });
    input.addEventListener('change', () => { const l = [...input.files]; input.value = ''; tomar(l); });
    cont.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); cont.classList.add('adj-sobre'); } });
    cont.addEventListener('dragleave', e => { if (!cont.contains(e.relatedTarget)) cont.classList.remove('adj-sobre'); });
    cont.addEventListener('drop', e => { if (!e.dataTransfer.files.length) return; e.preventDefault(); cont.classList.remove('adj-sobre'); tomar([...e.dataTransfer.files]); });
    return { ocupado: () => trabajando > 0, listo: () => cola, tomar };
  },
  /** Lo muestra en grande; «pendientes» son los que todavía no se han guardado */
  async ver(meta, pendientes) {
    let a = (pendientes || []).find(x => x.id === meta.id);
    if (!a) { Cargando.on(); try { a = await db.get('adjuntos', meta.id); } catch (e) { a = null; } finally { Cargando.off(); } }
    if (!a || !a.datos) { Toast.err('No se encontró el archivo' + (db.nube ? ' en la nube. Revise la conexión e intente otra vez.' : '.')); return; }
    const url = URL.createObjectURL(await (await fetch(a.datos)).blob());
    Modal.abrir({ titulo: esc(a.nombre), subtitulo: esc(this.peso(a.tamano)) + ' · adjuntado el ' + esc(Fecha.stamp(a.en)), ancho: 'xwide',
      cuerpo: a.tipo === 'application/pdf' ? '<iframe class="adj-pdf" src="' + attr(url) + '" title="' + attr(a.nombre) + '"></iframe>'
        : '<div class="adj-img"><img src="' + attr(url) + '" alt="' + attr(a.nombre) + '"></div>',
      pie: '<a class="btn" href="' + attr(url) + '" download="' + attr(a.nombre) + '">' + Icon('download', '', 14) + 'Descargar</a><button class="btn btn-primary" data-cerrar>Cerrar</button>',
      alCerrar: () => setTimeout(() => URL.revokeObjectURL(url), 1500) });
  }
};

const OrdenService = {
  /** Una orden nueva, sin guardar, con lo que ya se sabe */
  nueva(opts) {
    opts = opts || {};
    const cfg = Datos.cfg, emp = Empresa.activa;
    const sol = Config.solicitantePred();
    const o = {
      id: null, empresa: emp, numero: '', secuencia: null, tipo: Empresa.tipoNuevo(emp), fecha: Fecha.hoy(),
      proveedorId: null, proveedor: null, equipoId: null, concepto: '', referencia: '',
      items: [Modelo.itemVacio()],
      ivaPct: cfg.ivaPct, retencionPct: 0,
      subtotal: 0, iva: 0, retencion: 0, total: 0,
      formaPago: 'CONTADO', plazoDias: 0, cuotas: 0, medioPago: '',
      entregaLugar: Empresa.cfg(emp).documento.lugarEntrega || '', entregaRecibe: '', entregaCedula: '',
      notaProveedor: '', notasInternas: '',
      solicitante: sol ? { id: sol.id, nombre: sol.nombre, cargo: sol.cargo, telefono: sol.telefono || '' } : null,
      estado: 'ESPERANDO', historial: [], factura: null, anulacion: null, pago: null, plantillaId: null, adjuntos: []
    };
    if (opts.proveedorId) this.aplicarProveedor(o, opts.proveedorId);
    if (opts.plantillaId) this.aplicarPlantilla(o, Datos.plantilla(opts.plantillaId));
    if (opts.duplicarId) {
      const b = Datos.orden(opts.duplicarId) || HistoricoExcel.paraCopiar(opts.duplicarId);
      if (b) {
        ['tipo', 'proveedorId', 'equipoId', 'concepto', 'ivaPct', 'ivaIncluido', 'retencionPct', 'reteIcaPorMil', 'formaPago', 'plazoDias', 'cuotas', 'medioPago',
          'entregaLugar', 'entregaRecibe', 'entregaCedula', 'notaProveedor'].forEach(k => { o[k] = U.clonar(b[k]); });
        o.items = b.items.map(it => Object.assign(U.clonar(it), { id: ID() }));
        o.duplicadaDe = b.numero;
        /* Duplicar una de la otra empresa: el tipo y el equipo tienen que ser de ésta */
        if (!Empresa.tipos(emp).includes(o.tipo)) o.tipo = Empresa.tipoNuevo(emp);
        if (o.equipoId && Empresa.de(Datos.equipo(o.equipoId)) !== emp) o.equipoId = null;
      }
    }
    if (opts.equipoId) o.equipoId = opts.equipoId;
    return o;
  },
  /** Al escoger proveedor se traen sus condiciones habituales */
  aplicarProveedor(o, provId) {
    const p = Datos.prov(provId);
    o.proveedorId = p ? p.id : null;
    if (!p) return o;
    if (p.formaPago) { o.formaPago = p.formaPago; o.plazoDias = +p.plazoDias || 0; }
    if (p.medioPago) o.medioPago = p.medioPago;
    return o;
  },
  aplicarPlantilla(o, pl) {
    if (!pl) return o;
    o.plantillaId = pl.id;
    if (pl.tipo) o.tipo = pl.tipo;
    if (pl.proveedorId && Datos.prov(pl.proveedorId)) this.aplicarProveedor(o, pl.proveedorId);
    if (pl.equipoId && Datos.equipo(pl.equipoId)) o.equipoId = pl.equipoId;
    if (pl.concepto) o.concepto = pl.concepto;
    o.items = pl.items.map(it => Object.assign(Modelo.itemVacio(), U.clonar(it), { id: ID() }));
    return o;
  },
  /** Deja la orden lista para guardar: artículos limpios y totales calculados */
  normalizar(o) {
    o.items = (o.items || []).filter(Modelo.itemValido).map(it => Object.assign({
      id: it.id || ID(),
      descripcion: String(it.descripcion).trim().replace(/\s+/g, ' '),
      cantidad: Num.parse(it.cantidad),
      unidad: Txt.mayus(String(it.unidad || '').trim()) || 'UND',
      valorUnitario: Money.parse(it.valorUnitario),
      observacion: String(it.observacion || '').trim()
    }, Modelo.descuento(it) ? { descuentoPct: Modelo.descuento(it) } : {}));
    o.ivaPct = +o.ivaPct || 0;
    if (o.ivaIncluido) o.ivaIncluido = true; else delete o.ivaIncluido;
    o.retencionPct = +o.retencionPct || 0;
    /* La ReteICA (por mil) y el flete sólo quedan en la orden que los tiene */
    const ica = Num.parse(o.reteIcaPorMil), flete = Money.parse(o.flete);
    if (ica > 0) o.reteIcaPorMil = ica; else delete o.reteIcaPorMil;
    if (flete > 0) o.flete = flete; else delete o.flete;
    o.plazoDias = Math.max(0, Math.round(+o.plazoDias || 0));
    o.cuotas = Math.max(0, Math.round(+o.cuotas || 0));
    if (o.formaPago !== 'CREDITO') { o.plazoDias = 0; o.cuotas = 0; }
    Object.assign(o, Modelo.totales(o));
    delete o.valorizada; delete o.nItems;
    if (!o.reteIca) delete o.reteIca;
    if (!o.flete) delete o.flete;
    ['concepto', 'referencia', 'entregaLugar', 'entregaRecibe', 'entregaCedula', 'notaProveedor', 'notasInternas']
      .forEach(k => { o[k] = String(o[k] || '').trim(); });
    return o;
  },
  /** La orden como está ahora en memoria (la última que llegó de la nube):
      los cambios de estado se hacen sobre ella, no sobre la que tenía la pantalla */
  actual(o) { return U.clonar((o && o.id && Datos.orden(o.id)) || o); },
  /** Una entrada del historial: qué pasó, cuándo y quién */
  paso(estado, nota) {
    const h = { estado, en: Fecha.ahora(), nota: nota || '' };
    const por = Permiso.quien();
    if (por) h.por = por;
    return h;
  },
  /** nuevos: los archivos adjuntados en el formulario que aún no se han guardado;
      nota: lo que queda en el historial si el cambio lo amerita;
      opts.estado y opts.factura: los cambia «Llegó la factura»; con opts.pago,
      «Ya se pagó». Lo demás que el formulario no toca (el estado, la factura,
      el pago, la anulación) sale de la orden como está ahora en la nube: otra
      persona pudo pagarla mientras tanto, y eso no se pisa. */
  async guardar(entrada, nuevos, nota, opts) {
    Permiso.exigir('editar');
    opts = opts || {};
    const o = U.clonar(entrada);
    const previo = o.id ? Datos.orden(o.id) : null;
    if (previo) {
      Permiso.exigirOrden(previo, 'editar');
      if (previo.creadoPor) o.creadoPor = previo.creadoPor;
      /* Una orden nunca cambia de empresa, ni el membrete con que salió */
      o.empresa = Empresa.de(previo);
      if (previo.membrete) o.membrete = U.clonar(previo.membrete); else delete o.membrete;
      o.estado = opts.estado || previo.estado;
      if (!opts.factura) o.factura = U.clonar(previo.factura || null);
      if (!opts.pago) o.pago = U.clonar(previo.pago || null);
      o.anulacion = U.clonar(previo.anulacion || null);
    }
    if (!previo && opts.estado) o.estado = opts.estado;
    o.estado = o.estado || 'ESPERANDO';
    /* Lo que lleva su papel queda en la orden al hacerla, como los datos del
       proveedor: si después se corrige la configuración, la orden vieja se
       reimprime como salió (lo aconsejó Caja Menor) */
    if (!previo) { o.empresa = o.empresa || Empresa.activa; o.membrete = U.clonar(Empresa.cfg(o.empresa).empresa); }
    /* Una nueva tiene que decir para qué es: Flota toma las de sus vehículos */
    Validar.orden(o, { nueva: !previo });
    /* Lo que usa tiene que ser de su misma empresa (Caja Menor lo aprendió tarde) */
    const eqo = o.equipoId && Datos.equipo(o.equipoId);
    if (eqo && Empresa.de(eqo) !== o.empresa) throw new ErrorValidacion({ equipo: 'Ese equipo o destino es de ' + Empresa.nombre(Empresa.de(eqo)) + ': escoja uno de ' + Empresa.nombre(o.empresa) + '.' });
    const plo = o.plantillaId && Datos.plantilla(o.plantillaId);
    if (plo && Empresa.de(plo) !== o.empresa) o.plantillaId = null;
    this.normalizar(o);
    /* La factura vale lo que suman sus artículos: compras les pone los valores cuando llega */
    if (o.factura && o.total > 0) o.factura.valor = o.total;
    const prov = Datos.prov(o.proveedorId);
    o.proveedor = Modelo.fotoProveedor(prov);
    const comunes = [];
    if (!previo) {
      o.id = o.id || ID();
      /* Es de quien la crea (la base pone lo mismo): sólo esa persona o el administrador la cambian */
      const yo = Permiso.yo();
      if (yo) o.creadoPor = yo; else delete o.creadoPor;
      o.historial = [this.paso(o.estado, (o.duplicadaDe ? 'Creada a partir de la ' + o.duplicadaDe : 'Creada') + (nota ? ' · ' + nota : ''))];
      delete o.duplicadaDe;
      if (o.plantillaId && Datos.plantilla(o.plantillaId)) {
        const pl = U.clonar(Datos.plantilla(o.plantillaId));
        pl.usos = (pl.usos || 0) + 1; pl.ultimoUso = Fecha.ahora();
        comunes.push({ col: 'plantillas', tipo: 'put', doc: pl });
      }
    } else {
      o.secuencia = previo.secuencia; o.numero = previo.numero; o.creadoEn = previo.creadoEn;
      o.historial = (previo.historial || []).slice();
      if (previo.estado !== o.estado || nota) o.historial.push(this.paso(o.estado, nota || 'Al editar la orden'));
    }
    const antes = previo ? previo.adjuntos || [] : [];
    nuevos = (nuevos || []).filter(a => a.datos);
    o.adjuntos = (o.adjuntos || []).filter(a => antes.some(x => x.id === a.id) || nuevos.some(x => x.id === a.id)).map(Adjuntos.meta);
    nuevos.filter(a => o.adjuntos.some(x => x.id === a.id)).forEach(a => comunes.push({ col: 'adjuntos', tipo: 'put', doc: Object.assign({ ordenId: o.id }, a) }));
    antes.filter(a => !o.adjuntos.some(x => x.id === a.id)).forEach(a => comunes.push({ col: 'adjuntos', tipo: 'del', id: a.id }));
    for (let intento = 1; ; intento++) {
      if (!previo) { o.secuencia = Consecutivo.libre(); o.numero = Modelo.numero(o.secuencia, o.fecha); }
      try {
        await Datos.lote(comunes.concat([{ col: 'ordenes', tipo: 'put', doc: o },
          Datos.evento(previo ? 'editar' : 'crear', 'orden', o.id, o.numero + (o.empresa !== 'SINUGRAVAS' ? ' ' + o.empresa : '') + ' · ' + (prov ? prov.nombre : ''))]));
        break;
      } catch (e) {
        /* Otra persona guardó una orden con ese número al mismo tiempo: se traen
           las órdenes nuevas y esta toma el siguiente */
        if (previo || e.codigo !== 'NUMERO_TOMADO' || intento >= 4) throw e;
        await Datos.sincronizar();
      }
    }
    return Datos.orden(o.id);
  },
  /** Llegó la factura: su número, su fecha y los valores de lo comprado. La orden pasa a contabilidad */
  async guardarFactura(entrada, factura, nuevos) {
    Permiso.exigir('editar');
    const o = U.clonar(entrada);
    const numero = String(factura.numero || '').trim();
    const e = {};
    if (!numero) e.factura = 'Escriba el número de la factura.';
    if (!Fecha.valida(factura.fecha)) e.facturaFecha = 'Revise la fecha de la factura.';
    if (!(Modelo.totales(o).subtotal > 0)) e.valores = 'Ponga los valores de la factura en la columna «Valor unitario».';
    if (Object.keys(e).length) throw new ErrorValidacion(e);
    const ahora = this.actual(o);
    const llega = ahora.estado === 'ESPERANDO';
    o.factura = Object.assign({}, ahora.factura, { numero, fecha: factura.fecha });
    return this.guardar(o, nuevos, (llega ? 'Llegó la factura ' : 'Factura corregida: ') + numero,
      { estado: llega ? 'CONTABILIDAD' : ahora.estado, factura: true });
  },
  /** De contado y ya pagada (Juan, 30/10/2026): lo que se paga en efectivo al
      momento, como el arreglo de una carpa, queda con su recibo como pagada, sin
      esperar cotización ni factura. Toma el consecutivo como cualquier orden */
  async guardarPagada(entrada, recibo, nuevos) {
    Permiso.exigir('pagar');
    const o = U.clonar(entrada);
    const previo = o.id ? Datos.orden(o.id) : null;
    const e = {};
    if (o.formaPago !== 'CONTADO') e.formaPago = 'Sólo las de contado se registran como ya pagadas.';
    if (previo && previo.estado !== 'ESPERANDO') e.estado = 'Esta orden ya no está esperando: su pago se registra desde la orden.';
    if (!Fecha.valida(recibo.fecha)) e.pagoFecha = 'Revise la fecha del pago.';
    if (!(Modelo.totales(o).subtotal > 0)) e.valores = 'Ponga lo que se pagó en la columna «Valor unitario».';
    if (Object.keys(e).length) throw new ErrorValidacion(e);
    const numero = String(recibo.numero || '').trim();
    o.factura = { numero: numero || 'S/N', fecha: recibo.fecha };
    o.pago = { fecha: recibo.fecha, nota: 'De contado', contado: true };
    return this.guardar(o, nuevos, 'Pagada de contado el ' + Fecha.corta(recibo.fecha) + (numero ? ' · recibo ' + numero : ''),
      { estado: 'PAGADA', factura: true, pago: true });
  },
  /** Contabilidad, cuando la paga */
  async marcarPagada(entrada, pago) {
    const orden = this.actual(entrada);
    Permiso.exigirOrden(orden, 'pagar');
    if (!(orden.factura && orden.factura.numero)) throw new ErrorDominio('Para marcarla como pagada, primero registre la factura.');
    if (orden.estado === 'PAGADA') throw new ErrorDominio('La orden ya está pagada.');
    if (!Fecha.valida(pago.fecha)) throw new ErrorValidacion({ fecha: 'Revise la fecha del pago.' });
    return this.cambiarEstado(orden, 'PAGADA', { permiso: 'pagar', pago: { fecha: pago.fecha, nota: pago.nota || '' },
      nota: 'Pagada el ' + Fecha.corta(pago.fecha) + (pago.nota ? ' · ' + pago.nota : '') });
  },
  async cambiarEstado(orden, estado, extra) {
    extra = extra || {};
    const n = this.actual(orden);
    Permiso.exigirOrden(n, extra.permiso || 'editar');
    if (!ESTADOS[estado]) throw new ErrorDominio('Estado no válido.');
    if (n.estado === estado && !extra.factura) return Datos.orden(n.id) || n;
    const anterior = n.estado;
    n.estado = estado;
    n.historial = (n.historial || []).concat([this.paso(estado, extra.nota)]);
    if (extra.factura) n.factura = extra.factura;
    if (extra.quitarFactura) n.factura = null;
    if (extra.quitarPago) n.pago = null;
    if (extra.pago) n.pago = extra.pago;
    else if (anterior === 'PAGADA' && estado === 'CONTABILIDAD') n.pago = null;
    if (estado === 'ANULADA') n.anulacion = { motivo: extra.motivo || '', en: Fecha.ahora(), estadoPrevio: anterior };
    else if (anterior === 'ANULADA') n.anulacion = null;
    await Datos.lote([{ col: 'ordenes', tipo: 'put', doc: n },
      Datos.evento('estado', 'orden', n.id, n.numero + ': ' + ESTADOS[anterior].t + ' → ' + ESTADOS[estado].t)]);
    return Datos.orden(n.id);
  },
  /** Se puede borrar en cualquier estado: el administrador, cualquiera, y el
      Editor, las suyas */
  async eliminar(entrada) {
    const o = this.actual(entrada);
    Permiso.exigirOrden(o, 'editar');
    await Datos.lote([{ col: 'ordenes', tipo: 'del', id: o.id }, ...(o.adjuntos || []).map(a => ({ col: 'adjuntos', tipo: 'del', id: a.id })),
      Datos.evento('eliminar', 'orden', o.id, o.numero + ' · ' + Modelo.nombreProveedor(o))]);
  },
  /** Adjuntar después de guardada: la cotización o la factura suelen llegar luego */
  async adjuntar(orden, a) {
    const n = this.actual(orden);
    Permiso.exigirOrden(n, 'editar');
    n.adjuntos = (n.adjuntos || []).concat([Adjuntos.meta(a)]);
    await Datos.lote([{ col: 'adjuntos', tipo: 'put', doc: Object.assign({ ordenId: n.id }, a) }, { col: 'ordenes', tipo: 'put', doc: n },
      Datos.evento('adjuntar', 'orden', n.id, n.numero + ' · ' + a.nombre)]);
    return Datos.orden(n.id);
  },
  async quitarAdjunto(orden, id) {
    const n = this.actual(orden);
    Permiso.exigirOrden(n, 'editar');
    const a = (n.adjuntos || []).find(x => x.id === id);
    n.adjuntos = (n.adjuntos || []).filter(x => x.id !== id);
    await Datos.lote([{ col: 'adjuntos', tipo: 'del', id }, { col: 'ordenes', tipo: 'put', doc: n },
      Datos.evento('quitar adjunto', 'orden', n.id, n.numero + ' · ' + (a ? a.nombre : id))]);
    return Datos.orden(n.id);
  },
  ultimaDe(proveedorId, exceptoId) {
    return Datos.ordenes.filter(o => o.proveedorId === proveedorId && o.id !== exceptoId && o.estado !== 'ANULADA')
      .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || (b.secuencia || 0) - (a.secuencia || 0))[0] || null;
  },
  /** Días desde que se envió (para avisar de lo que no llega) */
  diasEnEstado(o) {
    const h = (o.historial || []).filter(x => x.estado === o.estado).pop();
    return h ? Math.max(0, Math.round((Date.now() - new Date(h.en)) / 864e5)) : 0;
  }
};

const ProveedorService = {
  vacio() {
    return { id: null, nombre: '', nit: '', tipoPersona: 'JURIDICA', categoria: '', contacto: '', cargoContacto: '', telefono: '',
      celular: '', correo: '', direccion: '', ciudad: '', formaPago: '', plazoDias: 0, medioPago: '', notas: '',
      alias: [], activo: true, origen: 'MANUAL', historico: null };
  },
  async guardar(entrada) {
    Permiso.exigir('editar');
    const p = U.clonar(entrada);
    p.nombre = Txt.mayus(String(p.nombre || '').trim().replace(/\s+/g, ' '));
    ['nit', 'categoria', 'contacto', 'cargoContacto', 'telefono', 'celular', 'correo', 'direccion', 'ciudad', 'notas']
      .forEach(k => { p[k] = String(p[k] || '').trim(); });
    p.correo = p.correo.toLowerCase();
    p.plazoDias = p.formaPago === 'CREDITO' ? Math.max(0, Math.round(+p.plazoDias || 0)) : 0;
    Validar.proveedor(p, Datos.proveedores);
    const nuevo = !p.id;
    p.id = p.id || ID();
    p.nombreNorm = Txt.norm(p.nombre);
    p.alias = Array.isArray(p.alias) ? p.alias : [];
    await Datos.lote([{ col: 'proveedores', tipo: 'put', doc: p }, Datos.evento(nuevo ? 'crear' : 'editar', 'proveedor', p.id, p.nombre)]);
    return Datos.prov(p.id);
  },
  /** Qué datos le faltan para que la orden salga completa */
  faltantes(p) {
    const f = [];
    if (!p.nit) f.push('NIT');
    if (!p.telefono && !p.celular) f.push('teléfono');
    if (!p.direccion) f.push('dirección');
    if (!p.ciudad) f.push('ciudad');
    if (!p.correo) f.push('correo');
    return f;
  },
  completo(p) { return !this.faltantes(p).length; },
  usos(p) {
    return { ordenes: Datos.ordenes.filter(o => o.proveedorId === p.id).length, plantillas: Datos.plantillas.filter(x => x.proveedorId === p.id).length };
  },
  /* Un proveedor nunca se borra de verdad: se desactiva y
     su nombre sigue en las órdenes, mantenimientos y documentos que lo citan.
     Al fusionar, la ficha vieja también se queda, inactiva y apuntando a la nueva. */
  fusionado(p) { return !!(p && p.fusionadoCon); },
  /** Junta dos fichas del mismo proveedor: las órdenes y plantillas pasan al
      destino, sus nombres quedan como alias y se completan los datos vacíos. */
  async fusionar(origen, destino) {
    Permiso.exigir('editar');
    if (origen.id === destino.id) throw new ErrorDominio('Escoja otro proveedor.');
    if (this.fusionado(origen) || this.fusionado(destino)) throw new ErrorDominio('Esa ficha ya se fusionó con otra. Escoja la que quedó.');
    const d = U.clonar(destino);
    const alias = new Set([...(d.alias || []), origen.nombre, ...(origen.alias || [])]);
    alias.delete(d.nombre);
    d.alias = [...alias];
    ['nit', 'categoria', 'contacto', 'cargoContacto', 'telefono', 'celular', 'correo', 'direccion', 'ciudad', 'formaPago', 'medioPago', 'notas']
      .forEach(k => { if (!d[k] && origen[k]) d[k] = origen[k]; });
    if (!d.plazoDias && origen.plazoDias) d.plazoDias = origen.plazoDias;
    if (origen.historico) {
      const a = d.historico, b = origen.historico;
      d.historico = a ? { ordenes: a.ordenes + b.ordenes, desde: a.desde < b.desde ? a.desde : b.desde, hasta: a.hasta > b.hasta ? a.hasta : b.hasta } : U.clonar(b);
    }
    const ops = [{ col: 'proveedores', tipo: 'put', doc: d }];
    Datos.ordenes.filter(o => o.proveedorId === origen.id).forEach(o => {
      const n = U.clonar(o); n.proveedorId = d.id; ops.push({ col: 'ordenes', tipo: 'put', doc: n });
    });
    Datos.plantillas.filter(x => x.proveedorId === origen.id).forEach(x => {
      const n = U.clonar(x); n.proveedorId = d.id; ops.push({ col: 'plantillas', tipo: 'put', doc: n });
    });
    const viejo = U.clonar(origen);
    Object.assign(viejo, { activo: false, fusionadoCon: d.id, fusionadoEn: Fecha.ahora() });
    ops.push({ col: 'proveedores', tipo: 'put', doc: viejo });
    ops.push(Datos.evento('fusionar', 'proveedor', d.id, origen.nombre + ' → ' + d.nombre));
    await Datos.lote(ops);
    return Datos.prov(d.id);
  },
  /** Para el selector: primero los que más se usan aquí, luego los del Excel */
  ordenados(soloActivos) {
    const n = new Map();
    Datos.ordenes.forEach(o => n.set(o.proveedorId, (n.get(o.proveedorId) || 0) + 1));
    return Datos.proveedores.filter(p => !soloActivos || p.activo)
      .sort((a, b) => (n.get(b.id) || 0) - (n.get(a.id) || 0) ||
        ((b.historico && b.historico.hasta) || '').localeCompare((a.historico && a.historico.hasta) || '') ||
        a.nombre.localeCompare(b.nombre, 'es'));
  },
  coincide(p, q) {
    const nq = Txt.norm(q);
    if (!nq) return true;
    return [p.nombre, p.nit, p.categoria, p.contacto, p.ciudad, ...(p.alias || [])].some(x => Txt.norm(x).includes(nq)) ||
      (Validar.nit(q).length > 3 && Validar.nit(p.nit).includes(Validar.nit(q)));
  }
};

/* Lo que ya se ha pedido alguna vez, para escribir más rápido: al teclear la
   descripción se sugiere con su unidad y el último valor pagado. Sale sólo de
   las órdenes de esta plataforma y de las plantillas, nunca del Excel viejo. */
const Catalogo = {
  _c: null, _f: '',
  articulos() {
    const f = Empresa.activa + '|' + Datos.ordenes.length + '|' + Datos.plantillas.length + '|' +
      Datos.ordenes.reduce((m, o) => (o.actualizadoEn > m ? o.actualizadoEn : m), '') + '|' +
      Datos.plantillas.reduce((m, o) => (o.actualizadoEn > m ? o.actualizadoEn : m), '');
    if (this._c && f === this._f) return this._c;
    const m = new Map();
    const sumar = (it, prov, fecha) => {
      const k = Txt.norm(it.descripcion);
      if (!k) return;
      let a = m.get(k);
      if (!a) { a = { clave: k, descripcion: it.descripcion, unidad: it.unidad || 'UND', valor: 0, fechaValor: '', veces: 0, proveedores: new Map(), ultima: '' }; m.set(k, a); }
      a.veces++;
      if (fecha >= a.ultima) { a.ultima = fecha; a.descripcion = it.descripcion; if (it.unidad) a.unidad = it.unidad; }
      if (+it.valorUnitario > 0 && fecha >= a.fechaValor) { a.valor = +it.valorUnitario; a.fechaValor = fecha; }
      if (prov) a.proveedores.set(prov, (a.proveedores.get(prov) || 0) + 1);
    };
    Datos.plantillas.forEach(p => p.items.forEach(it => sumar(it, p.proveedorId, '')));
    Datos.ordenes.filter(o => o.estado !== 'ANULADA').forEach(o => o.items.forEach(it => sumar(it, o.proveedorId, o.fecha || '')));
    this._c = [...m.values()];
    this._f = f;
    return this._c;
  },
  buscar(q, proveedorId, n) {
    const nq = Txt.norm(q);
    if (nq.length < 2) return [];
    const partes = nq.split(' ');
    return this.articulos().filter(a => partes.every(p => a.clave.includes(p)))
      .sort((a, b) => (b.proveedores.has(proveedorId) ? 1 : 0) - (a.proveedores.has(proveedorId) ? 1 : 0) ||
        (b.clave.startsWith(nq) ? 1 : 0) - (a.clave.startsWith(nq) ? 1 : 0) || b.veces - a.veces || b.ultima.localeCompare(a.ultima))
      .slice(0, n || 8);
  }
};

/* Estadísticas: sólo con lo que se registra en esta plataforma. */
const Analitica = {
  /** p = { modo: 'todo' | 'anio' | 'mes' | 'rango', anio, mes: 'AAAA-MM', desde, hasta } */
  rango(p) {
    p = p || { modo: 'todo' };
    const hoy = Fecha.hoy();
    if (p.modo === 'anio') { const a = p.anio || +hoy.slice(0, 4); return { desde: a + '-01-01', hasta: a + '-12-31', etiqueta: 'Año ' + a }; }
    if (p.modo === 'mes') { const ym = p.mes || hoy.slice(0, 7); const [y, m] = ym.split('-').map(Number);
      return { desde: ym + '-01', hasta: Fecha.iso(new Date(y, m, 0)), etiqueta: Fecha.mesLargo(ym) }; }
    if (p.modo === 'rango' && (p.desde || p.hasta)) {
      return { desde: p.desde || '0000-01-01', hasta: p.hasta || '9999-12-31',
        etiqueta: (p.desde ? Fecha.corta(p.desde) : 'El inicio') + ' – ' + (p.hasta ? Fecha.corta(p.hasta) : 'hoy') };
    }
    return { desde: '0000-01-01', hasta: '9999-12-31', etiqueta: 'Todo el histórico' };
  },
  filtrar(ordenes, f) {
    f = f || {};
    const r = f.rango || this.rango(f.periodo);
    return ordenes.filter(o => (o.fecha || '') >= r.desde && (o.fecha || '') <= r.hasta &&
      (!f.proveedorId || o.proveedorId === f.proveedorId) && (!f.equipoId || o.equipoId === f.equipoId) &&
      (!f.tipo || o.tipo === f.tipo) && (!f.estado || o.estado === f.estado));
  },
  kpis(ordenes) {
    const v = ordenes.filter(Modelo.cuenta);
    const total = U.sumar(v, Modelo.valor);
    const conValor = v.filter(o => Modelo.valor(o) > 0);
    const de = e => v.filter(o => o.estado === e);
    return {
      total, n: v.length, conValor: conValor.length, sinValor: v.length - conValor.length,
      ticket: conValor.length ? Math.round(total / conValor.length) : 0,
      anuladas: ordenes.filter(o => o.estado === 'ANULADA').length,
      cotizaciones: ordenes.filter(o => o.tipo === 'COTIZACION' && o.estado !== 'ANULADA').length,
      sinFactura: de('ESPERANDO').length, porPagar: de('CONTABILIDAD').length, valorPorPagar: U.sumar(de('CONTABILIDAD'), Modelo.valor),
      proveedores: new Set(v.map(o => o.proveedorId)).size,
      articulos: U.sumar(v, o => o.items.length)
    };
  },
  /** Serie mensual: los meses sin compras también salen, en cero */
  porMes(ordenes, desde, hasta) {
    const v = ordenes.filter(Modelo.cuenta);
    if (!v.length && (!desde || desde.startsWith('0000'))) return [];
    const fechas = v.map(o => o.fecha).sort();
    /* Con un periodo escogido se ven todos sus meses; con «todo», del primero
       al último mes con órdenes (como mucho los últimos tres años). */
    const d = desde && !desde.startsWith('0000') ? desde.slice(0, 7) : (fechas[0] || Fecha.hoy()).slice(0, 7);
    const h = hasta && !hasta.startsWith('9999') ? hasta.slice(0, 7) : (fechas[fechas.length - 1] || Fecha.hoy()).slice(0, 7);
    const meses = Fecha.meses(d, h).slice(-36);
    const m = new Map(meses.map(x => [x, { ym: x, valor: 0, n: 0 }]));
    v.forEach(o => { const x = m.get(Fecha.ym(o.fecha)); if (x) { x.valor += Modelo.valor(o); x.n++; } });
    return [...m.values()];
  },
  ranking(ordenes, por) {
    const v = ordenes.filter(Modelo.cuenta);
    const m = new Map();
    const sumar = (id, nombre, valor, extra) => {
      let x = m.get(id);
      if (!x) { x = { id, nombre, valor: 0, n: 0, cantidad: 0, unidad: '', proveedores: new Set() }; m.set(id, x); }
      x.valor += valor; x.n++;
      if (extra) { x.cantidad += extra.cantidad || 0; if (extra.unidad) x.unidad = extra.unidad; if (extra.prov) x.proveedores.add(extra.prov); }
    };
    if (por === 'articulo') {
      v.forEach(o => {
        const fact = o.total > 0 && o.factura && +o.factura.valor > 0 ? +o.factura.valor / o.total : 1;
        o.items.forEach(it => sumar(Txt.norm(it.descripcion), it.descripcion, Math.round(Modelo.totalItem(it) * fact),
          { cantidad: +it.cantidad || 0, unidad: it.unidad, prov: o.proveedorId }));
      });
    } else {
      v.forEach(o => {
        let id, nombre;
        if (por === 'proveedor') { id = o.proveedorId; nombre = Modelo.nombreProveedor(o); }
        else if (por === 'equipo') { id = o.equipoId || '—'; nombre = Modelo.nombreEquipo(o) || 'Sin equipo o destino'; }
        else if (por === 'tipo') { id = o.tipo; nombre = TIPOS[o.tipo].t; }
        else if (por === 'estado') { id = o.estado; nombre = ESTADOS[o.estado].t; }
        else if (por === 'tipoEquipo') { const e = Datos.equipo(o.equipoId); id = e ? e.tipo : '—'; nombre = e ? TIPOS_EQUIPO[e.tipo] : 'Sin equipo'; }
        sumar(id, nombre, Modelo.valor(o));
      });
    }
    return [...m.values()].sort((a, b) => b.valor - a.valor || b.n - a.n || String(a.nombre).localeCompare(String(b.nombre), 'es'));
  }
};

/* Revisión de integridad: lo que no debería pasar nunca, por si pasó. */
const Integridad = {
  revisar() {
    const out = [];
    const porSec = U.agrupar(Datos.ordenes.filter(o => o.secuencia), o => o.secuencia);
    const rep = [...porSec.values()].filter(g => g.length > 1);
    out.push(rep.length ? { nivel: 'err', texto: 'Números repetidos: ' + rep.map(g => g[0].numero).join(', ') + '.' }
      : { nivel: 'ok', texto: 'Ningún número de orden está repetido (' + Txt.plural(Datos.ordenes.length, 'orden', 'órdenes') + ').' });
    const sinProv = Datos.ordenes.filter(o => !Datos.prov(o.proveedorId));
    out.push(sinProv.length ? { nivel: 'warn', texto: Txt.plural(sinProv.length, 'orden', 'órdenes') + ' apuntan a un proveedor que ya no existe: ' + sinProv.map(o => o.numero).join(', ') + '. Se imprimen con los datos que quedaron copiados.' }
      : { nivel: 'ok', texto: 'Todas las órdenes tienen su proveedor.' });
    const sinEq = Datos.ordenes.filter(o => o.equipoId && !Datos.equipo(o.equipoId));
    if (sinEq.length) out.push({ nivel: 'warn', texto: Txt.plural(sinEq.length, 'orden', 'órdenes') + ' apuntan a un equipo borrado: ' + sinEq.map(o => o.numero).join(', ') + '.' });
    const malTot = Datos.ordenes.filter(o => { const t = Modelo.totales(o); return t.total !== o.total || t.subtotal !== o.subtotal; });
    out.push(malTot.length ? { nivel: 'err', texto: 'Totales que no cuadran con sus artículos: ' + malTot.map(o => o.numero).join(', ') + '.', reparar: 'totales' }
      : { nivel: 'ok', texto: 'Los totales de todas las órdenes cuadran con sus artículos.' });
    out.push({ nivel: 'ok', texto: 'La próxima orden será la ' + Consecutivo.vistaPrevia() + (Consecutivo.maximo() ? ', después de la última que se hizo.' : ', como está en Configuración.') });
    const claves = U.agrupar(Datos.proveedores.filter(p => !p.fusionadoCon), p => Txt.clave(p.nombre));
    const dupP = [...claves.values()].filter(g => g.length > 1);
    out.push(dupP.length ? { nivel: 'warn', texto: 'Proveedores que parecen el mismo: ' + dupP.map(g => g.map(p => p.nombre).join(' / ')).join('; ') + '. Use «Fusionar».' }
      : { nivel: 'ok', texto: 'No hay proveedores duplicados (' + Datos.proveedores.length + ').' });
    return out;
  },
  async repararTotales() {
    Permiso.exigir('configurar');
    const ops = [];
    Datos.ordenes.forEach(o => {
      const t = Modelo.totales(o);
      if (t.total !== o.total || t.subtotal !== o.subtotal) {
        const n = U.clonar(o); Object.assign(n, { subtotal: t.subtotal, iva: t.iva, retencion: t.retencion, total: t.total });
        ops.push({ col: 'ordenes', tipo: 'put', doc: n });
      }
    });
    if (ops.length) { ops.push(Datos.evento('reparar', 'sistema', '', 'Totales recalculados: ' + (ops.length))); await Datos.lote(ops); }
    return ops.length ? ops.length - 1 : 0;
  }
};

/* Preferencias de este navegador (tema, menú contraído, filtros). Si el
   navegador no deja guardarlas, todo funciona igual: sólo no las recuerda. */
const Prefs = {
  get(k, def) { try { const v = localStorage.getItem(APP.prefs + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(APP.prefs + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } }
};

const Router = (() => {
  const rutas = [];
  let actual = null, ultimoHash = location.hash || '#/', ignorar = false;
  const R = {
    /** Hay un formulario con cambios sin guardar: se pregunta antes de salir */
    sucio: false,
    /** accion: la que pide la sección; sin ella se ve «no es de su rol» */
    def(patron, vista, accion) {
      const claves = [];
      const re = new RegExp('^' + patron.replace(/:(\w+)/g, (_, k) => { claves.push(k); return '([^/]+)'; }) + '$');
      rutas.push({ patron, re, claves, vista, accion });
    },
    /** La acción que pide una dirección («/plantillas» → 'editar'), o null si es de todos */
    accion(ruta) { const r = rutas.find(x => x.re.test(ruta)); return (r && r.accion) || null; },
    actual() { return actual; },
    /** reemplazar: la pantalla de donde se sale no queda en el historial del
        navegador (después de guardar no se vuelve al formulario con «atrás») */
    ir(destino, opts) {
      const h = destino.startsWith('#') ? destino : '#' + destino;
      if (location.hash === h) R.resolver();
      else if (opts && opts.reemplazar) location.replace(h);
      else location.hash = h;
    },
    async resolver(silencio) {
      const h = location.hash.replace(/^#/, '') || '/';
      const [ruta, qs] = h.split('?');
      const q = Object.fromEntries(new URLSearchParams(qs || ''));
      const r = rutas.find(x => x.re.test(ruta));
      if (!r) { R.ir('/'); return; }
      const m = r.re.exec(ruta);
      const params = {};
      r.claves.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
      const mismaVista = actual && actual.patron === r.patron && actual.ruta === ruta;
      const vista = r.accion && !Permiso.puede(r.accion) ? VistaSinPermiso : r.vista;
      actual = { ruta, params, q, vista, patron: r.patron };
      /* Al cambiar de pantalla no queda ninguna ventana encima; al repintar la
         misma (otra pestaña guardó algo) no se le cierra nada a quien escribe. */
      if (!silencio) Modal.cerrarTodos();
      Combo.cerrarTodos();
      Menu.cerrar();
      if (!silencio && !mismaVista) window.scrollTo(0, 0);
      Shell.cerrarMenuMovil();
      /* Cada vista se pinta en un contenedor nuevo: los eventos que ate se van
         con él al cambiar de pantalla y nunca se acumulan. */
      const cont = document.createElement('div');
      cont.className = 'vista';
      $('#content').replaceChildren(cont);
      Combo.limpiar();
      const y = silencio ? window.scrollY : 0;
      try {
        const t = vista.titulo ? vista.titulo(params, q) : [APP.nombre, ''];
        Shell.titulo(t[0], t[1]);
        await vista.render(cont, params, q);
      } catch (e) {
        console.error(e);
        cont.innerHTML = Comp.fallo(e);
      }
      if (silencio) window.scrollTo(0, y);
      Bus.emit('ruta:cambio', actual);
    },
    iniciar() {
      addEventListener('hashchange', async () => {
        if (ignorar) { ignorar = false; return; }
        if (R.sucio) {
          const ok = await Modal.confirmar({ titulo: 'Hay cambios sin guardar', mensaje: 'Si sale ahora se pierde lo que escribió en esta pantalla.',
            ok: 'Salir sin guardar', cancelar: 'Seguir editando', peligro: true });
          if (!ok) { ignorar = true; location.hash = ultimoHash; return; }
          R.sucio = false;
        }
        ultimoHash = location.hash || '#/';
        R.resolver();
      });
      addEventListener('beforeunload', e => { if (R.sucio) { e.preventDefault(); e.returnValue = ''; } });
      R.resolver();
    }
  };
  return R;
})();

/* Búsqueda global (Ctrl + K): órdenes, proveedores, equipos, plantillas y atajos */
const Buscador = {
  inp: null, panel: null, items: [], hl: -1,
  iniciar(inp, panel) {
    this.inp = inp; this.panel = panel;
    inp.addEventListener('input', U.debounce(() => this.pintar(), 90));
    inp.addEventListener('focus', () => { if (inp.value.trim()) this.pintar(); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); this.mover(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.mover(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); this.elegir(this.hl >= 0 ? this.hl : 0); }
      else if (e.key === 'Escape') { this.cerrar(); inp.blur(); }
    });
    document.addEventListener('mousedown', e => { if (!inp.parentNode.contains(e.target)) this.cerrar(); });
    panel.addEventListener('mousedown', e => {
      const i = e.target.closest('[data-i]');
      if (i) { e.preventDefault(); this.elegir(+i.dataset.i); }
    });
  },
  resultados(q) {
    const nq = Txt.norm(q);
    const g = [];
    if (!nq) return g;
    const ord = Datos.ordenes.filter(o => [o.numero, Modelo.codigo(o), Modelo.nombreProveedor(o), o.concepto, o.referencia, Modelo.nombreEquipo(o),
      o.factura && o.factura.numero, ...o.items.map(i => i.descripcion)].some(x => Txt.norm(x).includes(nq)))
      .sort((a, b) => (b.secuencia || 0) - (a.secuencia || 0)).slice(0, 7);
    if (ord.length) g.push({ t: 'Órdenes', items: ord.map(o => ({ ic: 'doc', html: '<span class="mono fw7">' + esc(Modelo.codigo(o)) + '</span> · ' + Txt.resaltar(Modelo.nombreProveedor(o), q),
      m: Money.fmt(o.total) + ' · ' + ESTADOS[o.estado].t, ir: '/orden/' + o.id })) });
    const hx = HistoricoExcel.lista().filter(o => [o.numero, Modelo.codigo(o), o.excel.hoja, Modelo.nombreProveedor(o), o.excel.textoProveedor, Modelo.nombreEquipo(o),
      ...o.items.map(i => i.descripcion + ' ' + i.observacion)].some(x => Txt.norm(x).includes(nq)))
      .sort(HistoricoExcel.porNumero).slice(0, 5);
    if (hx.length) g.push({ t: 'Del Excel (histórico)', items: hx.map(o => ({ ic: 'archive', html: '<span class="mono fw7">' + esc(Modelo.codigo(o)) + '</span> · ' + Txt.resaltar(Modelo.nombreProveedor(o), q),
      m: Fecha.corta(o.fecha), ir: '/orden/' + o.id })) });
    const prov = Datos.proveedores.filter(p => !p.fusionadoCon && ProveedorService.coincide(p, q)).slice(0, 6);
    if (prov.length) g.push({ t: 'Proveedores', items: prov.map(p => ({ ic: 'building', html: Txt.resaltar(p.nombre, q), m: p.categoria || '', ir: '/proveedor/' + p.id })) });
    const eq = Datos.equipos.filter(x => EquipoService.coincide(x, q)).slice(0, 5);
    if (eq.length) g.push({ t: 'Equipos y destinos', items: eq.map(x => ({ ic: 'truck', html: Txt.resaltar(x.nombre, q), m: TIPOS_EQUIPO[x.tipo], ir: '/equipos?ver=' + x.id })) });
    const pl = Datos.plantillas.filter(p => Txt.norm(p.nombre).includes(nq)).slice(0, 4);
    if (pl.length) g.push({ t: 'Plantillas', items: pl.map(p => ({ ic: 'layers', html: Txt.resaltar(p.nombre, q), m: Txt.plural(p.items.length, 'artículo'), ir: '/orden-nueva?plantilla=' + p.id })) });
    const acc = [
      { k: 'nueva orden compra crear', ic: 'plus', t: 'Nueva orden de compra', ir: '/orden-nueva' },
      { k: 'nuevo proveedor crear', ic: 'building', t: 'Nuevo proveedor', ir: '/proveedores?nuevo=1' },
      { k: 'estadisticas graficas reportes', ic: 'chart', t: 'Estadísticas', ir: '/estadisticas' },
      { k: 'respaldo copia seguridad backup', ic: 'database', t: 'Copias de seguridad', ir: '/respaldos' },
      { k: 'configuracion consecutivo empresa firma logo', ic: 'cog', t: 'Configuración', ir: '/configuracion' }
    ].filter(a => a.k.split(' ').some(w => w.startsWith(nq)) || Txt.norm(a.t).includes(nq));
    if (acc.length) g.push({ t: 'Ir a', items: acc.map(a => ({ ic: a.ic, html: esc(a.t), m: '', ir: a.ir })) });
    return g;
  },
  pintar() {
    const q = this.inp.value.trim();
    if (!q) { this.cerrar(); return; }
    const g = this.resultados(q);
    this.items = [];
    let html = '';
    g.forEach(gr => {
      html += '<div class="gsr-g">' + esc(gr.t) + '</div>';
      gr.items.forEach(it => {
        html += '<div class="gsr-i" data-i="' + this.items.length + '">' + Icon(it.ic, '', 14) + '<span class="gi-t">' + it.html + '</span>' +
          (it.m ? '<span class="gi-m">' + esc(it.m) + '</span>' : '') + '</div>';
        this.items.push(it);
      });
    });
    if (!this.items.length) html = '<div class="gsr-vacio">Nada coincide con «' + esc(q) + '».</div>';
    this.panel.innerHTML = html;
    this.panel.classList.remove('hidden');
    this.hl = this.items.length ? 0 : -1;
    this.marcar();
  },
  mover(d) { if (!this.items.length) return; this.hl = (this.hl + d + this.items.length) % this.items.length; this.marcar(); },
  marcar() {
    $$('.gsr-i', this.panel).forEach((e, i) => e.classList.toggle('hl', i === this.hl));
    const e = $('.gsr-i.hl', this.panel);
    if (e) e.scrollIntoView({ block: 'nearest' });
  },
  elegir(i) {
    const it = this.items[i];
    if (!it) return;
    this.cerrar();
    this.inp.value = '';
    this.inp.blur();
    Router.ir(it.ir);
  },
  cerrar() { if (this.panel) { this.panel.classList.add('hidden'); this.panel.innerHTML = ''; } this.items = []; }
};
